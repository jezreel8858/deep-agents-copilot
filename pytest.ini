[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = . tools/otel-langfuse tools/headless-governance-runner/src
addopts = -ra -m "not slow"
markers =
    slow: testes E2E reais (ex.: spawns de `git commit` via subprocess acionando o hook bash de pre-commit) que são lentos no Windows/Git-for-Windows (MSYS2) quando stdio é redirecionado via pipes anônimos (sem console real). Rodar explicitamente com `-m slow`; excluídos do loop rápido de dev com `-m "not slow"`.

