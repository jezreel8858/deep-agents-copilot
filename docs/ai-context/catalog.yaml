# Catalog de Binding — Eco-Sistema 
# ======================================================
#
# PROPÓSITO:
# Este arquivo é o manifest de binding instanciado para o ecossistema .
# Gerado inicialmente pelo binding-initializer a partir de esqueleto inline
# (ver .github/agents/binding-initializer.agent.md, seção "Esqueletos Inline").
#
# ⚠️  ARQUIVO COMPARTILHADO/COMMITADO — NUNCA registre projetos aqui (R-043).
#     Projetos locais vivem em `catalog.local.yaml` (gitignored, ver abaixo).
#
# HIERARQUIA:
# 1. Global rules (CLAUDE.md, .github/copilot-instructions.md) — sempre carregados
# 2. Adapters por stack (applyTo glob em .github/instructions/*.md) — condicional
# 3. Projeto específico — Local Overlay (catalog.local.yaml, runtime, R-043)
#
# MANUTENÇÃO:
# - Adicionar projetos: /add-project-context <caminho>  → grava em catalog.local.yaml (NUNCA aqui)
# - Remover projetos: /del-project-context <nome>        → remove de catalog.local.yaml (NUNCA aqui)
# - NÃO editar manualmente a seção `projetos:` — ela não existe mais neste arquivo compartilhado
# - Campo `extends:` em projetos declara herança das instruções genéricas disponíveis em adapters:

version: "1.2"
ecosystem: "app-ecossistema"
lastUpdated: "2026-09-01"
maintainer: "eco-sistema-app"


# ============================================
# BINDINGS GLOBAIS
# ============================================
global:
  - id: "ai-governance"
    name: "Governança Global de IA"
    source: "CLAUDE.md"
    description: "Fonte de verdade operacional — regras normativas globais"
    priority: 100
    applyTo: "*"
    audience: "all"

  - id: "copilot-ops"
    name: "Instruções Operacionais do Copilot"
    source: ".github/copilot-instructions.md"
    description: "Roteamento rápido, agents, skills, binding"
    priority: 75
    applyTo: "*"
    audience: "all"

# ============================================
# ADAPTERS DE STACK
# ============================================
adapters:
  - id: "base-backend"
    name: "Backend — Java/Spring Boot"
    source: ".github/instructions/spring-boot-backend.instructions.md"
    description: "Convenções genéricas de backend Java/Spring Boot (reutilizável por qualquer projeto)"
    priority: 50
    applyTo:
      - "src/main/java/**/*.java"
      - "src/test/java/**/*.java"
      - "pom.xml"
    audience: ["developers", "backend-team"]
    scope:
      - "Entities, Services, Controllers"
      - "Exceções e Logging"
      - "Testes Unitários JUnit 5"
      - "Persistência e Banco de Dados"

  - id: "base-frontend"
    name: "Frontend — Angular 21"
    source: ".github/instructions/angular-v21-frontend.instructions.md"
    description: "Convenções genéricas de frontend Angular 21 (reutilizável por qualquer projeto)"
    priority: 50
    applyTo:
      - "src/**/*.ts"
      - "src/**/*.js"
      - "angular.json"
      - "tsconfig.json"
    audience: ["developers", "frontend-team"]
    scope:
      - "Arquitetura Angular 21 e Signals"
      - "Change Detection e Performance"
      - "Testes Jasmine/Karma + Playwright"
      - "SCSS e Estilização"

  - id: "base-python"
    name: "Backend — Python"
    source: ".github/instructions/python-backend.instructions.md"
    description: "Convenções genéricas de backend Python (reutilizável por qualquer projeto)"
    priority: 50
    applyTo:
      - "**/*.py"
      - "**/pyproject.toml"
      - "**/requirements*.txt"
    audience: ["developers", "backend-team"]

  - id: "base-database"
    name: "Banco de Dados / Migrações"
    source: ".github/instructions/database.instructions.md"
    description: "Convenções genéricas de banco de dados, migrações e queries (reutilizável)"
    priority: 50
    applyTo:
      - "migrations/**"
      - "**/*.sql"
      - "schema/**"
    audience: ["developers", "dba-team"]

  - id: "base-devops"
    name: "DevOps / CI-CD / Containers"
    source: ".github/instructions/devops.instructions.md"
    description: "Convenções genéricas de Docker, Kubernetes e CI/CD (reutilizável)"
    priority: 50
    applyTo:
      - "**/Dockerfile*"
      - "kubernetes/**"
      - ".github/workflows/**"
      - "docker-compose*.yml"
    audience: ["devops-team", "developers"]


# ============================================
# PROJETOS — LOCAL OVERLAY PATTERN (R-043)
# ============================================
# ⛔ Esta seção NÃO existe mais neste arquivo (R-043 — Desacoplamento Total).
#
# Projetos registrados via /add-project-context vivem exclusivamente em:
#   → docs/ai-context/catalog.local.yaml   (gitignored — NUNCA commitado)
#
# Template/schema de referência (tracked, sem dados reais):
#   → docs/ai-context/catalog.local.yaml.example
#
# MERGE EM TEMPO DE LEITURA (nunca em escrita):
#   Todo agent/prompt que precisa da lista de projetos DEVE ler AMBOS os arquivos
#   e mesclar em memória: projetos = catalog.local.yaml.projetos (se existir) senão [].
#   NUNCA escrever entrada de projeto de volta neste arquivo (catalog.yaml).
#
# Por quê: evita que um `git commit`/`git push` de rotina suba acidentalmente
# caminhos/nomes de projetos locais (privados) para o repositório de governança
# compartilhado. Ver CLAUDE.md § R-043 e .githooks/pre-commit (defesa em profundidade).
#
# Para adicionar: /add-project-context <caminho>  (grava em catalog.local.yaml)
# Para remover:  /del-project-context <nome>       (remove de catalog.local.yaml)


# ============================================
# DISCOVERY
# ============================================
discovery:
  priority_order:
    - "Regras globais (CLAUDE.md)"
    - "Instruções operacionais (.github/copilot-instructions.md)"
    - "Adapters de stack (applyTo glob)"
    - "Customizações por projeto (/add-project-context)"

  fallback:
    - "Se nenhum adapter combinar: usar global rules"
    - "Se conflito entre adapters: aplicar de maior prioridade"

# ============================================
# METADADOS
# ============================================
metadata:
  governance_repo: "eco-sistema-app"
  initialized_by: "binding-initializer"
  tools_compatible:
    - "GitHub Copilot (VS Code, JetBrains)"
    - "Cursor IDE"
    - "Claude Code"

# ============================================
# ARTEFATOS DE GOVERNANÇA DE AGENTS
# Registra artefatos estruturais criados pelo ecossistema de IA
# (além dos adapters de stack acima)
# ============================================
governance_artefacts:
  - id: "routing-graph"
    name: "Grafo de Roteamento do Agent Router"
    source: "docs/ai-context/routing-graph.yaml"
    description: >
      Fonte de verdade estrutural do agent-router: nós (agents), arestas (condições
      de roteamento com keywords e thresholds) e política de cascata (rule→semantic→LLM).
      A Decision Tree em agent-router.agent.md é documentação derivada deste arquivo.
    version: "1.0"
    created: "2026-08-28"
    consumed_by:
      - "agent-router"
    related_rule: "R-040"

  - id: "evals-roteamento"
    name: "Suíte de Casos de Avaliação de Roteamento"
    source: ".github/agents/evals/casos-roteamento.yaml"
    description: >
      Suíte de testes de regressão de roteamento: casos canônicos (threshold 0.90),
      ambíguos (0.70), regressão (1.00) e segurança (1.00). Atualizar obrigatoriamente
      em toda PR que altere agent-router.agent.md ou routing-graph.yaml.
    version: "1.0"
    created: "2026-08-28"
    consumed_by:
      - "agent-evals-lab"
      - "agent-router"
    maintenance_rule: "Equivalente a R-015 — atualização atômica com mudanças no router"
