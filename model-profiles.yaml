      premium: Claude Sonnet 5.5
      stack-arch: Gemini 4 Argon
    agents:
      security-reviewer: Gemini 4 Argon
      code-review: Gemini 4 Argon
      bug-triage: Gemini 4 Argon

  economico:
    extends: balanceado
    description: "Rebaixa orquestração para Gemini 3.8 Flash e demais tiers operacionais para Claude Haiku 5.5; preserva D6."
    quality_warning: "Roteamento, planos e código podem perder precisão; routers podem errar triagem."
