name: Agent Routing Quality Gate

on:
  pull_request:
    paths:
      - '.github/agents/**'
      - '.github/prompts/**'
      - '.github/skills/**'
      - 'model-allowlist.yaml'
      - 'model-profiles.yaml'
      - 'tests/routing_gate/**'
      - 'tests/governance_audit/**'
      - 'tests/operational_flow/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'tools/**'
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/agents/**'
      - '.github/prompts/**'
      - '.github/skills/**'
      - 'model-allowlist.yaml'
      - 'model-profiles.yaml'
      - 'tests/routing_gate/**'
      - 'tests/governance_audit/**'
      - 'tests/operational_flow/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'tools/**'

permissions:
  contents: read

jobs:
  routing-quality-gate:
    runs-on: ubuntu-latest
    name: Verify Routing Graph and Governance Integrity
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Gates mecânicos — Single Canonical Source Drift Checks (R-040/R-042/R-051/R-059/R-060)
        run: |
          python tools/agent_protocol_sync/sync_execution_protocol.py --check
          python tools/agent_router_return_sync/sync_router_return.py --check
          python tools/agent_source_docs_sync/sync_required_source_docs.py --check
          python tools/agentcard_exporter/export_agentcards.py --check

      - name: Variant leak guard & Model Allowlist Parity (T-B3.5)
        run: |
          pytest tests/governance_audit/test_model_profiles_parity.py tests/governance_audit/test_model_allowlist_governance.py -v --tb=short

      - name: Run Routing Quality Gate & Governance Smells Suite
        run: pytest tests/routing_gate/ tests/governance_audit/ tests/operational_flow/ -v --tb=short -m "slow or not slow"
