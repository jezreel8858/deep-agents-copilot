        - "flask"
        - "pytest"
        - "pydantic"
        - "sqlalchemy"
        - "asyncio"
        - "uvicorn"
        - "celery"
      sinal_r006: "É qualquer solicitação do ecossistema Python Backend? (despacha para o catálogo de 7 especialistas backend em .github/agents/backend/python/python-catalog.yaml)"

  # Supervisor e roteador de domínio Java Legado Struts (Hierarchical Sub-Router)
  - de: agent-router
    para: struts-router
    prioridade: 1.6
    threshold_score: 0.85
    nivel_routing: rule-based
    condicoes:
