    exclusividade_motor_grafo:
      regra: "R-045"
      obrigatorio: "code-knowledge-graph e co-agente OBRIGATORIO (nao apenas sub-rotina) nas etapas 1, 3, 4 e 5 - migracao de framework e refatoracao estrutural em larga escala; blast radius/ciclos/dead-code NUNCA sao mapeados manualmente por tech-solution-architect ou domain routers"
