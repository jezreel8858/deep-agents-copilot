# ─────────────────────────────────────────────
# ARESTAS — condições de roteamento
# Cada aresta define: origem, destino, sinais de ativação e threshold mínimo
# ─────────────────────────────────────────────
arestas:
  # Health check obrigatório (pré-triagem)
  - de: agent-router
    para: binding-initializer
    prioridade: 0
    threshold_score: 0  # null — health check não usa score numérico
    nivel_routing: rule-based
    condicoes:
      tipo: health_check
      regra: "R-034"
      gatilho: ".github/instructions/README.md ausente OU .github/projects.local.yaml.example ausente"

  # Prompt structuring (pré-classificação para casos ambíguos/abertos) — exceção R-041
  - de: agent-router
    para: prompt-structuring
    prioridade: 0.5
    threshold_score: 0  # null — passo condicionado por fast-path
    nivel_routing: rule-based
    condicoes:
      tipo: mandatory_pre_step
      regra: "R-041"
      gatilho: "Após Health Check (R-034) para solicitações ambíguas, abertas ou features novas não estruturadas"
      fast_path_bypass:
        - "WORKFLOW-BUG-FIX (bugs, erros 500, NPE, problemas de layout e regressões)"
        - "WORKFLOW-REFACTORING (refatorações com alvo definido)"
        - "WORKFLOW-TECHNICAL-ANALYSIS (análises e diagnósticos diretos)"
        - "WORKFLOW-GOVERNANCE-MAINTENANCE (auditoria e higiene)"
        - "WORKFLOW-DEPENDENCY-VULNERABILITY-REMEDIATION (CVEs, alertas SCA e bumps de dependência)"
        - "WORKFLOW-RELEASE-READINESS (pre-flight de deploy, auditoria de release e DDL)"
      loop_maximo: 5
      retorno_obrigatorio: agent-router

  # Bug / Erro / Regressão
  - de: agent-router
    para: bug-triage
    prioridade: 1
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "bug"
        - "erro"
        - "regressão"
        - "falha em produção"
        - "não funciona"
        - "não consigo acessar"
        - "quebrou"
        - "exception"
        - "NPE"
        - "500"
        - "stack trace"
      sinal_r006: "É bug/erro/regressão OU um problema relatado pelo usuário (mesmo que a solução final vire feature nova — R-048)?"

  # Gate de segurança para mudanças em autenticação/identidade (R-048.1)
  - de: agent-router
    para: tech-solution-architect
    prioridade: 0.95
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      tipo: security_gate
      regra: "R-048.1"
      keywords:
        - "vincular credencial"
        - "alterar credencial"
        - "provedor de identidade"
        - "login federado"
        - "auth linking"
        - "serviço de autenticação"
        - "autenticação federada"
      sinal_r006: "Mudança toca autenticação/identidade (serviços de auth, linking de provedores, alteração de credencial, sessão/token)? Tratar como security-sensitive, equivalente a regras de segurança de persistência/banco"
      gatilho: "Checkpoint obrigatório via run_subagent para tech-solution-architect (viabilidade) e, se disponível, security-reviewer, ANTES de qualquer implementação"
      proibido: "Implementar diretamente sem declarar este checkpoint no handoff"

  # Revisão de código antes do merge
  - de: agent-router
    para: code-review
    prioridade: 1.5
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "revisar código"
        - "code review"
        - "revisão antes do merge"
        - "analisar pull request"
        - "revisar diff"
        - "revisar pr"
      sinal_r006: "É revisão preventiva de qualidade ANTES do merge (não bug já ocorrido)?"
      nao_confundir_com:
        - "bug em produção"        # → bug-triage (algo já quebrou)
        - "impacto de mudar X"     # → tech-solution-architect (tier B1 local)

  # Revisão especializada de segurança (OWASP/CVE/secrets)
  - de: agent-router
    para: security-reviewer
    prioridade: 1.55
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "revisão de segurança"
        - "security review"
        - "owasp"
        - "cve"
        - "vulnerabilidade"
        - "sql injection"
        - "secrets no código"
        - "sast"
        - "sca"
      sinal_r006: "É revisão ESPECIALIZADA de segurança de aplicação (profundidade OWASP/CVE), não apenas a dimensão genérica de code-review?"
      nao_confundir_com:
        - "segurança do próprio agent de IA"  # → agent-safety-guardrails (skill, não agent)
        - "revisão geral de código"            # → code-review (dimensão genérica)

  # Revisão especializada de performance (CWV/N+1/query)
