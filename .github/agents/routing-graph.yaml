version: "1.0"
description: >
  Grafo de roteamento declarado — fonte de verdade estrutural para o agent-router.
  Nós = agents disponíveis; arestas = condições de roteamento (keywords, sinais R-006, score threshold).
  A Decision Tree em agent-router.agent.md é documentação derivada deste arquivo.
last_updated: "2026-09-15 (v9 — WORKFLOW-FRAMEWORK-MIGRATION: adicionado colaboracao_dual_stack e co_agentes de domain-router-origem/destino em todas as etapas, corrigindo omissao do router legado em migracoes cross-stack)"

# ─────────────────────────────────────────────
# NÓS — agents disponíveis no catálogo
# ─────────────────────────────────────────────
nos:
  - id: agent-router
    tipo: entry_point
    descricao: "Entry point obrigatório — nunca é destino, apenas origem"

  - id: prompt-structuring
    tipo: mandatory_pre_step
    descricao: >
      Passo mandatório pós-health-check (R-041): refina o prompt em loop
      controlado (máx. 5 iterações) no formato <task>/<context>/<constraints>/
      <output_format> e SEMPRE retorna ao agent-router. Nunca é destino final.

  - id: bug-triage
    tipo: downstream
    descricao: "Triagem de bugs e regressões"

  - id: test-strategy
    tipo: downstream
    descricao: "Planejamento e estratégia de testes por risco e matriz de cenários"

  - id: business-rules-extractor
    tipo: downstream
    descricao: "Extração e validação de regras de negócio"

  - id: refactor-planner
    tipo: downstream
    descricao: "Planejamento e decomposição macro de refatoração estrutural com blast radius e rollback (delega execução aos especialistas de stack)"

  - id: docs-engineer
    tipo: downstream
    descricao: >
      Fusão de docs-writer + docs-curator: autoria de documentação técnica
      nova (mode author) e curadoria/padronização de documentação e
      catálogo de governança já existentes (mode curate). Produz
      exclusivamente arquivos .md.

  - id: code-review
    tipo: downstream
    descricao: "Revisão de código (diff/PR) antes do merge — correção, segurança, convenções, impacto, testes e performance; classifica por severidade; read-only, nunca corrige"

  - id: requirements-analyst
    tipo: downstream
    descricao: "Elicitação e estruturação de requisitos funcionais/não-funcionais a partir de pedido de negócio ambíguo (EARS/INVEST/Gherkin/FURPS+); detecta solution-jumping via Five Whys; prospectivo (pedido → requisito), nunca decide arquitetura, não confundir com business-rules-extractor (reverso: código → regra)"

  - id: code-knowledge-graph
    tipo: downstream
    descricao: "Ponto de entrada único para construção/consulta do grafo de conhecimento de código-fonte cross-projeto (RF-001/RF-002/RF-011): nós arquivo/classe/função, arestas import/chamada/herança/tabela-SQL, reaproveitando AST do code-summarizer; puramente determinístico, sem fallback LLM (RNF-008); nunca substituído por chamada direta a lib de parsing/grafo (RNF-004)"

  - id: deep-search
    tipo: fallback
    descricao: "Pesquisa interna aprofundada e externa (atômica/composta) — fallback primário"

  - id: tech-solution-architect
    tipo: fallback
    descricao: "Arquiteto de solução técnica, blueprint, contratos de integração e divisão por stack; absorve impacto local via tier B1"

  - id: governance-factory
    tipo: downstream
    descricao: >
      Fusão de agent-factory + skill-factory + prompt-factory: cria/revisa
      agent (.agent.md), skill (SKILL.md) ou prompt (.prompt.md) via
      parâmetro type, com atualização atômica do catálogo correspondente.

  - id: governance-maintainer
    tipo: downstream
    descricao: >
      Especialista executor em manutenção atômica, refatoração estrutural e sincronização
      em lote de artefatos de governança (.github/agents, .github/skills, .github/prompts,
      catálogos e grafo de roteamento) com single-turn batching e context-mode.

  - id: binding-initializer
    tipo: health_check
    descricao: "Inicialização de binding context — acionado antes da triagem se instructions ou template de overlay ausentes"

  - id: adapter-generator
    tipo: downstream
    descricao: "Geração automática de adapters via /add-project-context"

  - id: angular-router
    tipo: domain_router
    descricao: "Supervisor hierárquico do domínio Angular — despacha para os 8 especialistas registrados em .github/agents/frontend/angular/angular-catalog.yaml"


  - id: spring-boot-router
    tipo: domain_router
    descricao: "Supervisor hierárquico do domínio Spring Boot — despacha para os 7 especialistas registrados em .github/agents/backend/spring-boot/spring-boot-catalog.yaml"

  - id: spring-reactive-router
    tipo: domain_router
    descricao: "Supervisor hierárquico do domínio Spring Reactive — despacha para os 7 especialistas registrados em .github/agents/backend/spring-reactive/spring-reactive-catalog.yaml"

  - id: ejb-router
    tipo: domain_router
    descricao: "Supervisor hierárquico do domínio Java Legado EJB — despacha para os 7 especialistas registrados em .github/agents/backend/ejb/ejb-catalog.yaml"

  - id: python-router
    tipo: domain_router
    descricao: "Supervisor hierárquico do domínio Python Backend — despacha para os 7 especialistas registrados em .github/agents/backend/python/python-catalog.yaml"

  - id: struts-router
    tipo: domain_router
    descricao: "Supervisor hierárquico do domínio Java Legado Struts — despacha para os 7 especialistas registrados em .github/agents/backend/struts/struts-catalog.yaml"

  - id: database-router
    tipo: domain_router
    descricao: "Supervisor hierárquico do domínio de Banco de Dados — despacha para os 6 especialistas Oracle e Informix registrados em .github/agents/backend/database/database-catalog.yaml"

  - id: security-reviewer
    tipo: downstream
    descricao: "Revisão especializada de segurança de aplicação (OWASP Top 10:2025, ASVS 5.0, SCA/CVE, secrets) — read-only; distinto de agent-safety-guardrails (segurança do próprio agent de IA)"

  - id: performance-agent
    tipo: downstream
    descricao: "Revisão especializada de performance (Core Web Vitals frontend, N+1/latência backend, otimização de query banco) — read-only"

  - id: compliance-guardrails
    tipo: downstream
    descricao: "Avaliação de conformidade regulatória de aplicação (SOC 2, GDPR/LGPD, HIPAA, ISO 27001) — audit trails, least privilege; read-only; distinto de agent-safety-guardrails"

  - id: feature-planner
    tipo: downstream
    descricao: "Decomposição de requisito de feature nova em subtasks executáveis com dependências e paralelização; distinto de refactor-planner (refatoração de código existente)"


  - id: devops-engineer
    tipo: downstream
    descricao: "Revisão de artefatos DevOps (Dockerfile/Kubernetes/CI-CD/IaC) por segurança/resiliência/boas práticas — read-only"

  - id: debugger
    tipo: downstream
    descricao: "Investigação de causa raiz a partir de stack trace/log — call graph, hipótese testável; complementa bug-triage com investigação mais profunda"

  - id: code-style-enforcer
    tipo: downstream
    descricao: "Verificação de aderência a convenções de estilo documentadas no adapter de stack; nunca bloqueador"

  - id: runtime-verifier
    tipo: downstream
    descricao: "Verificação de saúde do ambiente (build limpo, dependências, serviços dependentes) antes de disparar testes/codificadores; read-only, nunca corrige"

  - id: pr-gatekeeper
    tipo: downstream
    descricao: "Preparação de PR pós-aprovação do quality gate — diff, commit semântico, matriz de risco, CHANGELOG.md; nunca executa git add/commit/push"

  - id: database-specialist
    tipo: downstream
    descricao: "Migrações de schema (Flyway/Liquibase/Alembic), otimização de query e integridade referencial; rollback sempre documentado"

  - id: agent-auditor
    tipo: downstream
    descricao: "Auditor de governança em meta-nível para analisar smells e gaps no catálogo de agents/skills/prompts, validando templates canônicos, R-046/batching, especificações e alinhamento de perfil sem mutação direta, com recomendações e handoff para executores"
  - id: ddd-bounded-context-mapper
    tipo: downstream
    descricao: "Mapeamento semântico de Bounded Contexts (DDD), domínios de negócio e God Classes a partir de nomenclatura e pacotes; contraparte semântica do code-knowledge-graph; read-only"
  - id: adr-sentinel
    tipo: downstream
    descricao: "Auditoria de conformidade arquitetural contra Architectural Decision Records (ADRs) documentados no projeto, identificando violações, decisões obsoletas e ADRs ausentes; read-only"

  - id: repo-hygiene-auditor
    tipo: downstream
    descricao: "Auditoria de higiene estrutural, documentação essencial (README/CONTRIBUTING/LICENSE), segurança de versionamento (.gitignore, .env) e práticas de CI/CD agnóstica de stack; read-only"

# ─────────────────────────────────────────────
# WORKFLOWS — Máquinas de Estado Canônicas (R-050)
# Define os 5 workflows operacionais determinísticos e suas sequências estritas
# ─────────────────────────────────────────────
convencao_papeis_genericos:
  descricao: >
    Nomes "specialist-<papel>" usados em estados.*.agent sao aliases genericos
    resolvidos pelo domain router ativo (angular-router|spring-boot-router|
    spring-reactive-router|ejb-router|python-router|struts-router) para o id concreto do seu sub-catalogo
    que declara a tag role: correspondente (fixer|tester|stylist|implementer|
    advisory|performance). Tabela completa de resolucao por stack em
    workflows.md secao 1.3. Nunca invocar run_subagent com o nome generico
    literal; match de proximos_agentes_permitidos em politica_desvio strict
    ocorre pela tag role:, nao pela string literal.
  excecao: "database-specialist e agente unico cross-stack, sempre referenciado por nome literal (nunca generico)"

workflows:
  - id: WORKFLOW-BUG-FIX
    nome: "Resolução de Bugs, Defeitos de Layout e Regressões"
    regra: "R-050"
    fast_path: true
    gatilhos:
      - "bug"
      - "erro"
      - "falha"
      - "500"
      - "NPE"
      - "não funciona"
      - "quebrou"
      - "layout quebrado"
      - "desalinhado"
      - "CSS quebrado"
      - "NullPointerException"
      - "regressão"
    rca_estruturado:
      metodologia: "5_whys | fishbone"
      regra_evidencia: "evidence_before_hypothesis_2_fontes_independentes"
      classificacao_falha: "flaky vs regressao_real"
    blast_radius_e_rollback:
      blast_radius_estimado_obrigatorio: true
      rollback_plan_obrigatorio: true
    validacao_anti_falso_verde:
      mini_mutation_check_proporcional: true
    observacao_pos_fix:
      canary_obrigatorio_para_bugs_criticos: true
    estados:
      - etapa: 1
        nome: "triage_and_root_cause"
        agent: "bug-triage"
        sub_rotinas_permitidas: ["debugger", "code-knowledge-graph"]
        rca_gate: "5_whys | fishbone com 2 fontes independentes de evidencia (logs, traces, network, APM)"
        classificacao_defeito: "flaky vs regressao_real (isolar concorrencia/ambiente se flaky)"
        repro_gate: "debugger (tracepoint) | ask_questions"
        max_tentativas_repro_gate: 2
        escalonamento_nao_reproduzivel: "ask_questions (prosseguir_com_hipotese | aguardar_evidencia | encerrar_nao_reproduzivel)"
      - etapa: 2
        nome: "red_test_and_layout_reproduction"
        agent: "specialist-unit-test-writer | specialist-component-test-writer | specialist-integration-test-writer | specialist-ui-stylist"
        pre_flight: "runtime-verifier (baseline check)"
        nota: "integration-test-writer obrigatorio quando o bug so reproduz com contexto de framework (Spring/R2DBC/Testcontainers); component-test-writer para DOM real (Angular)"
      - etapa: 3
        nome: "surgical_bug_fix"
        agent: "specialist-bug-fixer | specialist-ui-stylist"
        sub_rotinas_permitidas: ["database-specialist"]
        pre_requisito_diff: "declaracao de blast_radius_estimado e rollback_plan antes de aplicar a correcao"
        security_checkpoint_condicional: "R-048.1 (tech-solution-architect + security-reviewer) obrigatorio se o diff tocar autenticacao/credenciais/identidade, antes de aplicar o fix"
      - etapa: 4
        nome: "green_test_and_linter_validation"
        agent: "runtime-verifier | specialist-test-fixer"
        max_retries: 3
        mini_mutation_check: "mini mutation-check proporcional ao risco para erradicar falsos-verdes no teste de regressao"
        circuit_breaker: "runtime-verifier (declara_veredito_readonly, nunca reverte) -> specialist-bug-fixer|specialist-test-fixer (executa_revert_via_git conforme rollback_plan) -> ask_questions"
      - etapa: 5
        nome: "quality_gate_and_pr"
        agent: "code-review | pr-gatekeeper"
        observacao_pos_fix: "criterios de canary e telemetria de observacao pos-fix obrigatorios para bugs criticos (P0/P1)"

  - id: WORKFLOW-REFACTORING
    nome: "Refatoração Estrutural, Modernização e Desacoplamento"
    regra: "R-050"
    fast_path: true
    gatilhos:
      - "refatorar"
      - "refatoração"
      - "desacoplar"
      - "clean architecture"
      - "eliminar god class"
      - "modularizar"
      - "remover duplicação"
      - "extrair interface"
    contract_testing:
      pact_consumer_driven: true
      openapi_diff: true
    redundancia_proporcional_blast_radius:
      reverse_symbol_audit: true
      mini_mutation_gate: true
      differential_replay_leve: true
    rollback_governado:
      registro_blast_radius_revertido: true
    estados:
      - etapa: 1
        nome: "ground_truth_rules_extraction"
        agent: "business-rules-extractor"
      - etapa: 2
        nome: "blast_radius_and_graph_mapping"
        agent: "code-knowledge-graph"
        sub_rotinas_permitidas: ["tech-solution-architect"]
        contract_gate: "contract_testing (Pact-style consumer-driven ou OpenAPI diff) se afetar APIs publicas ou consumidores"
        safety_net_gate: "specialist-unit-test-writer (golden master check)"
        threshold_cobertura_por_risco: "test-coverage-governance/SKILL.md § 1 (90 critico | 80 integracao | 70 controller)"
      - etapa: 3
        nome: "refactor_plan_and_safety_net"
        agent: "refactor-planner"
        co_agentes: ["test-strategy"]
        estrategia_decomposicao: "mikado_method"
        sub_rotinas_permitidas: ["database-specialist"]
        checkpoint_aprovacao_condicional: "ask_questions se breaking_change|schema|blast_radius_grande; contextual/implicita (R-031) se escopo local"
        limite_escala_dag: 15
      - etapa: 4
        nome: "incremental_batch_execution"
        agent: "domain-router | specialist-feature-developer"
        protocolo: "efficient-batch-code-modification"
        gate_out_por_no: "compilacao_limpa + testes_verdes + diff_minimo"
      - etapa: 5
        nome: "ground_truth_validation_and_review"
        agent: "business-rules-extractor"
        co_agentes: ["code-review"]
        redundancia_proporcional: "auditoria reversa de simbolos (code-knowledge-graph) + mini mutation gate (test-strategy) + differential replay leve proporcionais ao blast radius"
        circuit_breaker: "refactor-planner (decide_escopo_readonly) -> domain-router/specialist por no (executa_revert registrando blast_radius_revertido)"

  - id: WORKFLOW-TECHNICAL-ANALYSIS
    nome: "Análise Técnica, Diagnóstico e Auditoria Especializada"
    regra: "R-050"
    fast_path: true
    gatilhos:
      - "analisar"
      - "diagnosticar"
      - "como funciona"
      - "mapear arquitetura"
      - "verificar segurança"
      - "avaliar performance"
      - "conformidade adr"
      - "bounded context"
      - "analisar tela"
      - "analisar fluxo"
      - "identificar melhorias"
    estados:
      - etapa: 1
        nome: "specialist_analyst_dispatch"
        agents_permitidos:
          - "code-knowledge-graph"
          - "ddd-bounded-context-mapper"
          - "adr-sentinel"
          - "security-reviewer"
          - "performance-agent"
          - "compliance-guardrails"
          - "tech-solution-architect"
          - "angular-arch-advisor"
          - "spring-boot-arch-advisor"
          - "spring-reactive-arch-advisor"
          - "ejb-arch-advisor"
          - "struts-arch-advisor"
          - "oracle-query-tuner"
          - "informix-query-tuner"
          - "devops-engineer"
          - "code-style-enforcer"
        suporte_fan_out: "handoff-governance/SKILL.md § 5.1 se [P] R-018 e 2+ categorias independentes"
      - etapa: 2
        nome: "deterministic_read_only_collection"
        modo: "advisory_read_only"
        sub_rotinas_permitidas: ["tech-solution-architect", "code-knowledge-graph", "deep-search"]
        max_depth_subrotina: 3
      - etapa: 3
        nome: "synthesis_and_next_step"
        saida_estruturada: "tabela_propostas_acionaveis"
        escape_hatch_sem_achados: "nenhuma_proposta_necessaria_conformidade_validada"
        suporte_fast_chaining: true
        regra_conclusao: "R-047"

  - id: WORKFLOW-FEATURE-DEVELOPMENT
    nome: "Nova Feature e Evolução Funcional E2E"
    regra: "R-050"
    fast_path: false
    gatilhos:
      - "criar feature"
      - "nova funcionalidade"
      - "implementar endpoint"
      - "adicionar tela"
      - "novo módulo"
      - "evoluir fluxo"
    estados:
      - etapa: 1
        nome: "prompt_structuring_refinement"
        agent: "prompt-structuring"
        condicao: "se_ambiguo_ou_alto_nivel"
      - etapa: 2
        nome: "requirements_elicitation"
        agent: "requirements-analyst | feature-planner"
      - etapa: 3
        nome: "technical_blueprint_and_contracts"
        agent: "tech-solution-architect"
        checkpoint_humano: "ask_questions (aprovacao_blueprint)"
        particionamento_escopo: ["frontend_only", "backend_only", "fullstack", "database_only"]
        sub_rotinas_permitidas: ["database-specialist"]
        tasks_backend_tag_obrigatoria: "stack (spring-boot|spring-reactive|ejb|python|struts) por item, nunca lista plana"
      - etapa: 4
        nome: "test_strategy_and_risk_matrix"
        agent: "test-strategy"
        threshold_cobertura_por_risco: "test-coverage-governance/SKILL.md § 1 (90 critico | 80 integracao | 70 controller)"
        casos_borda_seguranca_obrigatorios: true
      - etapa: 5
        nome: "tdd_domain_implementation"
        agent: "domain-router | specialists"
        padrao: "contract_first_tdd"
        protocolo: "efficient-batch-code-modification"
      - etapa: 6
        nome: "quality_gate_and_pr_preparation"
        agent: "code-review | pr-gatekeeper"
        sub_rotinas_permitidas: ["security-reviewer"]
        owasp_security_gate: true
        max_tentativas_remediacao_seguranca: 2
        escalonamento_seguranca: "ask_questions (revisao_manual_pareada)"

  - id: WORKFLOW-GOVERNANCE-MAINTENANCE
    nome: "Auditoria, Padronização e Manutenção de Governança"
    regra: "R-050"
    fast_path: true
    gatilhos:
      - "auditar governança"
      - "novo agent"
      - "nova skill"
      - "novo prompt"
      - "nova stack"
      - "manutenção de catálogo"
      - "corrigir smell de agent"
      - "higiene de repositório"
    estados:
      - etapa: 1
        nome: "read_only_audit_and_diagnosis"
        agents_permitidos: ["agent-auditor", "repo-hygiene-auditor", "governance-factory"]
        sub_rotinas_permitidas: ["deep-search"]
      - etapa: 2
        nome: "human_approval_checkpoint"
        mecanismo: "ask_questions"
      - etapa: 3
        nome: "governed_batch_execution"
        agents_permitidos: ["governance-maintainer", "governance-factory"]
        protocolo: "efficient-batch-code-modification"
        sincronizacao_quadrupla_r015: true
        sincronizacao_por_tipo:
          agent: ["catalog.yaml", "routing-graph.yaml", "evals/casos-roteamento.yaml", "agent-router.agent.md", "README.md"]
          skill: [".index.json", "skills/README.md", "source_docs_consumidores"]
          prompt: ["prompts/README.md"]
        max_tentativas_autofix: 3
      - etapa: 4
        nome: "tier1_governance_quality_gate"
        validacao_automatizada: "pytest (smells, routing, isolation)"
        validacao_comportamental: "agent-evals-lab (60 casos casos-roteamento.yaml)"
        escalonamento_apos_teto: "ask_questions (revisao_manual_diff)"

  - id: WORKFLOW-DEPENDENCY-VULNERABILITY-REMEDIATION
    nome: "Remediação de Vulnerabilidades, CVEs e Atualização de Dependências"
    regra: "R-050"
    fast_path: true
    gatilhos:
      - "atualizar dependência"
      - "atualizar dependencias"
      - "atualizar pacote"
      - "remediar cve"
      - "vulnerabilidade snyk"
      - "trivy alert"
      - "dependabot"
      - "npm audit fix"
      - "upgrade lib"
      - "cve remediation"
    estados:
      - etapa: 1
        nome: "vulnerability_scan_and_advisory_triage"
        agent: "security-reviewer"
        sub_rotinas_permitidas: ["deep-search"]
      - etapa: 2
        nome: "dependency_blast_radius_mapping"
        agent: "code-knowledge-graph"
        sub_rotinas_permitidas: ["tech-solution-architect"]
      - etapa: 3
        nome: "manifest_bump_and_lockfile_sync"
        agent: "domain-router | specialist-feature-developer"
        protocolo: "context-mode"
      - etapa: 4
        nome: "breaking_change_adaptation_and_compilation"
        agent: "domain-router | specialist-bug-fixer"
        sub_rotinas_permitidas: ["specialist-test-fixer"]
        max_retries: 3
        circuit_breaker: "specialist-bug-fixer (executa_revert_manifesto) -> ask_questions"
      - etapa: 5
        nome: "regression_verification_and_sca_gate"
        agent: "runtime-verifier | code-review | security-reviewer"

  - id: WORKFLOW-FRAMEWORK-MIGRATION
    nome: "Migração de Framework, Plataforma ou Major Version"
    regra: "R-050"
    fast_path: false
    gatilhos:
      - "migrar framework"
      - "migração angular"
      - "migrar spring boot"
      - "upgrade major"
      - "modernizar stack"
      - "migrar para standalone"
      - "migrar para signals"
      - "migrar para virtual threads"
      - "migrar ejb"
      - "migrar struts"
      - "modernizar legado"
      - "continuar migração"
      - "gaps de migração"
      - "paridade de migração"
    colaboracao_dual_stack:
      obrigatorio_quando: "stack_origem != stack_destino (migracao_cross_stack, ex: ejb->spring_boot, struts->spring_boot, angularjs->angular)"
      papel_domain_router_origem: "co-agente consultivo obrigatorio em TODAS as etapas (nao apenas etapa 1) — oraculo de comportamento legado, extracao de regras de negocio via business-rules-extractor, validacao de paridade e corresponsavel pela Matriz De-Para"
      papel_domain_router_destino: "executor principal do codemod e paridade, consulta o router de origem antes de fechar cada etapa e mantem a Matriz De-Para atualizada"
      violacao_bloqueante: "tech-solution-architect NUNCA elabora blueprint de migracao cross-stack citando apenas o domain-router de destino no pipeline; ambos os routers (origem e destino) devem constar explicitamente no bloco de Pipeline de Execucao do Workflow"
    matriz_de_para_obrigatoria:
      regra: "R-050"
      entregavel: "docs/migrations/matriz-de-para-<alvo>.md"
