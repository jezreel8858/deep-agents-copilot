        co_agentes: ["domain-router-stack-origem (sign-off final de paridade e fechamento de 100% da Matriz De-Para, obrigatorio se cross-stack)", "code-knowledge-graph (obrigatorio, R-045 - verificacao final de zero ciclos novos e zero dead-code introduzido)"]

