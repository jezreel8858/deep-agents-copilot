      sinal_r006: "É qualquer solicitação do ecossistema Java Legado EJB? (despacha para o catálogo de 7 especialistas backend em .github/agents/backend/ejb/ejb-catalog.yaml)"

  # Supervisor e roteador de domínio Python Backend (Hierarchical Sub-Router)
  - de: agent-router
    para: python-router
    prioridade: 1.6
    threshold_score: 0.85
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "python"
        - "python-router"
        - "fastapi"
