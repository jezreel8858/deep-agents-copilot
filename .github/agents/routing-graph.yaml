    condicoes:
      keywords:
        - "spring boot"
        - "spring-boot-router"
        - "java lts"
        - "jdk"
        - "actuator"
        - "migracao spring"
        - "jpa"
        - "jakarta persistence"
        - "hikaricp"
        - "junit 5"
      sinal_r006: "É qualquer solicitação do ecossistema Spring Boot? (despacha para o catálogo de 7 especialistas backend em .github/agents/backend/spring-boot/spring-boot-catalog.yaml)"

  # Supervisor e roteador de domínio Spring Reactive (Hierarchical Sub-Router)
  - de: agent-router
    para: spring-reactive-router
    prioridade: 1.6
    threshold_score: 0.85
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "spring webflux"
        - "spring-reactive-router"
        - "project reactor"
        - "backend reativo"
        - "backpressure"
        - "reactive streams"
        - "r2dbc"
        - "stepverifier"
        - "webtestclient"
        - "blockhound"
      sinal_r006: "É qualquer solicitação do ecossistema reativo WebFlux/Reactor? (despacha para o catálogo de 7 especialistas reativos em .github/agents/backend/spring-reactive/spring-reactive-catalog.yaml)"

  # Supervisor e roteador de domínio Java Legado EJB (Hierarchical Sub-Router)
  - de: agent-router
    para: ejb-router
    prioridade: 1.6
    threshold_score: 0.85
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "ejb"
        - "ejb-router"
        - "stateless"
        - "stateful"
        - "message driven bean"
        - "mdb"
        - "jta"
        - "cmt"
