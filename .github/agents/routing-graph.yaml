  # Supervisor e roteador de domínio Banco de Dados (Hierarchical Sub-Router)
  - de: agent-router
    para: database-router
    prioridade: 1.6
    threshold_score: 0.85
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "database-router"
        - "oracle"
        - "informix"
        - "plsql"
        - "pl/sql"
        - "spl"
        - "stored procedure"
        - "procedure oracle"
        - "procedure informix"
        - "explain plan"
        - "dbms_xplan"
        - "set explain"
        - "sqexplain"
        - "flyway oracle"
        - "flyway informix"
        - "lock mode row"
      sinal_r006: "É solicitação especializada de banco de dados Oracle ou Informix? (despacha para o catálogo de especialistas em .github/agents/backend/database/database-catalog.yaml)"

  # Retorno universal (R-042) — qualquer downstream detecta deriva de intenção
  # e devolve controle ao router. Prioridade 0 = avaliada ANTES de qualquer
  # classificação de nova intenção, em todo turno subsequente ao primeiro.
  - de: "*downstream"
    para: agent-router
    prioridade: 0
    threshold_score: 0  # gatilho binário, não score de classificação
    nivel_routing: rule-based
    condicoes:
      tipo: intent_drift_detected
      regra: "R-042"
      gatilho: >
        Mudança de verbo de ação (elicitar->implementar, revisar->codar,
        analisar->corrigir, planejar->executar) quando o agent ativo NÃO
        cobre implementação (tech-solution-architect|bug-triage|
        requirements-analyst|test-strategy|refactor-planner|deep-search)
        OU pedido de execução/código em stack fora da matriz de competência
        do agent ativo OU pedido de execução/código em agent estritamente
        read-only. Nota: angular-engineer|spring-boot-engineer|spring-reactive-engineer
        sao perfil hibrido (specialist_hybrid) — pedido de implementacao DENTRO do
        proprio dominio de stack NAO e deriva; so dispara se o pedido sair
        do dominio do specialist (ex.: pedir Angular enquanto spring-boot-engineer
        esta ativo).
      aplica_a: "todos os nos tipo downstream e specialist_hybrid"
      acao: "handoff imediato para agent-router com motivo: deriva_de_intencao"

  # Banner obrigatório pós-ask_questions antes de qualquer execução (R-048 — anti execução silenciosa)
  - de: agent-router
    para: "*downstream"
    prioridade: 0.1
    threshold_score: 0
    nivel_routing: rule-based
    condicoes:
      tipo: mandatory_visibility_checkpoint
      regra: "R-048"
      gatilho: "Imediatamente após resposta de ask_questions que define implementação/correção — antes de qualquer tool call de código"
      acao: "Emitir bloco Agente Ativo/Rota/Confiança declarando o especialista ANTES de investigar/editar; proibido anunciar handoff apenas no relatório final"

  # Pesquisa interna/externa — fallback primário
  - de: agent-router
    para: deep-search
    prioridade: 8
    threshold_score: 0.70
    nivel_routing: semantic
    condicoes:
      sinal: "Dúvida técnica, pesquisa interna aprofundada, pesquisa externa, benchmark de mercado"
      gatilho: "Intenção clara que exige investigação além do contexto imediato"

  # Análise técnica genérica, blueprint e cross-projeto — fallback secundário amplo
  - de: agent-router
    para: tech-solution-architect
    prioridade: 9
    threshold_score: 0.70
    nivel_routing: semantic
    condicoes:
      sinal: "Análise técnica genérica, blueprint, impacto, requisitos, fluxos ou qualquer análise cross-sistema"
      gatilho: "Escopo que envolve arquitetura, blueprint técnico, contratos, dependências ou integrações"

  # Verificação de saúde do ambiente antes de testes/codificadores
  - de: agent-router
    para: runtime-verifier
    prioridade: 1.02
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "verificar ambiente"
        - "build limpo"
        - "sandbox saudável"
        - "dependências íntegras"
        - "porta ocupada"
        - "ambiente de execução"
      sinal_r006: "É verificação diagnóstica de ambiente/build/sandbox ANTES de rodar teste/codificador (não execução de teste em si)?"
      nao_confundir_com:
        - "executar/corrigir testes"  # → test-engineer

  # Preparação de PR pós-aprovação (nunca commit/push autônomo)
  - de: agent-router
    para: pr-gatekeeper
    prioridade: 4.6
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "preparar pr"
        - "pull request"
        - "mensagem de commit"
        - "commit semântico"
        - "changelog"
        - "matriz de risco de pr"
      sinal_r006: "Código já foi aprovado por code-review — pedido é sobre sintetizar diff/commit/PR/changelog (não revisar o código)?"
      nao_confundir_com:
        - "revisar código antes do merge"  # → code-review

  # Migrações de schema, query e integridade referencial
  - de: agent-router
    para: database-specialist
    prioridade: 5.6
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "migração de schema"
        - "flyway"
        - "liquibase"
        - "alembic"
        - "explain analyze"
        - "índice de banco"
        - "rollback de migração"
        - "integridade referencial"
  # Mapeamento semântico de Bounded Contexts (DDD), domínios de negócio e God Classes
  - de: agent-router
    para: ddd-bounded-context-mapper
    prioridade: 4.8
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "bounded context"
        - "ddd"
        - "domínio de negócio"
        - "fronteira de domínio"
        - "god class"
        - "segregação de microserviço"
        - "acoplamento de domínio"
        - "reverse ddd"
      sinal_r006: "É mapeamento de Bounded Contexts (DDD), domínios de negócio semânticos por nomenclatura ou identificação de God Classes/fronteiras invadidas?"
      nao_confundir_com:
        - "grafo determinístico de imports/chamadas"  # → code-knowledge-graph
        - "planejamento de refatoração estrutural"     # → refactor-planner
  # Auditoria de conformidade arquitetural contra Architectural Decision Records (ADRs)
  - de: agent-router
    para: adr-sentinel
    prioridade: 4.7
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "adr"
        - "architectural decision record"
        - "decisão arquitetural"
        - "conformidade arquitetural"
        - "adr obsoleto"
        - "auditoria de adr"
        - "violação de adr"
      sinal_r006: "É auditoria de propostas técnicas, blueprints ou diffs contra Architectural Decision Records (ADRs) documentados do projeto?"
      nao_confundir_com:
        - "regras de negócio do código"   # → business-rules-extractor
        - "autoria/redação de novo adr"    # → docs-engineer

  # Auditoria de higiene de repositório, documentação essencial e padrões de engenharia
  - de: agent-router
    para: repo-hygiene-auditor
    prioridade: 4.85
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "higiene de repositório"
        - "boas práticas de repositório"
        - "documentação essencial"
        - "readme ausente"
        - "auditar repositório"
        - "contributing"
        - "license"
        - "gitignore"
        - "maturidade do repositório"
      sinal_r006: "É auditoria de higiene de repositório, presença de documentação essencial (README/CONTRIBUTING/LICENSE) ou segurança de versionamento (.gitignore/.env)?"
      nao_confundir_com:
        - "governança interna de agentes de ia"  # → agent-auditor
        - "revisão de diff de código"            # → code-review
        - "redação de documentação"              # → docs-engineer

# ─────────────────────────────────────────────
# POLÍTICA DE CASCATA
# Aplicada quando score < threshold da aresta rule-based
# ─────────────────────────────────────────────
politica_cascata:
  nivel_1_rule_based:
    threshold: 0.90
    acao: "Rotear diretamente pela aresta com mais keywords correspondentes"

  nivel_2_semantic:
    threshold: 0.70
    acao: "Calcular similaridade semântica entre solicitação e descrição dos agents"

  nivel_3_llm_based:
    threshold: 0.50
    acao: "LLM tiebreaker — solicitar ao modelo atual a decisão de roteamento com contexto"

  escalonamento_humano:
    threshold: 0.00
    acao: "ask_questions com top-3 candidatos como opções"

  ambiguity_zone:
    descricao: "Top-1 e Top-2 scores dentro de 0.05 um do outro"
    acao: "Aplicar nível 3 (LLM tiebreaker) independentemente do threshold absoluto"

  out_of_domain:
    descricao: "Pedido de implementação de código em stack/linguagem não suportada no catálogo ou adapters"
    threshold: 0.20
    acao: "Fallback determinístico — emitir recusa estruturada sem acionar executores técnicos; oferecer @deep-search para pesquisa conceitual ou sugerir @governance-factory para expansão do catálogo"
    proibido: "Criar ou invocar agente inline de gap detection ou delegar para especialista de stack divergente"

