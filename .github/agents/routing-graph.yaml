        co_agentes: ["code-knowledge-graph (obrigatorio, R-045 - inventario de dependencias/blast radius/ciclos do legado)", "domain-router-stack-origem (obrigatorio se cross-stack, ex: ejb-router|struts-router)", "business-rules-extractor"]
        sub_rotinas_permitidas: ["deep-search"]
        nota: "code-knowledge-graph mapeia dependencias, blast radius e ciclos do codigo legado ANTES do blueprint; domain-router-stack-origem eh convocado via run_subagent para inventariar regras de negocio nas 5 dimensoes criticas (borda, regras, persistencia, downstream, saida); em cenario brownfield_in_flight, executa compulsoriamente o sub-estado 1b de Reconciliacao Delta e auditoria de gaps pre-existentes"
      - etapa: 2
        nome: "migration_blueprint_and_phasing"
        agent: "tech-solution-architect"
        co_agentes: ["domain-router-stack-origem", "domain-router-stack-destino"]
        checkpoint_humano: "ask_questions (aprovacao_fases_migracao)"
        nota: "blueprint gera a Matriz De-Para bidirecional canonica (docs/migrations/matriz-de-para-<alvo>.md) vinculando 100% dos elementos legados a componentes destino e fases B1/B2/B3 com dashboard de visibilidade humana; declara papeis de origem (oraculo) e destino (executor)"
      - etapa: 3
        nome: "codemod_and_batch_rewrite"
        agent: "domain-router-stack-destino | specialist-feature-developer"
        co_agentes: ["domain-router-stack-origem (consultivo, obrigatorio se cross-stack)", "code-knowledge-graph (obrigatorio, R-045 - blast radius por lote antes de cada micro-batch)"]
        protocolo: "efficient-batch-code-modification"
        nota: "execucao dos codemods estritamente orientada aos IDs da Matriz De-Para da fase ativa; domain-router-stack-origem permanece ativo validando paridade; code-knowledge-graph recalcula blast radius"
      - etapa: 4
        nome: "refinement_and_parity_testing"
        agent: "domain-router-stack-destino | specialist-unit-test-writer | specialist-component-test-writer"
        co_agentes: ["domain-router-stack-origem (dual_verification)", "business-rules-extractor (modo validate)", "code-knowledge-graph (obrigatorio, R-045 - find_cycles e dead-code pos-codemod)"]
        gate: "dual_verification_gate (golden_master_100 + matriz_de_para_100_resolvida + regras_de_negocio_100_cobertas + zero_ciclos_dead_code_novos, ver workflows.md § 3.7.1)"
