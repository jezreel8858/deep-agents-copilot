version: "1.0"
description: >
  Grafo de roteamento declarado — fonte de verdade estrutural para o agent-router.
  Nós = agents disponíveis; arestas = condições de roteamento (keywords, sinais R-006, score threshold).
  A Decision Tree em agent-router.agent.md é documentação derivada deste arquivo.
last_updated: "2026-09-02 (v6 — sincronizado com catalog.yaml pos-fusao/gaps: test-implementation+test-fix->test-engineer, docs-writer+docs-curator->docs-engineer, agent-factory+skill-factory->governance-factory; 3 nos/arestas novos: runtime-verifier, pr-gatekeeper, database-specialist; total 34 agents. v5 anterior preservado no historico do arquivo)"

# ─────────────────────────────────────────────
# NÓS — agents disponíveis no catálogo
# ─────────────────────────────────────────────
nos:
  - id: agent-router
    tipo: entry_point
    descricao: "Entry point obrigatório — nunca é destino, apenas origem"

  - id: prompt-structuring
    tipo: mandatory_pre_step
    descricao: >
      Passo mandatório pós-health-check (R-041): refina o prompt em loop
      controlado (máx. 5 iterações) no formato <task>/<context>/<constraints>/
      <output_format> e SEMPRE retorna ao agent-router. Nunca é destino final.

  - id: bug-triage
    tipo: downstream
    descricao: "Triagem de bugs e regressões"

  - id: test-strategy
    tipo: downstream
    descricao: "Planejamento e estratégia de testes por risco e matriz de cenários"

  - id: business-rules-extractor
    tipo: downstream
    descricao: "Extração e validação de regras de negócio"

  - id: refactor-planner
    tipo: downstream
    descricao: "Planejamento e decomposição macro de refatoração estrutural com blast radius e rollback (delega execução aos especialistas de stack)"

  - id: docs-engineer
    tipo: downstream
    descricao: >
      Fusão de docs-writer + docs-curator: autoria de documentação técnica
      nova (mode author) e curadoria/padronização de documentação e
      catálogo de governança já existentes (mode curate). Produz
      exclusivamente arquivos .md.

  - id: code-review
    tipo: downstream
    descricao: "Revisão de código (diff/PR) antes do merge — correção, segurança, convenções, impacto, testes e performance; classifica por severidade; read-only, nunca corrige"

  - id: requirements-analyst
    tipo: downstream
    descricao: "Elicitação e estruturação de requisitos funcionais/não-funcionais a partir de pedido de negócio ambíguo (EARS/INVEST/Gherkin/FURPS+); detecta solution-jumping via Five Whys; prospectivo (pedido → requisito), nunca decide arquitetura, não confundir com business-rules-extractor (reverso: código → regra)"

  - id: code-summarizer
    tipo: downstream
    descricao: "Ponto de entrada único para sumarização de código-fonte agnóstica a linguagem (RF-008); modelo híbrido — heurística/AST determinística primeiro, LLM leve como fallback; nunca substituído por chamada direta a lib de parsing por outros agents (RNF-007)"

  - id: code-knowledge-graph
    tipo: downstream
    descricao: "Ponto de entrada único para construção/consulta do grafo de conhecimento de código-fonte cross-projeto (RF-001/RF-002/RF-011): nós arquivo/classe/função, arestas import/chamada/herança/tabela-SQL, reaproveitando AST do code-summarizer; puramente determinístico, sem fallback LLM (RNF-008); nunca substituído por chamada direta a lib de parsing/grafo (RNF-004)"

  - id: deep-search
    tipo: fallback
    descricao: "Pesquisa interna aprofundada e externa (atômica/composta) — fallback primário"

  - id: tech-solution-architect
    tipo: fallback
    descricao: "Arquiteto de solução técnica, blueprint, contratos de integração e divisão por stack; absorve impacto local via tier B1"

  - id: governance-factory
    tipo: downstream
    descricao: >
      Fusão de agent-factory + skill-factory + prompt-factory: cria/revisa
      agent (.agent.md), skill (SKILL.md) ou prompt (.prompt.md) via
      parâmetro type, com atualização atômica do catálogo correspondente.

  - id: governance-maintainer
    tipo: downstream
    descricao: >
      Especialista executor em manutenção atômica, refatoração estrutural e sincronização
      em lote de artefatos de governança (.github/agents, .github/skills, .github/prompts,
      catálogos e grafo de roteamento) com single-turn batching e context-mode.

  - id: binding-initializer
    tipo: health_check
    descricao: "Inicialização de binding context — acionado antes da triagem se catalog.yaml ausente"

  - id: adapter-generator
    tipo: downstream
    descricao: "Geração automática de adapters via /add-project-context"

  - id: context-builder
    tipo: downstream
    descricao: "Coleta e consolidação de contexto técnico"

  - id: angular-router
    tipo: domain_router
    descricao: "Supervisor hierárquico do domínio Angular — despacha para os 8 especialistas registrados em .github/agents/frontend/angular/angular-catalog.yaml"


  - id: spring-boot-router
    tipo: domain_router
    descricao: "Supervisor hierárquico do domínio Spring Boot — despacha para os 7 especialistas registrados em .github/agents/backend/spring-boot/spring-boot-catalog.yaml"

  - id: spring-reactive-router
    tipo: domain_router
    descricao: "Supervisor hierárquico do domínio Spring Reactive — despacha para os 7 especialistas registrados em .github/agents/backend/spring-reactive/spring-reactive-catalog.yaml"

  - id: ejb-router
    tipo: domain_router
    descricao: "Supervisor hierárquico do domínio Java Legado EJB — despacha para os 7 especialistas registrados em .github/agents/backend/ejb/ejb-catalog.yaml"

  - id: database-router
    tipo: domain_router
    descricao: "Supervisor hierárquico do domínio de Banco de Dados — despacha para os 6 especialistas Oracle e Informix registrados em .github/agents/backend/database/database-catalog.yaml"

  - id: security-reviewer
    tipo: downstream
    descricao: "Revisão especializada de segurança de aplicação (OWASP Top 10:2025, ASVS 5.0, SCA/CVE, secrets) — read-only; distinto de agent-safety-guardrails (segurança do próprio agent de IA)"

  - id: performance-agent
    tipo: downstream
    descricao: "Revisão especializada de performance (Core Web Vitals frontend, N+1/latência backend, otimização de query banco) — read-only"

  - id: compliance-guardrails
    tipo: downstream
    descricao: "Avaliação de conformidade regulatória de aplicação (SOC 2, GDPR/LGPD, HIPAA, ISO 27001) — audit trails, least privilege; read-only; distinto de agent-safety-guardrails"

  - id: feature-planner
    tipo: downstream
    descricao: "Decomposição de requisito de feature nova em subtasks executáveis com dependências e paralelização; distinto de refactor-planner (refatoração de código existente)"

  - id: agentic-memory-manager
    tipo: downstream
    descricao: "Persistência/recuperação de memória long-term entre sessões (episódica/semântica/procedimental); memória procedimental exige aprovação humana explícita"

  - id: devops-engineer
    tipo: downstream
    descricao: "Revisão de artefatos DevOps (Dockerfile/Kubernetes/CI-CD/IaC) por segurança/resiliência/boas práticas — read-only"

  - id: debugger
    tipo: downstream
    descricao: "Investigação de causa raiz a partir de stack trace/log — call graph, hipótese testável; complementa bug-triage com investigação mais profunda"

  - id: code-style-enforcer
    tipo: downstream
    descricao: "Verificação de aderência a convenções de estilo documentadas no adapter de stack; nunca bloqueador"

  - id: runtime-verifier
    tipo: downstream
    descricao: "Verificação de saúde do ambiente (build limpo, dependências, serviços dependentes) antes de disparar testes/codificadores; read-only, nunca corrige"

  - id: pr-gatekeeper
    tipo: downstream
    descricao: "Preparação de PR pós-aprovação do quality gate — diff, commit semântico, matriz de risco, CHANGELOG.md; nunca executa git add/commit/push"

  - id: database-specialist
    tipo: downstream
    descricao: "Migrações de schema (Flyway/Liquibase/Alembic), otimização de query e integridade referencial; rollback sempre documentado"

  - id: agent-auditor
    tipo: downstream
    descricao: "Auditor de governança em meta-nível para analisar smells e gaps no catálogo de agents/skills/prompts, validando templates canônicos, R-046/batching, especificações e alinhamento de perfil sem mutação direta, com recomendações e handoff para executores"

# ─────────────────────────────────────────────
# ARESTAS — condições de roteamento
# Cada aresta define: origem, destino, sinais de ativação e threshold mínimo
# ─────────────────────────────────────────────
arestas:
  # Health check obrigatório (pré-triagem)
  - de: agent-router
    para: binding-initializer
    prioridade: 0
    threshold_score: 0  # null — health check não usa score numérico
    nivel_routing: rule-based
    condicoes:
      tipo: health_check
      regra: "R-034"
      gatilho: "docs/ai-context/catalog.yaml ausente OU docs/ai-context/binding.md ausente"

  # Prompt structuring obrigatório (pré-classificação) — exceção R-041
  - de: agent-router
    para: prompt-structuring
    prioridade: 0.5
    threshold_score: 0  # null — passo mandatório, não usa score numérico
    nivel_routing: rule-based
    condicoes:
      tipo: mandatory_pre_step
      regra: "R-041"
      gatilho: "Sempre, após Health Check (R-034) e antes de qualquer classificação de intenção — exceto quando a solicitação já retornou refinada por prompt-structuring"
      loop_maximo: 5
      retorno_obrigatorio: agent-router

  # Bug / Erro / Regressão
  - de: agent-router
    para: bug-triage
    prioridade: 1
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "bug"
        - "erro"
        - "regressão"
        - "falha em produção"
        - "não funciona"
        - "exception"
        - "NPE"
        - "500"
        - "stack trace"
      sinal_r006: "É bug/erro/regressão?"

  # Revisão de código antes do merge
  - de: agent-router
    para: code-review
    prioridade: 1.5
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "revisar código"
        - "code review"
        - "revisão antes do merge"
        - "analisar pull request"
        - "revisar diff"
        - "revisar pr"
      sinal_r006: "É revisão preventiva de qualidade ANTES do merge (não bug já ocorrido)?"
      nao_confundir_com:
        - "bug em produção"        # → bug-triage (algo já quebrou)
        - "impacto de mudar X"     # → analysis-architect (tier B1 local)

  # Revisão especializada de segurança (OWASP/CVE/secrets)
  - de: agent-router
    para: security-reviewer
    prioridade: 1.55
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "revisão de segurança"
        - "security review"
        - "owasp"
        - "cve"
        - "vulnerabilidade"
        - "sql injection"
        - "secrets no código"
        - "sast"
        - "sca"
      sinal_r006: "É revisão ESPECIALIZADA de segurança de aplicação (profundidade OWASP/CVE), não apenas a dimensão genérica de code-review?"
      nao_confundir_com:
        - "segurança do próprio agent de IA"  # → agent-safety-guardrails (skill, não agent)
        - "revisão geral de código"            # → code-review (dimensão genérica)

  # Revisão especializada de performance (CWV/N+1/query)
  - de: agent-router
    para: performance-agent
    prioridade: 1.56
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "performance"
        - "otimização"
        - "latência"
        - "n+1"
        - "core web vitals"
        - "lcp"
        - "inp"
        - "query lenta"
        - "throughput"
      sinal_r006: "É revisão ESPECIALIZADA de performance (CWV/N+1/profiling), não apenas a dimensão genérica de code-review?"
      nao_confundir_com:
        - "revisão geral de código"  # → code-review (dimensão genérica)

  # Avaliação de compliance/conformidade regulatória
  - de: agent-router
    para: compliance-guardrails
    prioridade: 1.57
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "compliance"
        - "auditoria"
        - "soc 2"
        - "gdpr"
        - "lgpd"
        - "hipaa"
        - "audit trail"
        - "least privilege"
      sinal_r006: "É avaliação de conformidade regulatória da APLICAÇÃO (SOC 2/GDPR/HIPAA), não segurança do próprio agent de IA?"
      nao_confundir_com:
        - "segurança do próprio agent de IA"  # → agent-safety-guardrails (skill, não agent)
        - "vulnerabilidade técnica explorável"  # → security-reviewer

  # Decomposição de feature nova em subtasks
  - de: agent-router
    para: feature-planner
    prioridade: 1.6
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "decompor tarefa"
        - "planejar feature"
        - "task decomposition"
        - "plano de execução"
        - "quebrar em subtarefas"
      sinal_r006: "É decomposição de FEATURE NOVA (não refatoração de código existente)?"
      nao_confundir_com:
        - "refatoração de código existente"  # → refactor-planner

  # Memória long-term de agent
  - de: agent-router
    para: agentic-memory-manager
    prioridade: 1.65
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "memória de agent"
        - "agent memory"
        - "memória entre sessões"
        - "memória procedimental"
      sinal_r006: "É persistência/recuperação de memória ENTRE SESSÕES (não consolidação pontual)?"
      nao_confundir_com:
        - "consolidação pontual de contexto"  # → context-builder

  # Revisão de artefatos DevOps
  - de: agent-router
    para: devops-engineer
    prioridade: 1.7
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "revisar dockerfile"
        - "revisar kubernetes"
        - "revisar pipeline"
        - "revisar ci/cd"
        - "infrastructure as code"
        - "terraform"
        - "helm chart"

  # Investigação de causa raiz (debugging profundo)
  - de: agent-router
    para: debugger
    prioridade: 1.05
    threshold_score: 0.85
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "investigar causa raiz"
        - "call graph"
        - "stack trace"
        - "root cause"
      sinal_r006: "Exige investigação PROFUNDA de call chain/causa raiz, além da triagem inicial de bug-triage?"
      nao_confundir_com:
        - "bug simples/classificação inicial"  # → bug-triage

  # Verificação de estilo/convenção
  - de: agent-router
    para: code-style-enforcer
    prioridade: 1.58
    threshold_score: 0.85
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "estilo de código"
        - "convenção de nomenclatura"
        - "lint"
        - "eslint"
        - "checkstyle"


  # Elicitação e estruturação de requisitos (pré-técnico, prospectivo)
  - de: agent-router
    para: requirements-analyst
    prioridade: 1.8
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "levantar requisitos"
        - "requisito ambíguo"
        - "elicitação de requisitos"
        - "user story"
        - "critério de aceite"
        - "requisito funcional"
        - "requisito não funcional"
      sinal_r006: "É elicitação de requisito NOVO a partir de pedido ambíguo (ainda sem análise técnica)?"
      nao_confundir_com:
        - "extrair regra de negócio de código existente"  # → business-rules-extractor (reverso)
        - "impacto técnico de mudança já definida"          # → tech-solution-architect (tier B1)

  # Sumarização de código-fonte agnóstica a linguagem (RF-008)
  - de: agent-router
    para: code-summarizer
    prioridade: 1.9
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "sumarizar código"
        - "sumarização de código-fonte"
        - "resumir arquivo"
        - "reduzir contexto de código"
        - "economizar tokens de código"
        - "code summarization"
      sinal_r006: "É pedido para reduzir volume de código-fonte levado ao contexto (sumário), não para revisar/corrigir/refatorar o código?"
      nao_confundir_com:
        - "revisar/corrigir código"        # → bug-triage/code-review/refactor-planner
        - "extrair regra de negócio"       # → business-rules-extractor
        - "implementar sumarização em lib" # → decisão técnica de governance-factory/tech-solution-architect, não roteamento

  # Delegação interna: qualquer agent downstream pode invocar code-summarizer sob demanda (RF-002)
  - de: "*downstream"
    para: code-summarizer
    prioridade: 0.5
    threshold_score: 1.00
    nivel_routing: rule-based
    condicoes:
      sinal: "Agent downstream identificou arquivo-fonte grande (>300 linhas OU >20KB) necessário ao contexto da tarefa (RF-002/RNF-002)"
      gatilho: "Delegação interna via run_subagent antes de anexar conteúdo bruto ao contexto — nunca chamada direta a lib de parsing por outros agents (RNF-007)"

  # Grafo de conhecimento de código-fonte cross-projeto (RF-001/RF-002/RF-011)
  - de: agent-router
    para: code-knowledge-graph
    prioridade: 1.59
    threshold_score: 0.85
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "grafo de conhecimento"
        - "code knowledge graph"
        - "grafo de código"
        - "quem chama esta função"
        - "quais classes implementam"
        - "relação estrutural de código"
        - "árvore de dependências de código"
        - "estruturado em termos de camadas"
        - "camadas e fluxo de dados"
        - "fluxo de dados"
        - "separação de estado e persistência"
        - "arquitetura de camadas"
        - "mapear chamadas entre camadas"
      sinal_r006: "É pedido de construir/consultar relação estrutural entre símbolos de código (nós/arestas), camadas ou fluxo de dados do projeto?"
      nao_confundir_com:
        - "sumarizar código"                       # → code-summarizer
        - "revisar/corrigir código"                # → bug-triage/code-review/refactor-planner
        - "implementação/feature de componente"    # → angular-engineer / spring-boot-engineer
        - "acoplamento arquitetural entre sistemas" # → tech-solution-architect (cross-sistema/contratos)

  # Delegação interna: qualquer agent downstream pode invocar code-knowledge-graph sob demanda (RF-002)
  - de: "*downstream"
    para: code-knowledge-graph
    prioridade: 0.5
    threshold_score: 1.00
    nivel_routing: rule-based
    condicoes:
      sinal: "Agent downstream precisa de relação estrutural entre símbolos de código (ex.: quem chama esta função, quais classes implementam esta interface) não disponível no grafo cacheado (RF-002)"
      gatilho: "Delegação interna via run_subagent — nunca chamada direta a lib de parsing/grafo"

  # Estratégia de testes (Fluxo 1 Gateway Cross-Cutting + Planejamento Geral)
  - de: agent-router
    para: test-strategy
    prioridade: 2
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "estratégia de testes"
        - "planejar testes"
        - "cobertura"
        - "cenários de teste"
        - "matriz de testes"
        - "matriz de riscos"
        - "casos de borda"
        - "feature cross-cutting"
      sinal_r006: "É estratégia/plano de testes OU feature nova multi-camada (backend + frontend) exigindo matriz de riscos unificada antes da codificação?"
      nao_confundir_com:
        - "executar testes angular"        # → angular-router
        - "executar testes spring boot"    # → spring-boot-router
        - "executar testes reativos"       # → spring-reactive-router
        - "executar testes ejb"            # → ejb-router

  # Delegação interna: Routers de domínio consultam test-strategy para mapear cenários antes de codar (Fluxo 2 TDD)
  - de: "angular-router | spring-boot-router | spring-reactive-router | ejb-router"
    para: test-strategy
    prioridade: 0.5
    threshold_score: 1.00
    nivel_routing: rule-based
    condicoes:
      sinal: "Supervisor de domínio identifica regra de negócio com casos de borda complexos antes de acionar test-writers"
      gatilho: "Delegação interna via run_subagent para obter matriz estruturada de cenários"

  # Extração de regras de negócio
  - de: agent-router
    para: business-rules-extractor
    prioridade: 3
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "regra de negócio"
        - "extrair regra"
        - "documentar comportamento"
        - "validar refatoração"
        - "ground truth"

  # Refatoração
  - de: agent-router
    para: refactor-planner
    prioridade: 3
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "refatorar"
        - "refactor"
        - "clean code"
        - "simplificar código"
        - "eliminar duplicação"
        - "reestruturar"

  # Análise de impacto local (tier B1) / Blueprint de solução
  - de: agent-router
    para: tech-solution-architect
    prioridade: 4
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "impacto"
        - "risco"
        - "dependências"
        - "o que muda"
        - "quem é afetado"
        - "breaking change"
        - "blueprint"
        - "blueprint técnico"
        - "technical blueprint"
        - "desenho de arquitetura"
      sinal_r006: "Impacto local ou elaboração de blueprint técnico -> usar tech-solution-architect em tier B1"

  # Documentação (autoria de conteúdo novo + curadoria de conteúdo existente — fusão docs-writer + docs-curator)
  - de: agent-router
    para: docs-engineer
    prioridade: 5
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "atualizar documentação"
        - "curar doc"
        - "README"
        - "catálogo"
        - "rastreabilidade de doc"
        - "escrever documentação"
        - "criar documentação técnica"
        - "gerar readme"
        - "criar adr"
        - "documentar decisão técnica"
        - "gerar arquivo md"
        - "documentador"
        - "runbook"
        - "postmortem"
      sinal_r006: "mode=author (conteúdo novo) | mode=curate (consolidação/padronização de conteúdo já existente)"

  # Governance factory (fusão agent-factory + skill-factory + prompt-factory + stack-ecosystem)
  - de: agent-router
    para: governance-factory
    prioridade: 6
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "criar agent"
        - "novo agent"
        - "revisar agent"
        - "padronizar agent"
        - "criar skill"
        - "nova skill"
        - "revisar skill"
        - "criar prompt"
        - "novo prompt"
        - "revisar prompt"
        - "criar stack"
        - "nova stack"
        - "ecossistema stack"
        - "ecossistema de agentes"
      sinal_r006: "type=agent | type=skill | type=prompt | type=stack — perguntar via ask_questions se ambíguo"

  # Manutenção e sincronização em lote de governança (governance-maintainer)
  - de: agent-router
    para: governance-maintainer
    prioridade: 6.1
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "manutenção de governança"
        - "refatorar governança"
        - "atualizar catálogo"
        - "sincronizar agents"
        - "renomear agent"
        - "batch modification governança"
        - "sincronizar referências"
        - "alterar governança"
      sinal_r006: "É manutenção/sincronização/refatoração em lote de artefatos existentes de governança (não criação de novo artefato do zero)?"
      nao_confundir_com:
        - "criar novo agent/skill/prompt/stack do zero"  # → governance-factory
        - "auditar semântica do catálogo sem alterar"    # → agent-auditor

  # Auditoria de governança, smells e conformidade (agent-auditor)
  - de: agent-router
    para: agent-auditor
    prioridade: 6.2
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "auditar governança"
        - "auditar catálogo"
        - "auditar agents"
        - "auditar prompts"
        - "auditar skills"
        - "governance smells"
        - "conformidade de agents"
        - "smell de governança"
        - "auditar conformidade"
      sinal_r006: "É auditoria semântica/estrutural do catálogo em meta-nível (read-only, sem mutação direta)?"
      nao_confundir_com:
        - "manutenção/sincronização em lote"             # → governance-maintainer (executor mutativo)
        - "criar novo agent/skill/prompt/stack"           # → governance-factory (autor do zero)

  # Análise de integração cross-sistema, contratos e Technical Blueprint (tech-solution-architect)
  - de: agent-router
    para: tech-solution-architect
    prioridade: 7
    threshold_score: 0.85
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "integração entre sistemas"
        - "contrato de API"
        - "breaking change de contrato"
        - "openapi"
        - "asyncapi"
        - "grpc"
        - "blast radius"
        - "fluxo de dados cross-sistema"
        - "acoplamento entre serviços"
        - "blueprint técnico"
        - "divisão de tarefas por stack"

  # Supervisor e roteador de domínio Angular (Hierarchical Sub-Router)
  - de: agent-router
    para: angular-router
    prioridade: 1.5
    threshold_score: 0.85
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "angular"
        - "angular router"
        - "frontend angular"
        - "componente angular"
        - "standalone"
        - "signals"
        - "rxjs"
        - "core web vitals angular"
        - "auditoria angular"
        - "upgrade angular"
        - "feature angular"
        - "bug angular"
        - "fix angular"
        - "scss angular"
        - "layout angular"
        - "responsivo angular"
        - "a11y angular"
        - "testes angular"
        - "angular component test"
        - "testbed"
        - "component harness"
        - "vitest angular"
        - "karma angular"
        - "angular e2e"
        - "playwright angular"
      sinal_r006: "É qualquer solicitação do ecossistema Angular? (despacha para o catálogo de 8 especialistas de frontend em .github/agents/frontend/angular/angular-catalog.yaml)"

  # Supervisor e roteador de domínio Spring Boot (Hierarchical Sub-Router)
  - de: agent-router
    para: spring-boot-router
    prioridade: 1.6
    threshold_score: 0.85
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "spring boot"
        - "spring-boot-router"
        - "java lts"
        - "jdk"
        - "actuator"
        - "migracao spring"
        - "jpa"
        - "jakarta persistence"
        - "hikaricp"
        - "junit 5"
      sinal_r006: "É qualquer solicitação do ecossistema Spring Boot? (despacha para o catálogo de 7 especialistas backend em .github/agents/backend/spring-boot/spring-boot-catalog.yaml)"

  # Supervisor e roteador de domínio Spring Reactive (Hierarchical Sub-Router)
  - de: agent-router
    para: spring-reactive-router
    prioridade: 1.6
    threshold_score: 0.85
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "spring webflux"
        - "spring-reactive-router"
        - "project reactor"
        - "backend reativo"
        - "backpressure"
        - "reactive streams"
        - "r2dbc"
        - "stepverifier"
        - "webtestclient"
        - "blockhound"
      sinal_r006: "É qualquer solicitação do ecossistema reativo WebFlux/Reactor? (despacha para o catálogo de 7 especialistas reativos em .github/agents/backend/spring-reactive/spring-reactive-catalog.yaml)"

  # Supervisor e roteador de domínio Java Legado EJB (Hierarchical Sub-Router)
  - de: agent-router
    para: ejb-router
    prioridade: 1.6
    threshold_score: 0.85
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "ejb"
        - "ejb-router"
        - "stateless"
        - "stateful"
        - "message driven bean"
        - "mdb"
        - "jta"
        - "cmt"
        - "bmt"
        - "ear"
        - "openejb"
        - "arquillian"
      sinal_r006: "É qualquer solicitação do ecossistema Java Legado EJB? (despacha para o catálogo de 7 especialistas backend em .github/agents/backend/ejb/ejb-catalog.yaml)"

  # Supervisor e roteador de domínio Banco de Dados (Hierarchical Sub-Router)
  - de: agent-router
    para: database-router
    prioridade: 1.6
    threshold_score: 0.85
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "database-router"
        - "oracle"
        - "informix"
        - "plsql"
        - "pl/sql"
        - "spl"
        - "stored procedure"
        - "procedure oracle"
        - "procedure informix"
        - "explain plan"
        - "dbms_xplan"
        - "set explain"
        - "sqexplain"
        - "flyway oracle"
        - "flyway informix"
        - "lock mode row"
      sinal_r006: "É solicitação especializada de banco de dados Oracle ou Informix? (despacha para o catálogo de especialistas em .github/agents/backend/database/database-catalog.yaml)"

  # Retorno universal (R-042) — qualquer downstream detecta deriva de intenção
  # e devolve controle ao router. Prioridade 0 = avaliada ANTES de qualquer
  # classificação de nova intenção, em todo turno subsequente ao primeiro.
  - de: "*downstream"
    para: agent-router
    prioridade: 0
    threshold_score: 0  # gatilho binário, não score de classificação
    nivel_routing: rule-based
    condicoes:
      tipo: intent_drift_detected
      regra: "R-042"
      gatilho: >
        Mudança de verbo de ação (elicitar->implementar, revisar->codar,
        analisar->corrigir, planejar->executar) quando o agent ativo NÃO
        cobre implementação (tech-solution-architect|bug-triage|
        requirements-analyst|test-strategy|refactor-planner|deep-search)
        OU pedido de execução/código em stack fora da matriz de competência
        do agent ativo OU pedido de execução/código em agent estritamente
        read-only. Nota: angular-engineer|spring-boot-engineer|spring-reactive-engineer
        sao perfil hibrido (specialist_hybrid) — pedido de implementacao DENTRO do
        proprio dominio de stack NAO e deriva; so dispara se o pedido sair
        do dominio do specialist (ex.: pedir Angular enquanto spring-boot-engineer
        esta ativo).
      aplica_a: "todos os nos tipo downstream e specialist_hybrid"
      acao: "handoff imediato para agent-router com motivo: deriva_de_intencao"

  # Pesquisa interna/externa — fallback primário
  - de: agent-router
    para: deep-search
    prioridade: 8
    threshold_score: 0.70
    nivel_routing: semantic
    condicoes:
      sinal: "Dúvida técnica, pesquisa interna aprofundada, pesquisa externa, benchmark de mercado"
      gatilho: "Intenção clara que exige investigação além do contexto imediato"

  # Análise técnica genérica, blueprint e cross-projeto — fallback secundário amplo
  - de: agent-router
    para: tech-solution-architect
    prioridade: 9
    threshold_score: 0.70
    nivel_routing: semantic
    condicoes:
      sinal: "Análise técnica genérica, blueprint, impacto, requisitos, fluxos ou qualquer análise cross-sistema"
      gatilho: "Escopo que envolve arquitetura, blueprint técnico, contratos, dependências ou integrações"

  # Verificação de saúde do ambiente antes de testes/codificadores
  - de: agent-router
    para: runtime-verifier
    prioridade: 1.02
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "verificar ambiente"
        - "build limpo"
        - "sandbox saudável"
        - "dependências íntegras"
        - "porta ocupada"
        - "ambiente de execução"
      sinal_r006: "É verificação diagnóstica de ambiente/build/sandbox ANTES de rodar teste/codificador (não execução de teste em si)?"
      nao_confundir_com:
        - "executar/corrigir testes"  # → test-engineer

  # Preparação de PR pós-aprovação (nunca commit/push autônomo)
  - de: agent-router
    para: pr-gatekeeper
    prioridade: 4.6
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "preparar pr"
        - "pull request"
        - "mensagem de commit"
        - "commit semântico"
        - "changelog"
        - "matriz de risco de pr"
      sinal_r006: "Código já foi aprovado por code-review — pedido é sobre sintetizar diff/commit/PR/changelog (não revisar o código)?"
      nao_confundir_com:
        - "revisar código antes do merge"  # → code-review

  # Migrações de schema, query e integridade referencial
  - de: agent-router
    para: database-specialist
    prioridade: 5.6
    threshold_score: 0.90
    nivel_routing: rule-based
    condicoes:
      keywords:
        - "migração de schema"
        - "flyway"
        - "liquibase"
        - "alembic"
        - "explain analyze"
        - "índice de banco"
        - "rollback de migração"
        - "integridade referencial"

# ─────────────────────────────────────────────
# POLÍTICA DE CASCATA
# Aplicada quando score < threshold da aresta rule-based
# ─────────────────────────────────────────────
politica_cascata:
  nivel_1_rule_based:
    threshold: 0.90
    acao: "Rotear diretamente pela aresta com mais keywords correspondentes"

  nivel_2_semantic:
    threshold: 0.70
    acao: "Calcular similaridade semântica entre solicitação e descrição dos agents"

  nivel_3_llm_based:
    threshold: 0.50
    acao: "LLM tiebreaker — solicitar ao modelo atual a decisão de roteamento com contexto"

  escalonamento_humano:
    threshold: 0.00
    acao: "ask_questions com top-3 candidatos como opções"

  ambiguity_zone:
    descricao: "Top-1 e Top-2 scores dentro de 0.05 um do outro"
    acao: "Aplicar nível 3 (LLM tiebreaker) independentemente do threshold absoluto"

  out_of_domain:
    descricao: "Pedido de implementação de código em stack/linguagem não suportada no catálogo ou adapters"
    threshold: 0.20
    acao: "Fallback determinístico — emitir recusa estruturada sem acionar executores técnicos; oferecer @deep-search para pesquisa conceitual ou sugerir @governance-factory para expansão do catálogo"
    proibido: "Criar ou invocar agente inline de gap detection ou delegar para especialista de stack divergente"

