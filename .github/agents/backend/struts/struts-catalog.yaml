version: "1.0"
domain: "backend-struts"
description: >-
  Sub-catálogo hierárquico de agentes especializados em Java Legado Struts (Struts 1.x e Struts 2.x).
  Isola a topologia de especialistas Struts do catálogo central global, evitando explosão de nós no agent-router e permitindo orquestração local por domínio.

router:
  id: "struts-router"
  role: "supervisor"
  description: "Roteador central do domínio Java Legado Struts — tria e despacha para os 7 especialistas backend"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"

agents:
  struts-arch-advisor:
    id: "struts-arch-advisor"
    model: "Claude Sonnet 5"
    role: "advisory"
    domain: "Arquitetura Java Legado Struts 1.x/2.x, ActionServlet, descritores XML, Tiles, OGNL e manutenibilidade arquitetural"
    description: "Especialista analítico read-only: arquitetura MVC Struts 1.x/2.x, struts-config.xml, struts.xml, Tiles, interceptors, segurança OGNL e governança de código legado."
    keywords:
      - "arquitetura struts"
      - "auditoria struts"
      - "struts 1"
      - "struts 2"
      - "struts-config.xml"
      - "struts.xml"
      - "tiles"
      - "manutenibilidade struts"
      - "governanca struts"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "context-mode/ctx_search"
    skills:
      - "java-jdk-backend-governance"
      - "specialist-hybrid-advisory-implementation-patterns"
      - "codegraph-optave-usage"
      - "agent-contracts"
      - "context-mode"

  struts-feature-developer:
    id: "struts-feature-developer"
    model: "Gemini 3.8 Flash"
    role: "implementer"
    domain: "Desenvolvimento de features em Java Legado Struts: Actions, ActionMapping, ActionForm, DynaActionForm, JSP Taglibs sob TDD estrito"
    description: "Desenvolvedor de features Struts: implementa Actions, DispatchActions, FormBeans, mapeamentos XML e integrações de serviço sob TDD com JUnit 4/5 e Mockito."
    keywords:
      - "feature struts"
      - "action struts"
      - "actionform"
      - "dynaactionform"
      - "dispatchaction"
      - "actionmapping"
      - "tdd struts"
      - "jsp struts taglib"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_index"
    skills:
      - "java-jdk-backend-governance"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  struts-bug-fixer:
    id: "struts-bug-fixer"
    model: "Gemini 3.8 Flash"
    role: "fixer"
    domain: "Correções cirúrgicas de falhas em Struts: ClassCastException em form-beans, forwards nulos, thread-safety em Actions, vazamentos de sessão"
    description: "Especialista em resolução rápida de bugs Struts: corrige falhas de ActionForward, ClassCastException em ActionForm, loops de redirecionamento e concorrência com diff mínimo."
    keywords:
      - "bug struts"
      - "fix struts"
      - "actionforward nulo"
      - "classcastexception formbean"
      - "thread safety action"
      - "session leak struts"
      - "corrigir erro struts"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "code-tracing"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  struts-perf-tuner:
    id: "struts-perf-tuner"
    model: "Gemini 3.8 Flash"
    role: "performance"
    domain: "Otimização de performance em Struts — eliminação de session bloat em ActionForms, tuning de Tiles/JSP e conexões JDBC DataSource"
    description: "Especialista em performance Struts: mitiga session bloat por FormBeans acumulados, otimiza rendering de Tiles/JSP, afina DataSources JDBC e reduz overhead de I/O em multipart."
    keywords:
      - "performance struts"
      - "session bloat"
      - "tuning tiles"
      - "datasource struts"
      - "multipart request tuning"
      - "otimizacao jsp legado"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "performance-engineering-patterns"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  struts-unit-test-writer:
    id: "struts-unit-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes unitários isolados de Actions e FormBeans Struts com Mockito e StrutsTestCase/JUnit sem container de servlet"
    description: "Escreve testes unitários desacoplados para Struts: testa Actions como POJOs e com StrutsTestCase/Mockito mockando HttpServletRequest, Response e ActionMapping."
    keywords:
      - "teste unitario struts"
      - "strutstestcase"
      - "mock actionmapping"
      - "mock actionform"
      - "testar action sem servidor"
      - "junit struts"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "test-implementation-backend"
      - "test-coverage-governance"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  struts-integration-test-writer:
    id: "struts-integration-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes de integração do ciclo completo de requisição Struts com container servlet emulado (Tomcat/Jetty embutido) e Testcontainers"
    description: "Escreve testes de integração para Struts: valida ciclo ActionServlet, cadeia de interceptors/filtros, parsing de struts-config.xml e persistência via Testcontainers."
    keywords:
      - "teste integracao struts"
      - "actionservlet test"
      - "ciclo completo struts"
      - "testcontainers struts"
      - "jetty embedded struts"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "test-implementation-backend"
      - "test-coverage-governance"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  struts-test-fixer:
    id: "struts-test-fixer"
    model: "Gemini 3.8 Flash"
    role: "fixer"
    domain: "Diagnóstico e reparo de suítes de teste Struts quebradas em builds legados Ant/Maven Surefire"
    description: "Diagnostica e corrige falhas em testes de Struts legados: ActionForward inválido em assert, falhas de MockStrutsTestCase, classpath XML e regressões de build Ant/Maven."
    keywords:
      - "fix teste struts"
      - "falha strutstestcase"
      - "corrigir teste legado struts"
      - "surefire struts error"
      - "struts-config nao encontrado teste"
    max_iteracoes: 3
    escalonamento: "Após 3 tentativas sem sucesso, retornar ao @agent-router via ask_questions (motivo: 'loop_limite_atingido') — nunca repetir indefinidamente"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "structured-intake-patterns"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

