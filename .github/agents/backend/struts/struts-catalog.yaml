version: "2.0"
domain: "backend-struts"
description: >-
  Sub-catálogo hierárquico consolidado de agentes especializados em Java Legado Struts (Padrão Triádico 3+1).
  Isola a topologia de especialistas Struts do catálogo central global, evitando explosão de nós
  no agent-router e permitindo orquestração local por domínio com alinhamento à governança canônica.

router:
  id: "struts-router"
  role: "supervisor"
  description: "Roteador central do domínio Java Legado Struts — tria e despacha para os 3 especialistas backend (arch-advisor, developer e test-engineer)"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"

agents:
  struts-arch-advisor:
    id: "struts-arch-advisor"
    model: "Claude Sonnet 5.5"
    role: "advisory"
    domain: "Arquitetura Java Legado Struts 1.x/2.x, ActionServlet, descritores XML, Tiles, OGNL e manutenibilidade arquitetural"
    description: "Especialista analítico read-only: arquitetura MVC Struts 1.x/2.x, struts-config.xml, struts.xml, Tiles, interceptors, segurança OGNL e governança de código legado."
    keywords:
      - "arquitetura struts"
      - "auditoria struts"
      - "struts 1"
      - "struts 2"
      - "actionservlet"
      - "struts-config.xml"
      - "ognl"
      - "tiles"
      - "modernizacao struts"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - context-mode/ctx_search
      - context-mode/ctx_batch_execute
      - context-mode/ctx_index
    skills:
      - "java-jdk-backend-governance"
      - "documentation-writing-patterns"
      - "security-review-patterns"
      - "specialist-hybrid-advisory-implementation-patterns"
      - "context-mode"
      - "handoff-governance"
      - "agent-contracts"

  struts-developer:
    id: "struts-developer"
    model: "Claude Sonnet 5.5"
    role: "implementation"
    domain: "Desenvolvimento de Produção Struts, Actions, FormBeans, Mapeamentos XML, Correção Cirúrgica de Bugs e Otimização de Performance"
    description: "Especialista mutativo core: implementa Actions, DispatchActions, FormBeans (ActionForm/DynaActionForm), descritores XML, resolve bugs cirúrgicos (ActionForwards, ClassCastException, vazamentos de sessão) com diff mínimo e otimiza rendering Tiles/JSP e elimina session bloat."
    keywords:
      - "feature struts"
      - "action struts"
      - "dispatchaction"
      - "formbean"
      - "actionform"
      - "dynaactionform"
      - "struts-config"
      - "bugfix struts"
      - "tuning struts"
      - "session bloat"
      - "tiles render"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - get_errors
      - run_in_terminal
      - context-mode/ctx_execute
      - context-mode/ctx_search
      - context-mode/ctx_batch_execute
      - context-mode/ctx_index
      - context-mode/ctx_execute_file
    skills:
      - "java-jdk-backend-governance"
      - "performance-engineering-patterns"
      - "efficient-batch-code-modification"
      - "code-tracing"
      - "context-mode"
      - "handoff-governance"
      - "agent-contracts"
      - "terminal-governance"

  struts-test-engineer:
    id: "struts-test-engineer"
    model: "Claude Sonnet 5.5"
    role: "quality-assurance"
    domain: "Garantia de Qualidade, Testes Unitários StrutsTestCase/Mockito, Testes de Integração Tomcat/Jetty Emulado e Autocorreção sob R-053"
    description: "Especialista mutativo de testes: implementa testes unitários isolados com Mockito e StrutsTestCase (Actions e FormBeans sem Servlet Container), testes de integração em contêiner emulado (Tomcat/Jetty, interceptors, Testcontainers) e realiza diagnóstico e autocorreção de testes com retry cap R-053."
    keywords:
      - "testes struts"
      - "teste unitario struts"
      - "strutstestcase"
      - "mock servlet"
      - "teste integracao struts"
      - "corrigir teste struts"
      - "test fixer struts"
      - "testcontainers struts"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - get_errors
      - run_in_terminal
      - context-mode/ctx_execute
      - context-mode/ctx_search
      - context-mode/ctx_batch_execute
      - context-mode/ctx_index
      - context-mode/ctx_execute_file
    skills:
      - "test-implementation-backend"
      - "test-coverage-governance"
      - "code-tracing"
      - "efficient-batch-code-modification"
      - "context-mode"
      - "handoff-governance"
      - "agent-contracts"
      - "terminal-governance"
