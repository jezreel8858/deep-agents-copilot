version: "2.0"
domain: "backend-spring-boot"
description: >-
  Sub-catálogo hierárquico consolidado de agentes especializados em Spring Boot (Padrão Triádico 3+1).
  Isola a topologia de especialistas Spring Boot/Servlet/JPA do catálogo central global,
  garantindo coesão máxima, menor latência de handoffs e alinhamento à governança canônica.

router:
  id: "spring-boot-router"
  role: "supervisor"
  description: "Roteador central do domínio Spring Boot — tria e despacha para os 3 especialistas backend (arch-advisor, developer e test-engineer)"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"

agents:
  spring-boot-arch-advisor:
    id: "spring-boot-arch-advisor"
    model: "Claude Sonnet 5.5"
    role: "advisory"
    domain: "Arquitetura Spring Boot, Clean Architecture, Java LTS, Virtual Threads e Migrações"
    description: "Especialista analítico read-only: Clean Architecture, Virtual Threads vs Reativo, Java/JDK upgrades, observabilidade e governança de dependências."
    keywords:
      - "auditoria spring"
      - "arquitetura spring boot"
      - "java lts"
      - "jdk 21"
      - "jdk 25"
      - "virtual threads"
      - "upgrade spring"
      - "migracao spring boot"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - context-mode/ctx_search
      - context-mode/ctx_batch_execute
      - context-mode/ctx_index
    skills:
      - "spring-boot-backend-patterns"
      - "specialist-hybrid-advisory-implementation-patterns"
      - "agent-contracts"
      - "context-mode"

  spring-boot-developer:
    id: "spring-boot-developer"
    model: "Claude Sonnet 5.5"
    role: "implementation"
    domain: "Desenvolvimento de Produção, REST Endpoints, Jakarta Persistence, Bugfix e Tuning de Performance"
    description: "Especialista mutativo core: constrói endpoints REST e services transacionais, executa correção cirúrgica de bugs com diff mínimo e aplica otimizações de performance (queries N+1, HikariCP, cache)."
    keywords:
      - "feature spring boot"
      - "endpoint rest spring"
      - "service transacional"
      - "jakarta persistence"
      - "entidade jpa"
      - "bugfix spring"
      - "resolucao de bug spring"
      - "performance spring boot"
      - "query n+1"
      - "hikaricp"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - get_errors
      - run_in_terminal
      - context-mode/ctx_execute
      - context-mode/ctx_search
      - context-mode/ctx_batch_execute
      - context-mode/ctx_index
      - context-mode/ctx_execute_file
    skills:
      - "spring-boot-implementation-patterns"
      - "spring-boot-performance-patterns"
      - "performance-engineering-patterns"
      - "efficient-batch-code-modification"
      - "code-tracing"
      - "context-mode"
      - "handoff-governance"
      - "agent-contracts"
      - "terminal-governance"
      - "embedded-runtime-governance"

  spring-boot-test-engineer:
    id: "spring-boot-test-engineer"
    model: "Claude Sonnet 5.5"
    role: "quality-assurance"
    domain: "Garantia de Qualidade, Testes Unitários JUnit 5/Mockito, Testes de Integração Testcontainers e Autocorreção"
    description: "Especialista mutativo de testes: implementa testes unitários isolados, testes de integração reais (@DataJpaTest, MockMvc, Testcontainers) e realiza diagnóstico e correção de suítes quebradas sob CAP RÍGIDO (R-053)."
    keywords:
      - "testes spring boot"
      - "teste unitario spring"
      - "junit 5"
      - "mockito"
      - "teste integracao spring"
      - "testcontainers"
      - "datajpatest"
      - "mockmvc"
      - "corrigir teste spring"
      - "test fixer spring"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - get_errors
      - run_in_terminal
      - context-mode/ctx_execute
      - context-mode/ctx_search
      - context-mode/ctx_batch_execute
      - context-mode/ctx_index
      - context-mode/ctx_execute_file
    skills:
      - "test-implementation-spring-boot"
      - "test-coverage-governance"
      - "code-tracing"
      - "efficient-batch-code-modification"
      - "context-mode"
      - "handoff-governance"
      - "agent-contracts"
      - "terminal-governance"
      - "embedded-runtime-governance"
