version: "1.0"
domain: "backend-spring-boot"
description: >-
  Sub-catálogo hierárquico de agentes especializados em Spring Boot (Backend Sub-Router).
  Isola a topologia de especialistas Spring Boot/Servlet/JPA do catálogo central global,
  evitando explosão de nós no agent-router e permitindo orquestração local por domínio.

router:
  id: "spring-boot-router"
  role: "supervisor"
  description: "Roteador central do domínio Spring Boot — tria e despacha para os 7 especialistas backend"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"

agents:
  spring-boot-arch-advisor:
    id: "spring-boot-arch-advisor"
    model: "Claude Sonnet 5"
    role: "advisory"
    domain: "Arquitetura Spring Boot, Clean Architecture, Java LTS, Virtual Threads e Migrações"
    description: "Especialista analítico read-only: Clean Architecture, Virtual Threads vs Reativo, Java/JDK upgrades, observabilidade e governança de dependências."
    keywords:
      - "auditoria spring"
      - "arquitetura spring boot"
      - "java lts"
      - "jdk 21"
      - "jdk 25"
      - "virtual threads"
      - "upgrade spring"
      - "migracao spring boot"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "context-mode/ctx_search"
    skills:
      - "spring-boot-backend-patterns"
      - "java-jdk-backend-governance"
      - "specialist-hybrid-advisory-implementation-patterns"
      - "agent-contracts"
      - "context-mode"

  spring-boot-feature-developer:
    id: "spring-boot-feature-developer"
    model: "Gemini 3.8 Flash"
    role: "implementer"
    domain: "Desenvolvimento de endpoints REST, services transacionais, DTOs Records e repositories JPA via TDD estrito"
    description: "Desenvolvedor de features: cria controllers REST (/v1/), services transacionais, entidades Jakarta Persistence e DTOs Records sob TDD."
    keywords:
      - "feature spring boot"
      - "controller rest"
      - "service spring"
      - "jakarta persistence"
      - "jpa repository"
      - "record dto"
      - "tdd spring"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_index"
    skills:
      - "spring-boot-implementation-patterns"
      - "test-implementation-spring-boot"
      - "terminal-governance"
      - "context-mode"

  spring-boot-bug-fixer:
    id: "spring-boot-bug-fixer"
    model: "Gemini 3.8 Flash"
    role: "fixer"
    domain: "Correções cirúrgicas de exceptions de runtime, transações e bugs em produção"
    description: "Especialista em resolução rápida de bugs: corrige BusinessException, LazyInitializationException, rollbacks incorretos e deadlocks com diff mínimo e teste de regressão."
    keywords:
      - "bug spring boot"
      - "fix spring"
      - "lazyinitializationexception"
      - "transactional rollback"
      - "exceptionhandler"
      - "corrigir erro spring"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "code-tracing"
      - "spring-boot-implementation-patterns"
      - "test-implementation-spring-boot"
      - "terminal-governance"
      - "context-mode"

  spring-boot-perf-tuner:
    id: "spring-boot-perf-tuner"
    model: "Gemini 3.8 Flash"
    role: "performance"
    domain: "Otimização de queries N+1, pool HikariCP, cache em camadas e Garbage Collection"
    description: "Especialista em performance: elimina N+1 com EntityGraph/Record DTOs, calibra HikariCP, configura cache Caffeine L1 + Redis L2, Generational ZGC e Spring AOT."
    keywords:
      - "n+1 spring"
      - "hikaricp"
      - "performance spring boot"
      - "cache redis spring"
      - "caffeine cache"
      - "entitygraph"
      - "zgc"
      - "spring aot"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "spring-boot-performance-patterns"
      - "performance-engineering-patterns"
      - "terminal-governance"
      - "context-mode"

  spring-boot-unit-test-writer:
    id: "spring-boot-unit-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes unitários puros com JUnit 5 + Mockito sem levantar ApplicationContext"
    description: "Escreve testes unitários isolados com @ExtendWith(MockitoExtension.class), mocks estritos com Mockito e validações de regras de negócio em services."
    keywords:
      - "unit test spring"
      - "junit 5"
      - "mockito"
      - "teste unitario java"
      - "mock service spring"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "test-implementation-spring-boot"
      - "test-implementation-backend"
      - "terminal-governance"
      - "context-mode"

  spring-boot-integration-test-writer:
    id: "spring-boot-integration-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes integrados com @SpringBootTest, @WebMvcTest, @DataJpaTest e Testcontainers"
    description: "Escreve testes de integração com banco de dados real via Testcontainers, validação de segurança Spring Security e testes de repositório JPA e Flyway."
    keywords:
      - "integration test spring"
      - "springboottest"
      - "webmvctest"
      - "datajpatest"
      - "testcontainers"
      - "teste integracao spring"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "test-implementation-spring-boot"
      - "test-implementation-backend"
      - "terminal-governance"
      - "context-mode"

  spring-boot-test-fixer:
    id: "spring-boot-test-fixer"
    model: "Gemini 3.8 Flash"
    role: "fixer"
    domain: "Diagnóstico e autocorreção de logs de falha de testes em Maven/Gradle"
    description: "Analisa relatórios de falhas de suítes de teste Java, corrige falhas de Mockito, quebras de contexto Spring e fixtures desatualizadas."
    keywords:
      - "fix teste spring"
      - "falha teste junit"
      - "broken test spring"
      - "corrigir teste java"
      - "mvn test error"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "test-implementation-spring-boot"
      - "structured-intake-patterns"
      - "terminal-governance"
      - "context-mode"
