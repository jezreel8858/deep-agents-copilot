version: "3.0"
domain: "backend-python"
description: >-
  Sub-catálogo hierárquico consolidado de agentes especializados em Python Backend (FastAPI, Flask, Django, Pydantic, SQLAlchemy, pytest) e automação/testes Python do repositório (tools/**/*.py, scripts/**/*.py, tests/**/*.py).
  Estruturado no Padrão Triádico 3+1 (1 supervisor hierárquico + 3 especialistas consolidados: python-arch-advisor, python-developer e python-test-engineer).

router:
  id: "python-router"
  role: "supervisor"
  description: "Roteador central do domínio Python Backend e ferramental/testes Python do repositório — tria e despacha para os 3 especialistas (1º python-arch-advisor -> 2º python-developer / python-test-engineer)"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"
    - "embedded-runtime-governance"

agents:
  python-arch-advisor:
    id: "python-arch-advisor"
    model: "Claude Sonnet 5.5"
    role: "advisory"
    domain: "Arquitetura Python Backend, Clean Architecture, FastAPI, Flask, Django, Pydantic, tipagem estrita, performance analítica, planos de modernização e planejamento técnico de implementação/testes (docs/plans/implementation/) para aplicações e ferramental/testes do repositório (tools/**/*.py, scripts/**/*.py, tests/**/*.py)"
    description: "Especialista analítico e planejador read-only (1º passo da Tríade Python): arquitetura Python 3.11+, Clean Architecture, design de APIs REST/async, tipagem PEP 484/mypy strict, Plano de Implementação e Testes R-064 em docs/plans/implementation/ (incluindo demandas híbridas de governança via related-planning-doc), auditoria de dependências, mitigação de N+1 queries, profiling e estratégias de modernização."
    keywords:
      - "arquitetura python"
      - "auditoria python"
      - "fastapi"
      - "django"
      - "flask"
      - "clean architecture python"
      - "mypy strict"
      - "design api python"
      - "performance analitica python"
      - "n+1 sqlalchemy"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - context-mode/ctx_search
      - context-mode/ctx_batch
      - context-mode/ctx_index
    skills:
      - "performance-engineering-patterns"
      - "specialist-hybrid-advisory-implementation-patterns"
      - "documentation-writing-patterns"
      - "security-review-patterns"
      - "agent-contracts"
      - "context-mode"
      - "embedded-runtime-governance"

  python-developer:
    id: "python-developer"
    model: Grok 4.7
    role: "implementer"
    domain: "Desenvolvimento de features, automação/tooling do repositório (tools/**/*.py, scripts/**/*.py), correção cirúrgica de bugs e otimização de performance para Python Backend (FastAPI, Flask, Django, Pydantic, SQLAlchemy, asyncio)"
    description: "Especialista consolidador mutativo (2º passo da Tríade Python): constrói endpoints REST, schemas Pydantic, repositórios SQLAlchemy, services e utilitários/CLIs em tools/**/*.py e scripts/**/*.py sob TDD estrito e plano R-064 do python-arch-advisor; diagnostica e resolve runtime errors com diffs mínimos; e otimiza event loop e pools de conexão."
    keywords:
      - "python developer"
      - "feature python"
      - "fastapi"
      - "django"
      - "flask"
      - "pydantic model"
      - "sqlalchemy"
      - "async def"
      - "bug python"
      - "fix python"
      - "performance python"
      - "tuning asyncio"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - get_errors
      - run_in_terminal
      - context-mode/ctx_execute
      - context-mode/ctx_search
      - context-mode/ctx_batch
      - context-mode/ctx_index
      - context-mode/ctx_execute
    skills:
      - "performance-engineering-patterns"
      - "efficient-batch-code-modification"
      - "code-tracing"
      - "context-mode"
      - "terminal-governance"
      - "agent-contracts"
      - "embedded-runtime-governance"

  python-test-engineer:
    id: "python-test-engineer"
    model: Grok 4.7
    role: "tester"
    domain: "Engenharia de testes e qualidade para Python Backend e suítes determinísticas do repositório (tests/**/*.py, tests/governance_audit/**/*.py): testes unitários (pytest), testes de integração (TestClient, Testcontainers) e reparo de suítes de testes quebradas"
    description: "Especialista consolidador de testes (2º passo da Tríade Python): constrói testes unitários puros isolados e sensores determinísticos de governança (tests/governance_audit/**/*.py sob R-055 Q3) mediante plano R-064 do python-arch-advisor; implementa testes de integração com TestClient e Testcontainers; e diagnostica e corrige falhas na suíte pytest com retry cap estrito sob R-053."
    keywords:
      - "python test engineer"
      - "teste unitario python"
      - "pytest"
      - "pytest mock"
      - "fixtures conftest"
      - "teste integracao python"
      - "testclient fastapi"
      - "testcontainers python"
      - "fix teste python"
      - "pytest quebrado"
    max_iteracoes: 2
    escalonamento: "Após 2 tentativas sem sucesso, escalar para @bug-triage via ask_questions (R-053)"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - get_errors
      - run_in_terminal
      - context-mode/ctx_execute
      - context-mode/ctx_search
      - context-mode/ctx_batch
      - context-mode/ctx_index
      - context-mode/ctx_execute
    skills:
      - "test-implementation-python"
      - "test-implementation-backend"
      - "test-coverage-governance"
      - "efficient-batch-code-modification"
      - "code-tracing"
      - "context-mode"
      - "terminal-governance"
      - "agent-contracts"
      - "embedded-runtime-governance"
