version: "3.0"
domain: "backend-python"
description: >-
  Sub-catálogo hierárquico consolidado de agentes especializados em Python Backend (FastAPI, Flask, Django, Pydantic, SQLAlchemy, pytest).
  Estruturado no Padrão Triádico 3+1 (1 supervisor hierárquico + 3 especialistas consolidados: arch-advisor, developer e test-engineer).

router:
  id: "python-router"
  role: "supervisor"
  description: "Roteador central do domínio Python Backend — tria e despacha para os 3 especialistas backend"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"

agents:
  python-arch-advisor:
    id: "python-arch-advisor"
    model: "Claude Sonnet 5.5"
    role: "advisory"
    domain: "Arquitetura Python Backend, Clean Architecture, FastAPI, Flask, Django, Pydantic, tipagem estrita, performance analítica e planos de modernização"
    description: "Especialista analítico read-only: arquitetura Python 3.11+, Clean Architecture, design de APIs REST/async, tipagem PEP 484/mypy strict, auditoria de dependências, mitigação de N+1 queries, profiling e estratégias de modernização."
    keywords:
      - "arquitetura python"
      - "auditoria python"
      - "fastapi"
      - "django"
      - "flask"
      - "clean architecture python"
      - "mypy strict"
      - "design api python"
      - "performance analitica python"
      - "n+1 sqlalchemy"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - context-mode/ctx_search
      - context-mode/ctx_batch_execute
      - context-mode/ctx_index
    skills:
      - "performance-engineering-patterns"
      - "specialist-hybrid-advisory-implementation-patterns"
      - "documentation-writing-patterns"
      - "security-review-patterns"
      - "agent-contracts"
      - "context-mode"

  python-developer:
    id: "python-developer"
    model: "Claude Sonnet 5.5"
    role: "implementer"
    domain: "Desenvolvimento de features, correção cirúrgica de bugs e otimização de performance para Python Backend (FastAPI, Flask, Django, Pydantic, SQLAlchemy, asyncio)"
    description: "Especialista consolidador mutativo: constrói endpoints REST, schemas Pydantic, repositórios SQLAlchemy e services sob TDD estrito; diagnostica e resolve runtime errors (TypeError, AttributeError, deadlocks) com diffs mínimos; e otimiza event loop e pools de conexão."
    keywords:
      - "python developer"
      - "feature python"
      - "fastapi"
      - "django"
      - "flask"
      - "pydantic model"
      - "sqlalchemy"
      - "async def"
      - "bug python"
      - "fix python"
      - "performance python"
      - "tuning asyncio"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - get_errors
      - run_in_terminal
      - context-mode/ctx_execute
      - context-mode/ctx_search
      - context-mode/ctx_batch_execute
      - context-mode/ctx_index
      - context-mode/ctx_execute_file
    skills:
      - "performance-engineering-patterns"
      - "efficient-batch-code-modification"
      - "code-tracing"
      - "context-mode"
      - "terminal-governance"
      - "agent-contracts"

  python-test-engineer:
    id: "python-test-engineer"
    model: "Claude Sonnet 5.5"
    role: "tester"
    domain: "Engenharia de testes e qualidade para Python Backend: testes unitários (pytest), testes de integração (TestClient, Testcontainers) e reparo de suítes de testes quebradas"
    description: "Especialista consolidador de testes: constrói testes unitários puros isolados com fixtures e mocks estritos; implementa testes de integração com TestClient e Testcontainers; e diagnostica e corrige falhas na suíte de testes com retry cap estrito sob R-053."
    keywords:
      - "python test engineer"
      - "teste unitario python"
      - "pytest"
      - "pytest mock"
      - "fixtures conftest"
      - "teste integracao python"
      - "testclient fastapi"
      - "testcontainers python"
      - "fix teste python"
      - "pytest quebrado"
    max_iteracoes: 2
    escalonamento: "Após 2 tentativas sem sucesso, escalar para @bug-triage via ask_questions (R-053)"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - get_errors
      - run_in_terminal
      - context-mode/ctx_execute
      - context-mode/ctx_search
      - context-mode/ctx_batch_execute
      - context-mode/ctx_index
      - context-mode/ctx_execute_file
    skills:
      - "test-implementation-python"
      - "test-implementation-backend"
      - "test-coverage-governance"
      - "efficient-batch-code-modification"
      - "code-tracing"
      - "context-mode"
      - "terminal-governance"
      - "agent-contracts"
