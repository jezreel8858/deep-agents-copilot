version: "1.0"
domain: "backend-python"
description: >-
  Sub-catálogo hierárquico de agentes especializados em Python Backend (FastAPI, Flask, Django, Pydantic, SQLAlchemy, pytest).
  Isola a topologia de especialistas Python do catálogo central global, evitando explosão de nós no agent-router e permitindo orquestração local por domínio.

router:
  id: "python-router"
  role: "supervisor"
  description: "Roteador central do domínio Python Backend — tria e despacha para os 7 especialistas backend"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"

agents:
  python-arch-advisor:
    id: "python-arch-advisor"
    model: "Claude Sonnet 5"
    role: "advisory"
    domain: "Arquitetura Python Backend, Clean Architecture, FastAPI, Flask, Django, Pydantic, tipagem estrita e planos de modernização"
    description: "Especialista analítico read-only: arquitetura Python 3.11+, Clean Architecture, design de APIs REST/async, tipagem PEP 484/mypy strict, auditoria de dependências e estratégias de modernização."
    keywords:
      - "arquitetura python"
      - "auditoria python"
      - "fastapi"
      - "django"
      - "flask"
      - "clean architecture python"
      - "mypy strict"
      - "design api python"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "context-mode/ctx_search"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_execute_file"
      - "context-mode/ctx_index"
    skills:
      - "test-implementation-python"
      - "specialist-hybrid-advisory-implementation-patterns"
      - "codegraph-optave-usage"
      - "agent-contracts"
      - "context-mode"

  python-feature-developer:
    id: "python-feature-developer"
    model: "Gemini 3.8 Flash"
    role: "implementer"
    domain: "Desenvolvimento de features Python backend com FastAPI, Flask, Django, SQLAlchemy, Pydantic e async/await sob TDD estrito"
    description: "Desenvolvedor de features Python: constrói endpoints REST, schemas Pydantic, repositórios SQLAlchemy/ORM, services desacoplados sob TDD com pytest."
    keywords:
      - "feature python"
      - "fastapi endpoint"
      - "pydantic model"
      - "sqlalchemy repo"
      - "async def"
      - "tdd python"
      - "api python"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_index"
      - "context-mode/ctx_execute_file"
    skills:
      - "test-implementation-python"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  python-bug-fixer:
    id: "python-bug-fixer"
    model: "Gemini 3.8 Flash"
    role: "fixer"
    domain: "Correção cirúrgica de runtime errors em Python (TypeError, AttributeError, asyncio deadlocks, conexões ORM, unhandled exceptions)"
    description: "Especialista em resolução rápida de bugs Python: corrige falhas assíncronas, problemas de tipagem runtime, vazamentos de conexão e exceptions de validação Pydantic com diff mínimo."
    keywords:
      - "bug python"
      - "fix python"
      - "typeerror"
      - "attributeerror"
      - "asyncio error"
      - "pydantic validation error"
      - "corrigir erro python"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_execute_file"
      - "context-mode/ctx_index"
    skills:
      - "code-tracing"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  python-perf-tuner:
    id: "python-perf-tuner"
    model: "Gemini 3.8 Flash"
    role: "performance"
    domain: "Otimização de performance Python — event loop asyncio, N+1 queries em ORMs (SQLAlchemy/Django), pool de conexões e profiling"
    description: "Especialista em performance Python: elimina bloqueios no event loop, otimiza queries SQLAlchemy/Django ORM com eager loading, afina pools de conexão e parametriza Uvicorn/Gunicorn workers."
    keywords:
      - "performance python"
      - "tuning asyncio"
      - "n+1 sqlalchemy"
      - "uvicorn workers"
      - "gunicorn tuning"
      - "profiling python"
      - "otimizacao query python"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_execute_file"
      - "context-mode/ctx_index"
    skills:
      - "performance-engineering-patterns"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  python-unit-test-writer:
    id: "python-unit-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes unitários puros em Python com pytest, pytest-mock, unittest.mock e fixtures em conftest.py"
    description: "Escreve testes unitários isolados com pytest: testa services e regras de negócio puras com fixtures bem delimitadas, mocks com spec e alta cobertura (>=80%)."
    keywords:
      - "teste unitario python"
      - "pytest"
      - "pytest mock"
      - "fixtures conftest"
      - "testar service python"
      - "unit test python"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_execute_file"
      - "context-mode/ctx_index"
    skills:
      - "test-implementation-python"
      - "test-implementation-backend"
      - "test-coverage-governance"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  python-integration-test-writer:
    id: "python-integration-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes de integração para APIs Python com TestClient (FastAPI/Starlette/Flask/Django), HTTPX e Testcontainers"
    description: "Escreve testes de integração com banco e HTTP real: valida rotas REST com TestClient/AsyncClient, transações em banco de teste com rollback e Testcontainers."
    keywords:
      - "teste integracao python"
      - "testclient fastapi"
      - "httpx asyncclient"
      - "pytest async"
      - "testcontainers python"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_execute_file"
      - "context-mode/ctx_index"
    skills:
      - "test-implementation-python"
      - "test-implementation-backend"
      - "test-coverage-governance"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  python-test-fixer:
    id: "python-test-fixer"
    model: "Gemini 3.8 Flash"
    role: "fixer"
    domain: "Diagnóstico e reparo de testes quebrados no pytest, asserções desatualizadas e quebras de fixtures"
    description: "Diagnostica e corrige falhas em suítes pytest: desvios de fixtures, problemas de event loop em pytest-asyncio, mocks incorretos e regressões com diff cirúrgico."
    keywords:
      - "fix teste python"
      - "pytest quebrado"
      - "falha fixture"
      - "corrigir teste pytest"
      - "pytest-asyncio error"
    max_iteracoes: 3
    escalonamento: "Após 3 tentativas sem sucesso, retornar ao @agent-router via ask_questions (motivo: 'loop_limite_atingido') — nunca repetir indefinidamente"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_execute_file"
      - "context-mode/ctx_index"
    skills:
      - "test-implementation-python"
      - "structured-intake-patterns"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

