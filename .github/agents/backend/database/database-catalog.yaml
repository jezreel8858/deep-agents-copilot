version: "1.0"
domain: "backend-database"
description: >-
  Sub-catálogo hierárquico de agentes especializados em Banco de Dados (Database Domain Sub-Router).
  Isola a topologia de especialistas Oracle e Informix (DDL/Flyway, Stored Procedures/SPL, Query Tuning/Explain Plan)
  do catálogo central global, evitando explosão de nós no agent-router e garantindo governança estrita de segurança e menor privilégio.

router:
  id: "database-router"
  role: "supervisor"
  description: "Roteador central do domínio de Banco de Dados — tria por SGBD (Oracle vs Informix) e objetivo técnico (DDL, Stored Procs, Tuning) e despacha para os 6 especialistas"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"

agents:
  oracle-migration-dev:
    id: "oracle-migration-dev"
    model: "Claude Sonnet 5"
    role: "implementer"
    domain: "Migrações de Schema DDL, Flyway, Sequences, Tablespaces e Integridade Referencial em Oracle Database"
    description: "Desenvolvedor de migrações DDL para Oracle: implementa scripts Flyway versionados (V__ e R__), sequences, constraints, particionamento e scripts de rollback com idempotência estrita."
    keywords:
      - "migracao oracle"
      - "ddl oracle"
      - "flyway oracle"
      - "sequence oracle"
      - "tablespace oracle"
      - "particionamento oracle"
      - "constraint oracle"
      - "alter table oracle"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_index"
      - "context-mode/ctx_execute_file"
    skills:
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  oracle-plsql-expert:
    id: "oracle-plsql-expert"
    model: "Claude Sonnet 5"
    role: "implementer"
    domain: "Desenvolvimento e manutenção de Stored Procedures, Functions, Packages e Triggers em Oracle PL/SQL"
    description: "Especialista em Oracle PL/SQL: implementa Packages (spec/body), Procedures, Functions, Triggers, cursores, BULK COLLECT, FORALL e tratamento de exceções com RAISE_APPLICATION_ERROR sob TDD/validação estrita."
    keywords:
      - "plsql"
      - "pl/sql"
      - "procedure oracle"
      - "function oracle"
      - "package oracle"
      - "package body"
      - "trigger oracle"
      - "bulk collect"
      - "forall oracle"
      - "cursor plsql"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_index"
      - "context-mode/ctx_execute_file"
    skills:
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  oracle-query-tuner:
    id: "oracle-query-tuner"
    model: "Claude Sonnet 5"
    role: "advisory"
    domain: "Análise de Planos de Execução (Explain Plan, DBMS_XPLAN), CBO e Otimização de Consultas em Oracle Database"
    description: "Especialista analítico read-only: diagnostica consultas lentas em Oracle via EXPLAIN PLAN e DBMS_XPLAN, identifica Full Table Scans indesejados, analisa Predicate Information (Access/Filter) e projeta índices e hints sem alterar código sem aprovação."
    keywords:
      - "tuning oracle"
      - "explain plan oracle"
      - "dbms_xplan"
      - "cbo oracle"
      - "otimizar query oracle"
      - "hint oracle"
      - "full table scan oracle"
      - "indice oracle"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_execute_file"
      - "context-mode/ctx_index"
    skills:
      - "performance-engineering-patterns"
      - "agent-contracts"
      - "context-mode"

  informix-migration-dev:
    id: "informix-migration-dev"
    model: "Claude Sonnet 5"
    role: "implementer"
    domain: "Migrações de Schema DDL, Flyway, Dbspaces, Fragmentação e Tipos Informix (IDS)"
    description: "Desenvolvedor de migrações DDL para IBM Informix: implementa scripts Flyway versionados, dbspaces, fragmentação por expressão, lock mode row, tipos SERIAL/DATETIME e scripts de reversão com idempotência."
    keywords:
      - "migracao informix"
      - "ddl informix"
      - "flyway informix"
      - "dbspace informix"
      - "fragmentacao informix"
      - "lock mode informix"
      - "serial informix"
      - "alter table informix"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_index"
      - "context-mode/ctx_execute_file"
    skills:
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  informix-spl-expert:
    id: "informix-spl-expert"
    model: "Claude Sonnet 5"
    role: "implementer"
    domain: "Desenvolvimento e manutenção de Stored Procedures e Funções em Informix SPL (Stored Procedure Language)"
    description: "Especialista em IBM Informix SPL: implementa CREATE PROCEDURE/FUNCTION, variáveis DEFINE, RETURNING, FOREACH, cursores SPL, tratamento de exceções com ON EXCEPTION e triggers Informix."
    keywords:
      - "spl informix"
      - "stored procedure informix"
      - "procedure informix"
      - "function informix"
      - "foreach informix"
      - "on exception informix"
      - "return with resume"
      - "trigger informix"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_index"
      - "context-mode/ctx_execute_file"
    skills:
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  informix-query-tuner:
    id: "informix-query-tuner"
    model: "Claude Sonnet 5"
    role: "advisory"
    domain: "Análise de SET EXPLAIN (sqexplain.out), Níveis de Isolamento e Otimização de Consultas em Informix"
    description: "Especialista analítico read-only: analisa planos de execução do IBM Informix via SET EXPLAIN ON/FILE TO, diagnostica varreduras sequenciais em sqexplain.out, calibra níveis de isolamento (DIRTY READ, COMMITTED READ) e projeta diretivas de otimização ({+INDEX})."
    keywords:
      - "tuning informix"
      - "set explain informix"
      - "sqexplain.out"
      - "otimizar query informix"
      - "dirty read informix"
      - "isolation informix"
      - "diretiva informix"
      - "update statistics"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_execute_file"
      - "context-mode/ctx_index"
    skills:
      - "performance-engineering-patterns"
      - "agent-contracts"
      - "context-mode"

