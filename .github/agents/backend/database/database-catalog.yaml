version: "2.0"
domain: "backend-database"
description: >-
  Sub-catálogo hierárquico consolidado de agentes especializados em Banco de Dados (Padrão Triádico 3+1).
  Isola a topologia de especialistas Oracle e Informix do catálogo central global,
  garantindo coesão máxima, menor latência de handoffs e alinhamento à governança canônica.

router:
  id: "database-router"
  role: "supervisor"
  description: "Roteador central do domínio de Banco de Dados — tria por SGBD e objetivo técnico e despacha para os 3 especialistas do catálogo database (database-arch-advisor, oracle-database-specialist e informix-database-specialist)"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"

agents:
  database-arch-advisor:
    id: "database-arch-advisor"
    model: "Claude Sonnet 5.5"
    role: "advisory"
    domain: "Análise de Planos de Execução (Explain Plan, DBMS_XPLAN, sqexplain.out), Otimização de Consultas, Índices e Design de Schema em Oracle e Informix"
    description: "Especialista analítico read-only unificado: diagnostica planos de execução (EXPLAIN PLAN, DBMS_XPLAN, SET EXPLAIN/sqexplain.out), identifica full table scans/sequential scans, projeta índices e hints/diretivas, e orienta modelagem relacional sem alterar código sem aprovação."
    keywords:
      - "tuning oracle"
      - "tuning informix"
      - "explain plan"
      - "dbms_xplan"
      - "sqexplain.out"
      - "set explain"
      - "cbo oracle"
      - "otimizar query oracle"
      - "otimizar query informix"
      - "indice oracle"
      - "indice informix"
      - "full table scan"
      - "sequential scan"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - context-mode/ctx_search
      - context-mode/ctx_batch_execute
      - context-mode/ctx_index
    skills:
      - "performance-engineering-patterns"
      - "context-mode"
      - "agent-contracts"
      - "handoff-governance"

  oracle-database-specialist:
    id: "oracle-database-specialist"
    model: "Claude Sonnet 5.5"
    role: "implementation"
    domain: "Migrações DDL Flyway, Sequences, Particionamento e Programação Procedural PL/SQL em Oracle Database"
    description: "Especialista executor unificado para Oracle Database: constrói e aplica migrações Flyway versionadas (V__ e R__), sequences, constraints, particionamento e desenvolve Packages (spec/body), Procedures, Functions, Triggers, cursores e BULK COLLECT/FORALL sob R-046."
    keywords:
      - "migracao oracle"
      - "ddl oracle"
      - "flyway oracle"
      - "sequence oracle"
      - "tablespace oracle"
      - "particionamento oracle"
      - "plsql"
      - "pl/sql"
      - "procedure oracle"
      - "function oracle"
      - "package oracle"
      - "package body"
      - "trigger oracle"
      - "bulk collect"
      - "forall oracle"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - get_errors
      - run_in_terminal
      - context-mode/ctx_execute
      - context-mode/ctx_search
      - context-mode/ctx_batch_execute
      - context-mode/ctx_index
      - context-mode/ctx_execute_file
    skills:
      - "context-mode"
      - "efficient-batch-code-modification"
      - "handoff-governance"
      - "agent-contracts"
      - "terminal-governance"

  informix-database-specialist:
    id: "informix-database-specialist"
    model: "Claude Sonnet 5.5"
    role: "implementation"
    domain: "Migrações DDL Flyway, Dbspaces, Fragmentação e Programação Procedural SPL em IBM Informix"
    description: "Especialista executor unificado para IBM Informix: constrói e aplica migrações Flyway versionadas, dbspaces, fragmentação por expressão, lock mode row, e desenvolve Stored Procedures, Funções, Triggers e rotinas SPL (DEFINE, FOREACH, RETURN WITH RESUME, ON EXCEPTION) sob R-046."
    keywords:
      - "migracao informix"
      - "ddl informix"
      - "flyway informix"
      - "dbspace informix"
      - "fragmentacao informix"
      - "spl informix"
      - "stored procedure informix"
      - "procedure informix"
      - "function informix"
      - "trigger informix"
      - "foreach informix"
      - "on exception informix"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - get_errors
      - run_in_terminal
      - context-mode/ctx_execute
      - context-mode/ctx_search
      - context-mode/ctx_batch_execute
      - context-mode/ctx_index
      - context-mode/ctx_execute_file
    skills:
      - "context-mode"
      - "efficient-batch-code-modification"
      - "handoff-governance"
      - "agent-contracts"
      - "terminal-governance"
