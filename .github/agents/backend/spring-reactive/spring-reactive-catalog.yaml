version: "1.0"
domain: "backend-spring-reactive"
description: >-
  Sub-catálogo hierárquico de agentes especializados em Spring WebFlux e Project Reactor (Reactive Sub-Router).
  Isola a topologia de especialistas assíncronos não-bloqueantes do catálogo central global,
  evitando explosão de nós no agent-router e permitindo orquestração local por domínio.

router:
  id: "spring-reactive-router"
  role: "supervisor"
  description: "Roteador central do domínio Spring Reactive — tria e despacha para os 7 especialistas reativos"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"

agents:
  spring-reactive-arch-advisor:
    id: "spring-reactive-arch-advisor"
    model: "Gemini 3.8 Flash"
    role: "advisory"
    domain: "Dimensionamento de capacidade, compatibilidade R2DBC vs JDBC e topologia reativa"
    description: "Especialista analítico read-only: adequação reativa, dimensionamento de Netty event-loops, análise de gargalos em pipelines Reactor e mitigação de blocking calls."
    keywords:
      - "auditoria reativa"
      - "arquitetura webflux"
      - "reactor"
      - "event loop"
      - "netty"
      - "r2dbc"
      - "backpressure"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "context-mode/ctx_search"
      - "context-mode/ctx_fetch_and_index"
    skills:
      - "spring-reactive-webflux-patterns"
      - "java-jdk-backend-governance"
      - "specialist-hybrid-advisory-implementation-patterns"
      - "agent-contracts"
      - "context-mode"

  spring-reactive-feature-developer:
    id: "spring-reactive-feature-developer"
    model: "Gemini 3.8 Flash"
    role: "implementer"
    domain: "Desenvolvimento não-bloqueante com Functional Endpoints, operadores Reactor e R2DBC via TDD com StepVerifier"
    description: "Desenvolvedor reativo: constrói endpoints WebFlux, composição não-bloqueante com Mono/Flux, repositories R2DBC e DTOs reativos sob TDD estrito."
    keywords:
      - "feature webflux"
      - "mono"
      - "flux"
      - "routerfunction"
      - "r2dbc repository"
      - "tdd reativo"
      - "stepverifier"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_index"
    skills:
      - "spring-reactive-implementation-patterns"
      - "test-implementation-backend"
      - "terminal-governance"
      - "context-mode"

  spring-reactive-bug-fixer:
    id: "spring-reactive-bug-fixer"
    model: "Gemini 3.8 Flash"
    role: "fixer"
    domain: "Diagnóstico e eliminação de bloqueios no event-loop, race conditions e tratamento de erros reativos"
    description: "Especialista em resolução de bugs reativos: detecta e elimina chamadas bloqueantes com BlockHound, trata erros em operadores (onErrorResume) e evita memory leaks."
    keywords:
      - "bug webflux"
      - "blockhound"
      - "bloqueio event loop"
      - "onerrorresume"
      - "fix reativo"
      - "memory leak netty"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "code-tracing"
      - "spring-reactive-implementation-patterns"
      - "terminal-governance"
      - "context-mode"

  spring-reactive-resilience-tuner:
    id: "spring-reactive-resilience-tuner"
    model: "Gemini 3.8 Flash"
    role: "performance"
    domain: "Estratégias de backpressure, tuning de buffers Netty, pooling R2DBC e Circuit Breakers"
    description: "Especialista em resiliência: configura limitRate, buffer/drop policies, otimiza PooledByteBufAllocator do Netty, pool R2DBC e integra Resilience4j reativo."
    keywords:
      - "backpressure webflux"
      - "limitrate"
      - "buffer overflow"
      - "resilience4j reativo"
      - "netty memory"
      - "r2dbc pool"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "spring-reactive-performance-patterns"
      - "performance-engineering-patterns"
      - "terminal-governance"
      - "context-mode"

  spring-reactive-unit-test-writer:
    id: "spring-reactive-unit-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes unitários de pipelines reativos com StepVerifier, Mono e Flux"
    description: "Escreve testes de unidades reativas com StepVerifier, validando emissão de elementos (expectNext), sinais de erro e completude assíncrona."
    keywords:
      - "unit test webflux"
      - "stepverifier"
      - "testar mono"
      - "testar flux"
      - "teste unitario reativo"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "spring-reactive-implementation-patterns"
      - "test-implementation-backend"
      - "terminal-governance"
      - "context-mode"

  spring-reactive-integration-test-writer:
    id: "spring-reactive-integration-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes de integração com WebTestClient, SSE, WebSocket e R2DBC com Testcontainers"
    description: "Escreve testes integrados de endpoints reativos com WebTestClient, streaming de eventos em tempo real e persistência R2DBC não-bloqueante."
    keywords:
      - "integration test webflux"
      - "webtestclient"
      - "sse test"
      - "websocket reativo"
      - "r2dbc testcontainers"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "spring-reactive-implementation-patterns"
      - "test-implementation-backend"
      - "terminal-governance"
      - "context-mode"

  spring-reactive-test-fixer:
    id: "spring-reactive-test-fixer"
    model: "Gemini 3.8 Flash"
    role: "fixer"
    domain: "Diagnóstico e autocorreção de falhas em testes reativos (timeouts assíncronos e streams pendentes)"
    description: "Analisa falhas de StepVerifier, streams não completados, problemas de scheduler assíncrono e cancelamentos prematuros de subscrição."
    keywords:
      - "fix teste webflux"
      - "stepverifier timeout"
      - "broken spec reactor"
      - "corrigir teste reativo"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "spring-reactive-implementation-patterns"
      - "structured-intake-patterns"
      - "terminal-governance"
      - "context-mode"

