version: '2.0'
domain: backend-spring-reactive
description: Sub-catálogo hierárquico consolidado de agentes especializados em Spring
  Reactive (Padrão Triádico 3+1). Isola a topologia reativa de backend do catálogo
  central global, garantindo coesão máxima, menor latência de handoffs e conformidade
  com fluxos não-bloqueantes.
agents:
  spring-reactive-arch-advisor:
    id: spring-reactive-arch-advisor
    role: architecture
    description: Read-only advisor para arquitetura reativa Spring WebFlux, Reactor
      (Mono/Flux), R2DBC e fluxos assíncronos não-bloqueantes.
    keywords:
    - arquitetura spring reactive
    - webflux blueprint
    - mono flux design
    - r2dbc architecture
    - backpressure strategy
    tools:
    - read_file
    - file_search
    - grep_search
    - list_dir
    - ask_questions
    - context-mode/ctx_search
    - context-mode/ctx_execute_file
    skills:
    - spring-reactive-webflux-patterns
    - spring-reactive-implementation-patterns
    - architecture-decision-records
    - context-mode
    - handoff-governance
    - agent-contracts
    model: Claude Sonnet 5.5
  spring-reactive-developer:
    id: spring-reactive-developer
    role: implementation
    description: 'Especialista consolidador de backend reativo: implementação de rotas
      WebFlux, handlers reativos, persistência R2DBC, correção cirúrgica de bugs reativos
      (bloqueio de event loop, memory leaks) e tuning de performance/concorrência
      com baseline gate.'
    keywords:
    - feature webflux
    - endpoint reativo
    - mono flux
    - r2dbc
    - routerfunction
    - bugfix reativo
    - bloqueio event loop
    - blockhound
    - perf tuner webflux
    - concorrencia reativa
    tools:
    - file_search
    - grep_search
    - list_dir
    - ask_questions
    - run_subagent
    - get_errors
    - run_in_terminal
    - context-mode/ctx_execute
    - context-mode/ctx_search
    - context-mode/ctx_batch_execute
    - context-mode/ctx_index
    - context-mode/ctx_execute_file
    skills:
    - spring-reactive-implementation-patterns
    - spring-reactive-webflux-patterns
    - spring-reactive-performance-patterns
    - performance-engineering-patterns
    - code-tracing
    - efficient-batch-code-modification
    - context-mode
    - handoff-governance
    - agent-contracts
    - terminal-governance
    model: Claude Sonnet 5.5
  spring-reactive-test-engineer:
    id: spring-reactive-test-engineer
    role: testing
    description: 'Especialista consolidador de testes reativos e qualidade: testes
      unitários com StepVerifier e VirtualTimeScheduler, testes de integração com
      WebTestClient e Testcontainers R2DBC, além de autocorreção de testes com retry
      cap estrito (R-053).'
    keywords:
    - stepverifier
    - teste unitario webflux
    - virtualtimescheduler
    - webtestclient
    - teste integracao webflux
    - testcontainers r2dbc
    - corrigir teste reativo
    - test fixer webflux
    tools:
    - file_search
    - grep_search
    - list_dir
    - ask_questions
    - run_subagent
    - get_errors
    - run_in_terminal
    - context-mode/ctx_execute
    - context-mode/ctx_search
    - context-mode/ctx_batch_execute
    - context-mode/ctx_index
    - context-mode/ctx_execute_file
    skills:
    - spring-reactive-implementation-patterns
    - test-implementation-backend
    - test-coverage-governance
    - code-tracing
    - efficient-batch-code-modification
    - context-mode
    - handoff-governance
    - agent-contracts
    - terminal-governance
    model: Claude Sonnet 5.5
