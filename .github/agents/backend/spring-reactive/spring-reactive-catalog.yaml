version: "1.0"
domain: "backend-spring-reactive"
description: >-
  Sub-catálogo hierárquico de agentes especializados em Spring WebFlux e Project Reactor (Reactive Sub-Router).
  Isola a topologia de especialistas assíncronos não-bloqueantes do catálogo central global,
  evitando explosão de nós no agent-router e permitindo orquestração local por domínio.

router:
  id: "spring-reactive-router"
  role: "supervisor"
  description: "Roteador central do domínio Spring Reactive — tria e despacha para os 7 especialistas reativos"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"

agents:
  spring-reactive-arch-advisor:
    id: "spring-reactive-arch-advisor"
    model: "Claude Sonnet 5"
    role: "advisory"
    domain: "Arquitetura Reativa, Spring WebFlux, Project Reactor e Dimensionamento de Netty"
    description: "Especialista analítico read-only: adequação reativa, dimensionamento de Netty event-loops, análise de gargalos em pipelines Reactor e mitigação de blocking calls."
    keywords:
      - "auditoria reativa"
      - "arquitetura webflux"
      - "reactor"
      - "event loop"
      - "netty"
      - "r2dbc"
      - "backpressure"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "context-mode/ctx_search"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_batch_execute"
    skills:
      - "spring-reactive-webflux-patterns"
      - "java-jdk-backend-governance"
      - "specialist-hybrid-advisory-implementation-patterns"
      - "agent-contracts"
      - "context-mode"

  spring-reactive-feature-developer:
    id: "spring-reactive-feature-developer"
    model: "Gemini 3.8 Flash"
    role: "implementer"
    domain: "Desenvolvimento de endpoints reativos, pipelines funcionais WebFlux, R2DBC e DTOs Records via TDD"
    description: "Desenvolvedor de features: cria RouterFunctions/Controllers reativos, pipelines não-bloqueantes com Mono/Flux, R2DBC e Records sob TDD."
    keywords:
      - "feature webflux"
      - "endpoint reativo"
      - "mono flux"
      - "r2dbc"
      - "tdd reativo"
      - "routerfunction"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_index"
    skills:
      - "spring-reactive-implementation-patterns"
      - "spring-reactive-webflux-patterns"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  spring-reactive-bug-fixer:
    id: "spring-reactive-bug-fixer"
    model: "Gemini 3.8 Flash"
    role: "fixer"
    domain: "Correções cirúrgicas de bloqueios acidentais em Event Loop, vazamentos de Subscription e falhas de fluxo reativo"
    description: "Especialista em resolução rápida de bugs reativos: detecta e remove bloqueios acidentais no Netty, corrige onErrorResume e memory leaks de buffer com diff mínimo."
    keywords:
      - "bug webflux"
      - "bloqueio event loop"
      - "blockhunt"
      - "vazamento reativo"
      - "corrigir erro reativo"
      - "fix flux"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "code-tracing"
      - "spring-reactive-implementation-patterns"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  spring-reactive-resilience-tuner:
    id: "spring-reactive-resilience-tuner"
    model: "Gemini 3.8 Flash"
    role: "performance"
    domain: "Ajuste de resiliência, backpressure, circuit breakers (Resilience4j), connection pool R2DBC e dimensionamento Netty"
    description: "Especialista em resiliência: configura backpressure com onBackpressureDrop/Buffer, Circuit Breakers, rate limiters e dimensionamento de threads Netty."
    keywords:
      - "backpressure webflux"
      - "resilience4j spring"
      - "circuit breaker reativo"
      - "performance netty"
      - "r2dbc pool"
      - "tuning reativo"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "spring-reactive-performance-patterns"
      - "performance-engineering-patterns"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  spring-reactive-unit-test-writer:
    id: "spring-reactive-unit-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes unitários de publishers assíncronos e pipelines reativos com StepVerifier e VirtualTimeScheduler"
    description: "Escreve testes unitários com StepVerifier, valida emissão ordenada de sinais onNext/onError/onComplete e manipulação de tempo virtual sem IO real."
    keywords:
      - "stepverifier"
      - "teste unitario webflux"
      - "virtualtimescheduler"
      - "testar mono flux"
      - "teste reativo"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "spring-reactive-implementation-patterns"
      - "test-implementation-backend"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  spring-reactive-integration-test-writer:
    id: "spring-reactive-integration-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes integrados não-bloqueantes com WebTestClient, Testcontainers R2DBC e streaming SSE"
    description: "Escreve testes de integração ponta a ponta com WebTestClient, valida contratos de endpoints reativos, streaming de dados e repositórios R2DBC reais."
    keywords:
      - "webtestclient"
      - "teste integracao webflux"
      - "testcontainers r2dbc"
      - "teste sse"
      - "teste streaming reativo"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "spring-reactive-implementation-patterns"
      - "test-implementation-backend"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  spring-reactive-test-fixer:
    id: "spring-reactive-test-fixer"
    model: "Gemini 3.8 Flash"
    role: "fixer"
    domain: "Diagnóstico e resolução de suítes de teste reativas quebradas por timeouts, sinais inesperados ou race conditions"
    description: "Analisa relatórios de falha de StepVerifier, corrige asserções fora de ordem, cancelamentos prematuros de subscription e timeouts em testes assíncronos."
    keywords:
      - "fix teste webflux"
      - "stepverifier timeout"
      - "falha teste reativo"
      - "corrigir teste flux"
      - "assertionerror stepverifier"
    max_iteracoes: 3
    escalonamento: "Após 3 tentativas sem sucesso, retornar ao @agent-router via ask_questions (motivo: 'loop_limite_atingido') — nunca repetir indefinidamente"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "spring-reactive-implementation-patterns"
      - "structured-intake-patterns"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"
