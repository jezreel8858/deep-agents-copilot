version: "1.0"
domain: "backend-ejb"
description: >-
  Sub-catálogo hierárquico de agentes especializados em Java Legado EJB (Backend Sub-Router).
  Isola a topologia de especialistas EJB (EJB 2.x/3.x, JTA/CMT, MDB, JPA/EntityManager, EAR/WAR/JAR)
  do catálogo central global, evitando explosão de nós no agent-router e permitindo orquestração local por domínio.

router:
  id: "ejb-router"
  role: "supervisor"
  description: "Roteador central do domínio Java Legado EJB — tria e despacha para os 7 especialistas backend"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"

agents:
  ejb-arch-advisor:
    id: "ejb-arch-advisor"
    model: "Gemini 3.8 Flash"
    role: "advisory"
    domain: "Auditorias de código, arquitetura EJB 2.x/3.x, empacotamento EAR/WAR/JAR, transações BMT/CMT e migração"
    description: "Especialista analítico read-only: arquitetura EJB 2.x/3.x, descritores de deployment XML (ejb-jar.xml, weblogic-ejb-jar.xml, jboss.xml), análise de transações CMT vs BMT, auditoria de empacotamento EAR/WAR/JAR e estratégias de modernização."
    keywords:
      - "arquitetura ejb"
      - "auditoria ejb"
      - "ejb 2.x"
      - "ejb 3.x"
      - "migracao ejb"
      - "ear war jar"
      - "cmt bmt"
      - "transacao jta"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "context-mode/ctx_search"
      - "context-mode/ctx_fetch_and_index"
    skills:
      - "java-jdk-backend-governance"
      - "specialist-hybrid-advisory-implementation-patterns"
      - "codegraph-optave-usage"
      - "agent-contracts"
      - "context-mode"

  ejb-feature-developer:
    id: "ejb-feature-developer"
    model: "Gemini 3.8 Flash"
    role: "implementer"
    domain: "Desenvolvimento de Session Beans (@Stateless, @Stateful), MDB (@MessageDriven), JPA legada/EntityManager sob TDD"
    description: "Desenvolvedor de features legadas: implementa SLSB (@Stateless), SFSB (@Stateful), MDBs (@MessageDriven) JMS, JPA legada com EntityManager e descritores XML sob TDD."
    keywords:
      - "feature ejb"
      - "stateless session bean"
      - "stateful session bean"
      - "message driven bean"
      - "mdb jms"
      - "entitymanager ejb"
      - "tdd ejb"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_index"
    skills:
      - "test-implementation-backend"
      - "agent-contracts"
      - "terminal-governance"
      - "context-mode"

  ejb-bug-fixer:
    id: "ejb-bug-fixer"
    model: "Gemini 3.8 Flash"
    role: "fixer"
    domain: "Correções cirúrgicas de TransactionRolledbackException, deadlocks JTA, ClassCastException em JNDI e exaustão de pool"
    description: "Especialista em resolução cirúrgica de bugs legados: diagnostica e resolve TransactionRolledbackException, deadlocks em transações aninhadas (REQUIRES_NEW), ClassCastException em JNDI e vazamentos de Stateful Beans com diff mínimo e teste de regressão."
    keywords:
      - "bug ejb"
      - "transactionrolledbackexception"
      - "jta deadlock"
      - "jndi classcastexception"
      - "stateful leak"
      - "fix ejb"
      - "corrigir erro ejb"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "code-tracing"
      - "test-implementation-backend"
      - "terminal-governance"
      - "context-mode"

  ejb-perf-tuner:
    id: "ejb-perf-tuner"
    model: "Gemini 3.8 Flash"
    role: "performance"
    domain: "Sizing de pool de Stateless e MDB, eliminação de transações longas, tuning de DataSource/JNDI e Garbage Collection"
    description: "Especialista em tuning e performance EJB: calibra pools de Session Beans e MDBs, elimina transações JTA de longa duração, afina DataSources JNDI, mitiga retenção no L1 cache do EntityManager e otimiza JVM/GC."
    keywords:
      - "performance ejb"
      - "pool stateless"
      - "pool mdb"
      - "transacao longa jta"
      - "datasource jndi"
      - "tuning ejb"
      - "gc pause ejb"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "performance-engineering-patterns"
      - "terminal-governance"
      - "context-mode"

  ejb-unit-test-writer:
    id: "ejb-unit-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes unitários puros para EJBs com JUnit 4/5 + Mockito sem Application Server"
    description: "Escreve testes unitários ultra-rápidos e isolados para Session Beans e MDBs como POJOs, mockando EntityManager, SessionContext e JNDI via Mockito sem overhead de container."
    keywords:
      - "unit test ejb"
      - "junit 4 ejb"
      - "junit 5 ejb"
      - "mockito ejb"
      - "teste unitario ejb"
      - "mock sessioncontext"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "test-implementation-backend"
      - "terminal-governance"
      - "context-mode"

  ejb-integration-test-writer:
    id: "ejb-integration-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes de integração com OpenEJB/TomEE Embedded, Arquillian com ShrinkWrap e Testcontainers"
    description: "Escreve testes integrados com container embutido (Apache OpenEJB/TomEE Embedded), Arquillian com pacotes ShrinkWrap (.jar/.war/.ear) e Testcontainers para banco e mensageria real."
    keywords:
      - "integration test ejb"
      - "openejb"
      - "tomee embedded"
      - "arquillian"
      - "shrinkwrap"
      - "testcontainers ejb"
      - "teste integracao ejb"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "test-implementation-backend"
      - "terminal-governance"
      - "context-mode"

  ejb-test-fixer:
    id: "ejb-test-fixer"
    model: "Gemini 3.8 Flash"
    role: "fixer"
    domain: "Diagnóstico e reparo de suítes de testes quebradas em builds legados Ant/Maven"
    description: "Analisa logs de suítes de teste de projetos legados (Ant com junit task ou Maven Surefire), corrige falhas de setup de JNDI em testes, quebras de contexto embutido e fixtures desatualizadas."
    keywords:
      - "fix teste ejb"
      - "falha teste ant"
      - "maven test ejb error"
      - "broken test ejb"
      - "openejb test failure"
      - "corrigir teste ejb"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "test-implementation-backend"
      - "structured-intake-patterns"
      - "terminal-governance"
      - "context-mode"

