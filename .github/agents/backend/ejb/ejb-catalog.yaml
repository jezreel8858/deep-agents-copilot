version: "1.0"
domain: "backend-ejb"
description: >-
  Sub-catálogo hierárquico de agentes especializados em Java Legado EJB (Backend Sub-Router).
  Isola a topologia de especialistas EJB (EJB 2.x/3.x, JTA/CMT, MDB, JPA/EntityManager, EAR/WAR/JAR)
  do catálogo central global, evitando explosão de nós no agent-router e permitindo orquestração local por domínio.

router:
  id: "ejb-router"
  role: "supervisor"
  description: "Roteador central do domínio Java Legado EJB — tria e despacha para os 7 especialistas backend"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"

agents:
  ejb-arch-advisor:
    id: "ejb-arch-advisor"
    model: "Claude Sonnet 5"
    role: "advisory"
    domain: "Arquitetura Java Legado EJB, Jakarta EE, Transações JTA e Planos de Modernização"
    description: "Especialista analítico read-only: arquitetura EJB 2.x/3.x, descritores de deployment XML (ejb-jar.xml, weblogic-ejb-jar.xml, jboss.xml), análise de transações CMT vs BMT, auditoria de empacotamento EAR/WAR/JAR e estratégias de modernização."
    keywords:
      - "arquitetura ejb"
      - "auditoria ejb"
      - "ejb 2.x"
      - "ejb 3.x"
      - "migracao ejb"
      - "ear war jar"
      - "cmt bmt"
      - "transacao jta"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "context-mode/ctx_search"
    skills:
      - "java-jdk-backend-governance"
      - "specialist-hybrid-advisory-implementation-patterns"
      - "codegraph-optave-usage"
      - "agent-contracts"
      - "context-mode"

  ejb-feature-developer:
    id: "ejb-feature-developer"
    model: "Gemini 3.8 Flash"
    role: "implementer"
    domain: "Desenvolvimento e manutenção de Session Beans (Stateless/Stateful), MDBs, interfaces remotas/locais e DTOs POJO"
    description: "Desenvolvedor de features EJB: implementa @Stateless, @Stateful, @MessageDriven (JMS), DAOs JDBC/JPA e DTOs sob TDD com JUnit 4/5 e Mockito."
    keywords:
      - "feature ejb"
      - "stateless session bean"
      - "stateful session bean"
      - "message driven bean"
      - "mdb jms"
      - "ejb local remote"
      - "tdd ejb"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_index"
    skills:
      - "java-jdk-backend-governance"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  ejb-bug-fixer:
    id: "ejb-bug-fixer"
    model: "Gemini 3.8 Flash"
    role: "fixer"
    domain: "Correções cirúrgicas de TransactionRolledbackLocalException, ConcurrentAccessTimeoutException, vazamentos de Stateful Beans e bugs de concorrência"
    description: "Especialista em resolução rápida de bugs EJB: corrige falhas transacionais CMT/BMT, deadlocks de concorrência e exceptions de serialização com diff mínimo."
    keywords:
      - "bug ejb"
      - "fix ejb"
      - "transactionrolledbacklocalexception"
      - "concurrentaccesstimeoutexception"
      - "ejbtransactionrolledbackexception"
      - "deadlock jta"
      - "corrigir erro ejb"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "code-tracing"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  ejb-perf-tuner:
    id: "ejb-perf-tuner"
    model: "Gemini 3.8 Flash"
    role: "performance"
    domain: "Otimização de pooling de Stateless Beans, timeouts transacionais JTA, isolamento de transação e migração de Stateful para Stateless"
    description: "Especialista em performance: dimensiona pools de EJBs, calibra @TransactionTimeout, elimina chamadas remotas redundantes (RMI/IIOP) e otimiza DAOs legados."
    keywords:
      - "performance ejb"
      - "pool stateless"
      - "tuning jta"
      - "transaction timeout"
      - "overhead rmi iiop"
      - "otimizacao dao legado"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "performance-engineering-patterns"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  ejb-unit-test-writer:
    id: "ejb-unit-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes unitários puros de lógica de negócio de EJBs como POJOs sem Application Server"
    description: "Escreve testes unitários sem JNDI nem contêiner: testa Session Beans desacoplados instanciando classes POJO diretamente com JUnit 4/5 e Mockito."
    keywords:
      - "teste unitario ejb"
      - "junit ejb"
      - "mockito ejb"
      - "testar session bean sem servidor"
      - "mock jndi"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "test-implementation-backend"
      - "test-coverage-governance"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  ejb-integration-test-writer:
    id: "ejb-integration-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes de integração com contêiner embarcado (OpenEJB/TomEE Embedded) ou Arquillian e Testcontainers"
    description: "Escreve testes de integração com contêiner EJB real: valida injeção @EJB/@Resource, transações CMT/JTA, filas JMS com MDBs e JPA/EntityManager."
    keywords:
      - "teste integracao ejb"
      - "openejb embedded"
      - "tomee embedded"
      - "arquillian ejb"
      - "testcontainers banco legado"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "test-implementation-backend"
      - "test-coverage-governance"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  ejb-test-fixer:
    id: "ejb-test-fixer"
    model: "Gemini 3.8 Flash"
    role: "fixer"
    domain: "Diagnóstico e resolução de suítes de teste de contêiner EJB quebradas no Maven/Ant"
    description: "Diagnostica e corrige falhas em builds legados: NamingException em lookups JNDI, incompatibilidades de InitialContext, vazamentos de memória em suites de teste."
    keywords:
      - "fix teste ejb"
      - "namingexception teste"
      - "initialcontext failed"
      - "falha teste arquillian"
      - "corrigir teste legado"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "structured-intake-patterns"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"
