version: "2.0"
domain: "backend-ejb"
description: >-
  Sub-catálogo hierárquico consolidado de agentes especializados em Java Legado EJB (Padrão Triádico 3+1).
  Isola a topologia de especialistas EJB (EJB 2.x/3.x, JTA/CMT, MDB, JPA/EntityManager, EAR/WAR/JAR)
  do catálogo central global, garantindo coesão máxima, menor latência de handoffs e alinhamento à governança canônica.

router:
  id: "ejb-router"
  role: "supervisor"
  description: "Roteador central do domínio Java Legado EJB — tria e despacha para os 3 especialistas backend (arch-advisor, developer e test-engineer)"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"

agents:
  ejb-arch-advisor:
    id: "ejb-arch-advisor"
    model: "Claude Sonnet 5.5"
    role: "advisory"
    domain: "Arquitetura Java Legado EJB, Jakarta EE, Transações JTA e Planos de Modernização"
    description: "Especialista analítico read-only: arquitetura EJB 2.x/3.x, descritores de deployment XML (ejb-jar.xml, weblogic-ejb-jar.xml, jboss.xml), análise de transações CMT vs BMT, auditoria de empacotamento EAR/WAR/JAR e estratégias de modernização."
    keywords:
      - "arquitetura ejb"
      - "auditoria ejb"
      - "ejb 2.x"
      - "ejb 3.x"
      - "jta"
      - "cmt"
      - "bmt"
      - "ear war jar"
      - "modernizacao ejb"
      - "migracao ejb"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - context-mode/ctx_search
      - context-mode/ctx_batch_execute
      - context-mode/ctx_index
    skills:
      - "java-jdk-backend-governance"
      - "documentation-writing-patterns"
      - "security-review-patterns"
      - "specialist-hybrid-advisory-implementation-patterns"
      - "context-mode"
      - "handoff-governance"
      - "agent-contracts"

  ejb-developer:
    id: "ejb-developer"
    model: "Claude Sonnet 5.5"
    role: "implementation"
    domain: "Desenvolvimento de Produção EJB, Session Beans SLSB/SFSB, MDB, JPA Legada, Resolução Cirúrgica de Bugs e Tuning de Performance"
    description: "Especialista mutativo core: constrói Stateless e Stateful Session Beans, MDBs, serviços com JPA legada/EntityManager, transações JTA/CMT, resolve bugs cirúrgicos (TransactionRolledbackException, deadlocks, JNDI) com diff mínimo e executa tuning de pool e eliminação de transações longas."
    keywords:
      - "feature ejb"
      - "session bean"
      - "slsb"
      - "sfsb"
      - "mdb"
      - "message driven bean"
      - "jpa legada"
      - "entitymanager"
      - "jta cmt"
      - "bugfix ejb"
      - "tuning ejb"
      - "pool ejb"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - get_errors
      - run_in_terminal
      - context-mode/ctx_execute
      - context-mode/ctx_search
      - context-mode/ctx_batch_execute
      - context-mode/ctx_index
      - context-mode/ctx_execute_file
    skills:
      - "java-jdk-backend-governance"
      - "performance-engineering-patterns"
      - "efficient-batch-code-modification"
      - "code-tracing"
      - "context-mode"
      - "handoff-governance"
      - "agent-contracts"
      - "terminal-governance"
      - "embedded-runtime-governance"

  ejb-test-engineer:
    id: "ejb-test-engineer"
    model: "Claude Sonnet 5.5"
    role: "quality-assurance"
    domain: "Garantia de Qualidade, Testes Unitários POJO/Mockito, Testes de Integração TomEE/OpenEJB/Arquillian e Autocorreção sob R-053"
    description: "Especialista mutativo de testes: implementa testes unitários isolados sem Application Server (EJBs como POJOs), testes de integração em containers embutidos (OpenEJB, TomEE, Arquillian ShrinkWrap, Testcontainers) e realiza diagnóstico e autocorreção de testes com retry cap R-053."
    keywords:
      - "testes ejb"
      - "teste unitario ejb"
      - "openejb"
      - "tomee"
      - "arquillian"
      - "shrinkwrap"
      - "teste integracao ejb"
      - "corrigir teste ejb"
      - "test fixer ejb"
      - "testcontainers ejb"
    tools:
      - file_search
      - grep_search
      - list_dir
      - ask_questions
      - run_subagent
      - get_errors
      - run_in_terminal
      - context-mode/ctx_execute
      - context-mode/ctx_search
      - context-mode/ctx_batch_execute
      - context-mode/ctx_index
      - context-mode/ctx_execute_file
    skills:
      - "test-implementation-backend"
      - "test-coverage-governance"
      - "code-tracing"
      - "efficient-batch-code-modification"
      - "context-mode"
      - "handoff-governance"
      - "agent-contracts"
      - "terminal-governance"
      - "embedded-runtime-governance"
