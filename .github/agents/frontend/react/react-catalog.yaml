version: "1.0"
domain: "frontend-react"
description: >-
  Sub-catálogo hierárquico de agentes especializados em React (Frontend Sub-Router).
  Isola a topologia de especialistas de frontend do catálogo central global,
  evitando explosão de nós no agent-router e permitindo orquestração local por domínio.

router:
  id: "react-router"
  role: "supervisor"
  description: "Roteador central do domínio React — tria e despacha para os 8 especialistas de frontend"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"

agents:
  react-arch-advisor:
    id: "react-arch-advisor"
    model: "Claude Sonnet 5"
    role: "advisory"
    domain: "Arquitetura React, Server/Client Components, React Compiler, Performance CWV"
    description: "Especialista analítico read-only: diagnósticos arquiteturais, CWV (INP/LCP/CLS), fronteira Server/Client Components, React Compiler e planos de upgrade/migração React."
    keywords:
      - "auditoria react"
      - "arquitetura react"
      - "core web vitals"
      - "server components"
      - "client components"
      - "react compiler"
      - "upgrade react"
      - "deprecations react"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "context-mode/ctx_search"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_execute_file"
      - "context-mode/ctx_index"
    skills:
      - "react-frontend-patterns"
      - "react-performance-patterns"
      - "specialist-hybrid-advisory-implementation-patterns"
      - "agent-contracts"
      - "context-mode"

  react-feature-developer:
    id: "react-feature-developer"
    model: "Claude Sonnet 5"
    role: "implementer"
    domain: "Desenvolvimento de features novas, componentes, hooks e gerenciamento de estado (TanStack Query + Zustand)"
    description: "Desenvolvedor de features: cria componentes, hooks customizados, TanStack Query (server state) e Zustand (client state) sob workflow TDD estrito (red-green-refactor)."
    keywords:
      - "feature react"
      - "componente react"
      - "hook customizado"
      - "tanstack query"
      - "zustand"
      - "tdd react"
      - "server component"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_index"
      - "context-mode/ctx_execute_file"
    skills:
      - "react-implementation-patterns"
      - "frontend-componentization-patterns"
      - "test-implementation-react-vitest"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  react-bug-fixer:
    id: "react-bug-fixer"
    model: "Claude Sonnet 5"
    role: "fixer"
    domain: "Correções cirúrgicas de bugs e runtime errors em produção"
    description: "Especialista em resolução rápida de bugs: corrige runtime errors, re-render storms, violações de regras de hooks e memory leaks com diff mínimo sob TDD."
    keywords:
      - "bug react"
      - "fix react"
      - "runtime error react"
      - "re-render storm"
      - "memory leak react"
      - "hooks violation"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_execute_file"
      - "context-mode/ctx_index"
    skills:
      - "code-tracing"
      - "react-implementation-patterns"
      - "test-implementation-react-vitest"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  react-ui-stylist:
    id: "react-ui-stylist"
    model: "Gemini 3.8 Flash"
    role: "stylist"
    domain: "Templates JSX, Tailwind CSS/CSS Modules, layout responsivo e acessibilidade WCAG"
    description: "Especialista de apresentação: refatora JSX semântico, aplica Tailwind CSS/CSS Modules, layout responsivo mobile-first e conformidade WCAG 2.2 AA (estritamente visual, isento de criar ou rodar testes unitários)."
    keywords:
      - "tailwind react"
      - "css react"
      - "jsx template"
      - "layout responsivo"
      - "breakpoints"
      - "a11y react"
      - "wcag"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_execute_file"
      - "context-mode/ctx_index"
    skills:
      - "react-responsive-ui-patterns"
      - "design-system-component-contracts"
      - "frontend-componentization-patterns"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  react-unit-test-writer:
    id: "react-unit-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes unitários de hooks, stores Zustand, selectors TanStack Query e utilitários com mocks isolados"
    description: "Escreve testes unitários de alta velocidade sem DOM para hooks customizados, stores Zustand e funções utilitárias com vi.fn() e spies."
    keywords:
      - "unit test react"
      - "teste unitario react"
      - "mock hook react"
      - "testar store zustand"
      - "testar tanstack query"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_execute_file"
      - "context-mode/ctx_index"
    skills:
      - "test-implementation-react-vitest"
      - "test-implementation-frontend"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  react-component-test-writer:
    id: "react-component-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes de componentes com React Testing Library, renderização e interações do usuário"
    description: "Escreve testes de componentes com renderização, queries acessíveis, eventos de usuário (userEvent) e asserções de comportamento observável."
    keywords:
      - "component test react"
      - "react testing library"
      - "userEvent"
      - "render testing library"
      - "queries acessiveis"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_execute_file"
      - "context-mode/ctx_index"
    skills:
      - "test-implementation-react-vitest"
      - "test-implementation-frontend"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  react-test-fixer:
    id: "react-test-fixer"
    model: "Claude Sonnet 5"
    role: "fixer"
    domain: "Diagnóstico e autocorreção de logs de falha de runners (Vitest, Playwright)"
    description: "Diagnostica e corrige testes quebrados por timing assíncrono, act() warnings, mocks desatualizados do TanStack Query/MSW ou queries RTL frágeis."
    keywords:
      - "fix teste react"
      - "teste falhando react"
      - "act warning"
      - "broken spec react"
      - "msw mock"
    max_iteracoes: 3
    escalonamento: "Após 3 tentativas sem sucesso, retornar ao @agent-router via ask_questions (motivo: 'loop_limite_atingido') — nunca repetir indefinidamente"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_execute_file"
      - "context-mode/ctx_index"
    skills:
      - "test-implementation-react-vitest"
      - "structured-intake-patterns"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  react-e2e-writer:
    id: "react-e2e-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes ponta a ponta (E2E) com Playwright em aplicações React"
    description: "Escreve suítes E2E de jornadas completas no browser, adotando seletores estáveis (data-testid), Page Objects e asserções web-first."
    keywords:
      - "e2e react"
      - "playwright react"
      - "teste ponta a ponta"
      - "jornada do usuario"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_execute_file"
      - "context-mode/ctx_index"
    skills:
      - "test-implementation-frontend"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"
