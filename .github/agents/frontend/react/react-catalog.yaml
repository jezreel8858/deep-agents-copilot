version: "2.0"
domain: "frontend-react"
description: >-
  Sub-catálogo hierárquico consolidado de agentes especializados em React (Padrão Triádico 3+1).
  Isola a topologia de especialistas de frontend do catálogo central global,
  garantindo coesão máxima, menor latência de handoffs e alinhamento à governança canônica.

router:
  id: "react-router"
  role: "supervisor"
  description: "Roteador central do domínio React — tria e despacha para os 3 especialistas de frontend (arch-advisor, developer e test-engineer)"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"

agents:
  react-arch-advisor:
    id: "react-arch-advisor"
    model: "Claude Sonnet 5.5"
    role: "advisory"
    domain: "Arquitetura React, Server/Client Components, React Compiler, Performance CWV"
    description: "Especialista analítico read-only: diagnósticos arquiteturais, CWV (INP/LCP/CLS), fronteira Server/Client Components, React Compiler e planos de upgrade/migração React."
    keywords:
      - "auditoria react"
      - "arquitetura react"
      - "core web vitals"
      - "server components"
      - "client components"
      - "react compiler"
      - "upgrade react"
      - "deprecations react"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_index"
    skills:
      - "react-frontend-patterns"
      - "react-performance-patterns"
      - "specialist-hybrid-advisory-implementation-patterns"
      - "agent-contracts"
      - "context-mode"

  react-developer:
    id: "react-developer"
    model: "Claude Sonnet 5.5"
    role: "implementation"
    domain: "Desenvolvimento de Telas, Componentes, Hooks, Estado, Estilização Tailwind e Correção de Bugs de UI"
    description: "Especialista mutativo core: constrói componentes acessíveis e hooks customizados, gerencia estado com TanStack Query e Zustand, aplica estilização Tailwind/CSS Modules e resolve bugs de renderização cirurgicamente sob metodologia Test-Last (isento de autoria de testes unitários)."
    keywords:
      - "feature react"
      - "componente react"
      - "hooks react"
      - "tanstack query"
      - "zustand"
      - "tailwind react"
      - "css modules"
      - "ui stylist react"
      - "layout responsivo"
      - "acessibilidade wcag"
      - "bug react"
      - "re-render"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_index"
      - "context-mode/ctx_execute_file"
      - "playwright/browser_snapshot"
      - "playwright/browser_navigate"
      - "playwright/browser_click"
      - "playwright/browser_type"
      - "playwright/browser_wait_for"
      - "playwright/browser_console_messages"
      - "playwright/browser_network_requests"
      - "playwright/browser_tabs"
      - "playwright/browser_close"
      - "playwright/browser_take_screenshot"
      - "playwright/browser_resize"
    skills:
      - "react-implementation-patterns"
      - "react-responsive-ui-patterns"
      - "design-system-component-contracts"
      - "frontend-componentization-patterns"
      - "frontend-visual-feedback-loop"
      - "efficient-batch-code-modification"
      - "context-mode"
      - "handoff-governance"
      - "agent-contracts"
      - "code-tracing"
      - "terminal-governance"
      - "playwright-mcp"

  react-test-engineer:
    id: "react-test-engineer"
    model: "Claude Sonnet 5.5"
    role: "quality-assurance"
    domain: "Garantia de Qualidade Frontend, Vitest, React Testing Library, Playwright E2E e Autocorreção"
    description: "Especialista mutativo de testes: projeta e implementa testes unitários isolados (Vitest), testes de renderização e acessibilidade de componentes (RTL), jornadas E2E (Playwright) e executa autocorreção de suítes quebradas sob CAP RÍGIDO (R-053)."
    keywords:
      - "testes react"
      - "vitest react"
      - "react testing library"
      - "rtl"
      - "playwright react"
      - "teste e2e react"
      - "corrigir teste react"
      - "test fixer react"
    tools:
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_index"
      - "context-mode/ctx_execute_file"
      - "playwright/browser_snapshot"
      - "playwright/browser_navigate"
      - "playwright/browser_navigate_back"
      - "playwright/browser_click"
      - "playwright/browser_type"
      - "playwright/browser_hover"
      - "playwright/browser_select_option"
      - "playwright/browser_press_key"
      - "playwright/browser_fill_form"
      - "playwright/browser_file_upload"
      - "playwright/browser_handle_dialog"
      - "playwright/browser_wait_for"
      - "playwright/browser_tabs"
      - "playwright/browser_close"
      - "playwright/browser_console_messages"
      - "playwright/browser_network_requests"
      - "playwright/browser_take_screenshot"
      - "playwright/browser_resize"
    skills:
      - "test-implementation-react-vitest"
      - "test-implementation-frontend"
      - "test-coverage-governance"
      - "code-tracing"
      - "frontend-visual-feedback-loop"
      - "efficient-batch-code-modification"
      - "context-mode"
      - "handoff-governance"
      - "agent-contracts"
      - "terminal-governance"
      - "playwright-mcp"
