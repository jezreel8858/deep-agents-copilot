version: '2.0'
domain: frontend-angular
description: Sub-catálogo hierárquico consolidado de agentes especializados em Angular
  (Padrão Triádico 3+1). Isola a topologia de especialistas de frontend do catálogo
  central global, garantindo coesão máxima, menor latência de handoffs e alinhamento
  à governança Test-Last.
agents:
  angular-arch-advisor:
    id: angular-arch-advisor
    role: architecture
    description: Read-only advisor para arquitetura frontend Angular, design de Signals/RxJS,
      SSR/Hydration e governança corporativa.
    keywords:
    - arquitetura angular
    - standalone components
    - signals
    - rxjs store
    - ssr hydration
    tools:
    - read_file
    - file_search
    - grep_search
    - list_dir
    - ask_questions
    - context-mode/ctx_search
    - context-mode/ctx_execute_file
    skills:
    - angular-frontend-patterns
    - architecture-decision-records
    - context-mode
    - handoff-governance
    - agent-contracts
    - frontend-visual-feedback-loop
    - playwright-mcp
    model: Claude Sonnet 5.5
  angular-developer:
    id: angular-developer
    role: implementation
    test_paradigm: Test-Last / Implementation-First
    unit_test_exemption: isento de autoria e execução de testes unitários; handoff
      mandatório para angular-test-engineer
    description: 'Especialista consolidador de engenharia de frontend Angular: implementação
      de features standalone, gerenciamento de estado (Signals/RxJS), estilização
      com Design System (Tailwind/SCSS, zero hex inline) e correção cirúrgica de bugs
      de renderização/UI.'
    keywords:
    - feature angular
    - componente standalone
    - signals
    - rxjs stream
    - formulário reativo
    - bugfix angular
    - expressionchanged
    - estilização angular
    - design system angular
    - validação visual layout
    - visual feedback loop
    tools:
    - file_search
    - grep_search
    - list_dir
    - ask_questions
    - run_subagent
    - get_errors
    - run_in_terminal
    - context-mode/ctx_execute
    - context-mode/ctx_search
    - context-mode/ctx_batch_execute
    - context-mode/ctx_index
    - context-mode/ctx_execute_file
    - playwright/browser_snapshot
    - playwright/browser_navigate
    - playwright/browser_click
    - playwright/browser_type
    - playwright/browser_fill_form
    - playwright/browser_press_key
    - playwright/browser_wait_for
    - playwright/browser_console_messages
    - playwright/browser_network_requests
    - playwright/browser_tabs
    - playwright/browser_close
    - playwright/browser_take_screenshot
    - playwright/browser_resize
    skills:
    - angular-frontend-patterns
    - angular-implementation-patterns
    - design-system-component-contracts
    - frontend-componentization-patterns
    - frontend-visual-feedback-loop
    - efficient-batch-code-modification
    - context-mode
    - handoff-governance
    - agent-contracts
    - code-tracing
    - terminal-governance
    - playwright-mcp
    model: Claude Sonnet 5.5
  angular-test-engineer:
    id: angular-test-engineer
    role: testing
    description: 'Especialista consolidador de testes e qualidade para Angular: testes
      unitários (Jasmine/Jest/Vitest), testes de componentes/TestBed, automação E2E
      (Playwright/Cypress) e autocorreção de suítes com retry cap estrito (R-053).'
    keywords:
    - teste unitario angular
    - testbed
    - spectator
    - teste componente angular
    - teste e2e angular
    - playwright angular
    - cypress angular
    - corrigir teste angular
    - test fixer angular
    - e2e autenticado storage state
    tools:
    - file_search
    - grep_search
    - list_dir
    - ask_questions
    - run_subagent
    - get_errors
    - run_in_terminal
    - context-mode/ctx_execute
    - context-mode/ctx_search
    - context-mode/ctx_batch_execute
    - context-mode/ctx_index
    - context-mode/ctx_execute_file
    - playwright/browser_snapshot
    - playwright/browser_navigate
    - playwright/browser_navigate_back
    - playwright/browser_click
    - playwright/browser_type
    - playwright/browser_hover
    - playwright/browser_select_option
    - playwright/browser_press_key
    - playwright/browser_fill_form
    - playwright/browser_file_upload
    - playwright/browser_handle_dialog
    - playwright/browser_wait_for
    - playwright/browser_tabs
    - playwright/browser_close
    - playwright/browser_console_messages
    - playwright/browser_network_requests
    - playwright/browser_take_screenshot
    - playwright/browser_resize
    skills:
    - test-implementation-frontend
    - test-coverage-governance
    - code-tracing
    - frontend-visual-feedback-loop
    - efficient-batch-code-modification
    - context-mode
    - handoff-governance
    - agent-contracts
    - terminal-governance
    - playwright-mcp
    model: Claude Sonnet 5.5
