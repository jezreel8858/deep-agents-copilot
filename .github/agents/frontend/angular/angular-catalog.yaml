version: "1.0"
domain: "frontend-angular"
description: >-
  Sub-catálogo hierárquico de agentes especializados em Angular (Frontend Sub-Router).
  Isola a topologia de especialistas de frontend do catálogo central global,
  evitando explosão de nós no agent-router e permitindo orquestração local por domínio.

router:
  id: "angular-router"
  role: "supervisor"
  description: "Roteador central do domínio Angular — tria e despacha para os 8 especialistas de frontend"
  tools:
    - "read_file"
    - "file_search"
    - "grep_search"
    - "list_dir"
    - "ask_questions"
    - "run_subagent"
    - "context-mode/ctx_search"
  skills:
    - "agent-contracts"
    - "handoff-governance"
    - "context-mode"

agents:
  angular-arch-advisor:
    id: "angular-arch-advisor"
    model: "Claude Sonnet 5"
    role: "advisory"
    domain: "Arquitetura Angular, Standalone, Signals, SSR e Performance CWV"
    description: "Especialista analítico read-only: diagnósticos arquiteturais, CWV (INP/LCP), SSR/hydration, @defer e planos de upgrade/migração Angular."
    keywords:
      - "auditoria angular"
      - "arquitetura angular"
      - "core web vitals"
      - "inp"
      - "lcp"
      - "ssr"
      - "hydration"
      - "upgrade angular"
      - "deprecations"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "context-mode/ctx_search"
    skills:
      - "angular-frontend-patterns"
      - "angular-performance-patterns"
      - "specialist-hybrid-advisory-implementation-patterns"
      - "agent-contracts"
      - "context-mode"

  angular-feature-developer:
    id: "angular-feature-developer"
    model: "Gemini 3.8 Flash"
    role: "implementer"
    domain: "Desenvolvimento de features novas, componentes standalone e gerenciamento de estado reativo"
    description: "Desenvolvedor de features: cria componentes standalone, NgRx Signal Stores, services e diretivas sob workflow Test-Last (Implementation-First com testes posteriores)."
    keywords:
      - "feature angular"
      - "componente standalone"
      - "signal store"
      - "signals"
      - "service angular"
      - "test-last angular"
      - "implementation-first"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
      - "context-mode/ctx_index"
    skills:
      - "angular-implementation-patterns"
      - "frontend-componentization-patterns"
      - "test-implementation-angular-vitest"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  angular-bug-fixer:
    id: "angular-bug-fixer"
    model: "Gemini 3.8 Flash"
    role: "fixer"
    domain: "Correções cirúrgicas de bugs e runtime errors em produção"
    description: "Especialista em resolução rápida de bugs: corrige runtime errors, ExpressionChanged..., memory leaks e falhas de reatividade com diff mínimo."
    keywords:
      - "bug angular"
      - "fix angular"
      - "runtime error angular"
      - "expressionchanged"
      - "memory leak angular"
      - "corrigir erro angular"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "code-tracing"
      - "angular-implementation-patterns"
      - "test-implementation-angular-vitest"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  angular-ui-stylist:
    id: "angular-ui-stylist"
    model: "Gemini 3.8 Flash"
    role: "stylist"
    domain: "Templates HTML5, SCSS modular, layout responsivo e acessibilidade WCAG"
    description: "Especialista de apresentação: refatora templates com Control Flow (@if/@for), implementa SCSS modular (:host), layout responsivo mobile-first e conformidade WCAG 2.2 AA (estritamente visual, isento de criar ou rodar testes unitários)."
    keywords:
      - "scss angular"
      - "css angular"
      - "template angular"
      - "control flow"
      - "layout responsivo"
      - "breakpoints"
      - "a11y angular"
      - "wcag"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "angular-responsive-ui-patterns"
      - "design-system-component-contracts"
      - "frontend-componentization-patterns"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  angular-unit-test-writer:
    id: "angular-unit-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes unitários de regras de negócio, services, stores e signals com mocks isolados"
    description: "Escreve testes unitários de alta velocidade sem DOM para services, pipes, utilitários e NgRx Signal Stores com vi.fn() e spies."
    keywords:
      - "unit test angular"
      - "teste unitario angular"
      - "mock service angular"
      - "testar store"
      - "testar signal"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "test-implementation-angular-vitest"
      - "test-implementation-frontend"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  angular-component-test-writer:
    id: "angular-component-test-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes de componentes com TestBed, ComponentFixture e CDK Component Harnesses"
    description: "Escreve testes de componentes com renderização, bindings de template, eventos de usuário e desacoplamento via Component Harnesses."
    keywords:
      - "component test angular"
      - "testbed"
      - "fixture detectchanges"
      - "component harness"
      - "testbedharnessenvironment"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "test-implementation-angular-vitest"
      - "test-implementation-angular-jasmine"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  angular-test-fixer:
    id: "angular-test-fixer"
    model: "Gemini 3.8 Flash"
    role: "fixer"
    domain: "Diagnóstico e autocorreção de logs de falha de runners (Vitest, Karma, Jest)"
    description: "Diagnostica e corrige testes quebrados por timing assíncrono, zoneless, flushEffects(), erros de mocks desatualizados ou dependências de TestBed."
    keywords:
      - "fix teste angular"
      - "teste falhando angular"
      - "whenstable"
      - "flusheffects"
      - "broken spec angular"
    max_iteracoes: 3
    escalonamento: "Após 3 tentativas sem sucesso, retornar ao @agent-router via ask_questions (motivo: 'loop_limite_atingido') — nunca repetir indefinidamente"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "test-implementation-angular-vitest"
      - "structured-intake-patterns"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"

  angular-e2e-writer:
    id: "angular-e2e-writer"
    model: "Gemini 3.8 Flash"
    role: "tester"
    domain: "Testes ponta a ponta (E2E) com Playwright e Cypress em aplicações Angular"
    description: "Escreve suítes E2E de jornadas completas no browser, adotando seletores estáveis (data-testid), Page Objects e asserções web-first."
    keywords:
      - "e2e angular"
      - "playwright angular"
      - "cypress angular"
      - "teste ponta a ponta"
      - "jornada do usuario"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "list_dir"
      - "ask_questions"
      - "run_subagent"
      - "create_file"
      - "insert_edit_into_file"
      - "get_errors"
      - "run_in_terminal"
      - "context-mode/ctx_execute"
      - "context-mode/ctx_search"
      - "context-mode/ctx_batch_execute"
    skills:
      - "test-implementation-angular-vitest"
      - "test-implementation-frontend"
      - "terminal-governance"
      - "context-mode"
      - "efficient-batch-code-modification"
