version: "1.0"
description: >
  Suíte de casos de teste para validação contínua do agent-router.
  Fonte de verdade para regressão de roteamento — deve ser atualizada
  em toda PR que altere agent-router.agent.md ou routing-graph.yaml (análogo ao R-015).
  Compatível com DeepEval (Apache 2.0) e pytest via estrutura de casos padronizados.
last_updated: "2026-09-17 (v11 - adicionado regr-028: checkpoint humano nao satisfeito por continuacao generica + proibicao de fallback manual pos-falha do code-knowledge-graph + re-banner obrigatorio na transicao para execucao; ver R-053 em CLAUDE.md)"
responsavel: "agent-evals-lab + docs-engineer + test-strategy"

# ─────────────────────────────────────────────
# SUITE 1 — Casos Canônicos (threshold ≥ 0.90)
# Intenção clara + resposta bem definida. Devem passar sempre.
# ─────────────────────────────────────────────
canonicos:
  - id: "canon-001"
    descricao: "Bug em produção com stack trace"
    input:
      solicitacao: "Há um bug em produção no endpoint /checkout — NullPointerException em OrderService"
      contexto_disponivel: "stack trace presente"
    expected:
      agent_route: "bug-triage"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Rota: bug_fix"
        - "Delegado: @bug-triage"
    critico: true
    threshold: 0.90

  - id: "canon-002"
    descricao: "Estratégia de testes explicitamente solicitada"
    input:
      solicitacao: "Planejar estratégia de testes para o módulo de pagamentos — cobertura e cenários de risco"
    expected:
      agent_route: "test-strategy"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @test-strategy"
    critico: true
    threshold: 0.90

  - id: "canon-003"
    descricao: "Implementação de testes com stack definida (Spring Boot JUnit 5 + Mockito -> spring-boot-router)"
    input:
      solicitacao: "Implementar testes unitários para UserService com JUnit 5 + Mockito"
    expected:
      agent_route: "spring-boot-router"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @spring-boot-router"
    critico: true
    threshold: 0.90

  - id: "canon-004"
    descricao: "Testes quebrados com relatório em Spring Boot (spring-boot-router -> test-fixer)"
    input:
      solicitacao: "Estes 3 testes estão falhando: UserServiceTest, OrderTest, PaymentTest — veja o relatório anexo"
      contexto_disponivel: "relatório de falhas presente"
    expected:
      agent_route: "spring-boot-router"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @spring-boot-router"
