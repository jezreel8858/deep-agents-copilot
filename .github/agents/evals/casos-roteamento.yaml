  - id: "canon-039"
    descricao: "Auditoria semântica e estrutural do catálogo de governança roteada para agent-auditor"
    input:
      solicitacao: "Auditar a governança do repositório procurando smells, referências quebradas e gaps no grafo de roteamento"
    expected:
      agent_route: "agent-auditor"
      nivel_routing: "rule-based"
