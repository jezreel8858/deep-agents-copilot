version: "1.0"
description: >
  Suíte de casos de teste para validação contínua do agent-router.
  Fonte de verdade para regressão de roteamento — deve ser atualizada
  em toda PR que altere agent-router.agent.md ou routing-graph.yaml (análogo ao R-015).
  Compatível com DeepEval (Apache 2.0) e pytest via estrutura de casos padronizados.
last_updated: "2026-09-04 (v9 — adicionado canon-030 e regr-023: delegação interna mandatória refactor-planner → code-knowledge-graph para mapeamento de dependências/blast radius R-045)"
responsavel: "agent-evals-lab + docs-engineer + test-strategy"

# ─────────────────────────────────────────────
# SUITE 1 — Casos Canônicos (threshold ≥ 0.90)
# Intenção clara + resposta bem definida. Devem passar sempre.
# ─────────────────────────────────────────────
canonicos:
  - id: "canon-001"
    descricao: "Bug em produção com stack trace"
    input:
      solicitacao: "Há um bug em produção no endpoint /checkout — NullPointerException em OrderService"
      contexto_disponivel: "stack trace presente"
    expected:
      agent_route: "bug-triage"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Rota: bug_fix"
        - "Delegado: @bug-triage"
    critico: true
    threshold: 0.90

  - id: "canon-002"
    descricao: "Estratégia de testes explicitamente solicitada"
    input:
      solicitacao: "Planejar estratégia de testes para o módulo de pagamentos — cobertura e cenários de risco"
    expected:
      agent_route: "test-strategy"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @test-strategy"
    critico: true
    threshold: 0.90

  - id: "canon-003"
    descricao: "Implementação de testes com stack definida (Spring Boot JUnit 5 + Mockito -> spring-boot-router)"
    input:
      solicitacao: "Implementar testes unitários para UserService com JUnit 5 + Mockito"
    expected:
      agent_route: "spring-boot-router"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @spring-boot-router"
    critico: true
    threshold: 0.90

  - id: "canon-004"
    descricao: "Testes quebrados com relatório em Spring Boot (spring-boot-router -> test-fixer)"
    input:
      solicitacao: "Estes 3 testes estão falhando: UserServiceTest, OrderTest, PaymentTest — veja o relatório anexo"
      contexto_disponivel: "relatório de falhas presente"
    expected:
      agent_route: "spring-boot-router"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @spring-boot-router"
    critico: true
    threshold: 0.90

  - id: "canon-005"
    descricao: "Planejamento de refatoração"
    input:
      solicitacao: "Refatorar para remover código duplicado em RelatorioService — garantir rollback seguro"
    expected:
      agent_route: "refactor-planner"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
    critico: true
    threshold: 0.90

  - id: "canon-006"
    descricao: "Análise de impacto e solução técnica de mudança de assinatura"
    input:
      solicitacao: "Analisar o impacto de mudar a assinatura do método processarPagamento() em PaymentService"
    expected:
      agent_route: "tech-solution-architect"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @tech-solution-architect"
    critico: true
    threshold: 0.90

  - id: "canon-007"
    descricao: "Curadoria de documentação de governança (docs-engineer, mode curate)"
    input:
      solicitacao: "Atualizar o README.md do catálogo de agents após criar o novo agent de análise"
    expected:
      agent_route: "docs-engineer"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Modo: curate"
    critico: true
    threshold: 0.90

  - id: "canon-008"
    descricao: "Criação de novo agent (governance-factory, type agent)"
    input:
      solicitacao: "Criar um novo agent customizado para auditoria de conformidade LGPD"
    expected:
      agent_route: "governance-factory"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Tipo de artefato: agent"
        - "Pesquisa prévia via @deep-search"
    critico: true
    threshold: 0.90

  - id: "canon-009"
    descricao: "Extração de regras de negócio"
    input:
      solicitacao: "Extrair regras de negócio do módulo de faturamento para documentar como ground truth"
    expected:
      agent_route: "business-rules-extractor"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
    critico: true
    threshold: 0.90

  - id: "canon-010"
    descricao: "Health check de binding obrigatório"
    input:
      solicitacao: "Qualquer solicitação — sem catalog.yaml e binding.md no repositório"
      contexto_simulado: "docs/ai-context/catalog.yaml ausente"
    expected:
      agent_route: "binding-initializer"
      nivel_routing: "rule-based"
      prioridade_zero: true
      confianca: "alta"
    critico: true
    threshold: 1.00

  - id: "canon-011"
    descricao: "Prompt structuring mandatório (R-041) — toda solicitação passa por ele antes da classificação"
    input:
      solicitacao: "Implementar testes unitários para UserService"
      contexto_disponivel: "binding context presente, solicitação ainda não refinada"
    expected:
      agent_route: "prompt-structuring"
      nivel_routing: "rule-based"
      prioridade: 0.5
      confianca: "alta"
      output_contains:
        - "Delegado: @prompt-structuring"
    critico: true
    threshold: 1.00

  - id: "canon-012"
    descricao: "Escrita de documentação técnica nova (docs-engineer, mode author)"
    input:
      solicitacao: "Preciso de um README novo para o módulo de pagamentos, seguindo estrutura padrão"
    expected:
      agent_route: "docs-engineer"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Modo: author"
    critico: true
    threshold: 0.90

  - id: "canon-013"
    descricao: "Revisão de código antes do merge (perfil code-review)"
    input:
      solicitacao: "Pode revisar o diff da branch feat/checkout antes de eu abrir o PR?"
    expected:
      agent_route: "code-review"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @code-review"
    critico: true
    threshold: 0.90

  - id: "canon-014"
    descricao: "Elicitação de requisito a partir de pedido de negócio ambíguo (perfil requirements-analyst)"
    input:
      solicitacao: "Precisamos de uma funcionalidade de notificação para os usuários — ainda não sei bem os detalhes"
    expected:
      agent_route: "requirements-analyst"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @requirements-analyst"
    critico: true
    threshold: 0.90

  - id: "canon-015"
    descricao: "Sumarização de código-fonte agnóstica a linguagem (perfil code-summarizer, RF-008)"
    input:
      solicitacao: "Sumarize este arquivo de código-fonte para reduzir o volume levado ao contexto do chat"
    expected:
      agent_route: "code-summarizer"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @code-summarizer"
    critico: true
    threshold: 0.90
    nao_confundir_com:
      - "revisar/corrigir código"   # → code-review/bug-triage/refactor-planner
      - "extrair regra de negócio"  # → business-rules-extractor

  - id: "canon-019"
    descricao: "Delegação interna downstream → code-summarizer (RF-002): agent especialista de stack detecta arquivo > 300 linhas/20KB e delega via run_subagent, valida aresta *downstream → code-summarizer de routing-graph.yaml"
    input:
      agent_solicitante: "spring-boot-router"
      solicitacao_simulada: "spring-boot-feature-developer está lendo PedidoService.java (412 linhas, 24KB) para responder a uma tarefa e identifica que excede o threshold RF-002 antes de anexar o conteúdo ao contexto"
    expected:
      agent_route: "code-summarizer"
      via: "run_subagent"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @code-summarizer"
    nao_deve:
      comportamento: "spring-boot ler o arquivo inteiro diretamente para o contexto sem delegar (viola RF-002/RNF-002)"
    critico: true
    threshold: 0.90

  - id: "canon-020"
    descricao: "Revisão especializada de segurança (OWASP/CVE)"
    input:
      solicitacao: "Revisar este endpoint por segurança — quero saber se há risco de SQL injection ou vulnerabilidade OWASP"
    expected:
      agent_route: "security-reviewer"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @security-reviewer"
    nao_confundir_com:
      - "revisão geral de código"  # → code-review
    critico: true
    threshold: 0.90

  - id: "canon-021"
    descricao: "Revisão especializada de performance (Core Web Vitals)"
    input:
      solicitacao: "Avaliar se esta página tem problema de Core Web Vitals — LCP parece alto"
    expected:
      agent_route: "performance-agent"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @performance-agent"
    critico: true
    threshold: 0.90

  - id: "canon-022"
    descricao: "Avaliação de compliance/GDPR"
    input:
      solicitacao: "Avaliar se este fluxo de dado pessoal está conforme GDPR/LGPD — existe audit trail?"
    expected:
      agent_route: "compliance-guardrails"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @compliance-guardrails"
    nao_confundir_com:
      - "segurança do próprio agent de IA"  # → agent-safety-guardrails (skill)
    critico: true
    threshold: 0.90

  - id: "canon-023"
    descricao: "Decomposição de feature nova em subtasks"
    input:
      solicitacao: "Preciso decompor esta feature nova de checkout em subtarefas para o time executar"
    expected:
      agent_route: "feature-planner"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @feature-planner"
    nao_confundir_com:
      - "refatoração de código existente"  # → refactor-planner
    critico: true
    threshold: 0.90

  - id: "canon-024"
    descricao: "Revisão de artefato DevOps (Dockerfile)"
    input:
      solicitacao: "Revisar este Dockerfile antes do merge — está seguindo boas práticas?"
    expected:
      agent_route: "devops-engineer"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @devops-engineer"
    critico: true
    threshold: 0.90

  - id: "canon-025"
    descricao: "Investigação de causa raiz com stack trace complexo"
    input:
      solicitacao: "Preciso investigar a causa raiz deste erro — o stack trace atravessa 4 serviços e não é óbvio onde está o problema"
    expected:
      agent_route: "debugger"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.85
      output_contains:
        - "Delegado: @debugger"
    nao_confundir_com:
      - "bug simples/classificação inicial"  # → bug-triage
    critico: true
    threshold: 0.85

  - id: "canon-026"
    descricao: "Execução de plano de refactor aprovado para módulo Spring Boot — delega ao especialista de stack"
    input:
      solicitacao: "O plano de refactor do módulo Spring Boot de pagamentos já foi aprovado — pode executar a Fase 1 agora"
    expected:
      agent_route: "spring-boot-router"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @spring-boot-router"
    nao_confundir_com:
      - "criar plano de refactor do zero"  # → refactor-planner
    critico: true
    threshold: 0.90

  - id: "canon-027"
    descricao: "Verificação de estilo/convenção documentada"
    input:
      solicitacao: "Verificar se este arquivo segue as convenções de nomenclatura do adapter Spring Boot do projeto"
    expected:
      agent_route: "code-style-enforcer"
      nivel_routing: "rule-based"
      confianca: "média"
      score_minimo: 0.85
      output_contains:
        - "Delegado: @code-style-enforcer"
    critico: false
    threshold: 0.85

  - id: "canon-028"
    descricao: "Mapeamento estrutural de arquitetura, camadas e fluxo de dados (code-knowledge-graph direto)"
    input:
      solicitacao: "Como este projeto está estruturado em termos de camadas e fluxo de dados? Existe separação clara entre a gestão de estado e a persistência?"
    expected:
      agent_route: "code-knowledge-graph"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @code-knowledge-graph"
    nao_confundir_com:
      - "recomendação específica de framework sem grafo"  # → angular-engineer / spring-boot-engineer
    critico: true
    threshold: 0.90

  - id: "canon-029"
    descricao: "Delegação interna downstream governance-factory → deep-search: pesquisa prévia obrigatória de diretrizes e skills antes de criar artefato"
    input:
      agent_solicitante: "governance-factory"
      solicitacao_simulada: "governance-factory recebe solicitação para criar o agent compliance-auditor e aciona deep-search via run_subagent para pesquisar diretrizes e skills recomendadas antes de materializar o arquivo"
    expected:
      agent_route: "deep-search"
      via: "run_subagent"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Agente Ativo: deep-search"
    nao_deve:
      comportamento: "governance-factory gerar o arquivo diretamente sem consultar o deep-search"
    critico: true
    threshold: 0.90

  - id: "canon-030"
    descricao: "Delegação interna downstream refactor-planner → code-knowledge-graph: mapeamento de dependências e blast radius antes de estruturar plano de refatoração (R-045)"
    input:
      agent_solicitante: "refactor-planner"
      solicitacao_simulada: "refactor-planner recebe pedido para refatorar PedidoService e precisa mapear os métodos públicos, dependentes e blast radius antes de decompor o DAG"
    expected:
      agent_route: "code-knowledge-graph"
      via: "run_subagent"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Agente Ativo: code-knowledge-graph"
    nao_deve:
      comportamento: "refactor-planner varrer arquivos manualmente com grep/find/list_dir ou inferir relações sem consultar o grafo (viola R-045 / RNF-004)"
    critico: true
    threshold: 0.90

  - id: "canon-031"
    descricao: "Testes especializados de componentes Angular com TestBed e Component Harnesses roteados para angular-router"
    input:
      solicitacao: "Implementar testes de componente Angular usando TestBed e Component Harnesses para o EscalaListComponent"
    expected:
      agent_route: "angular-router"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.85
      output_contains:
        - "Agente Ativo: angular-router"
        - "angular-component-test-writer"
    critico: true
    threshold: 0.90

  - id: "canon-032"
    descricao: "Auditoria arquitetural e otimização de Core Web Vitals Angular roteada para angular-router (arch-advisor)"
    input:
      solicitacao: "Fazer auditoria de performance e diagnóstico de INP/LCP nas rotas Angular sem alterar código"
    expected:
      agent_route: "angular-router"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.85
      output_contains:
        - "Agente Ativo: angular-router"
        - "angular-arch-advisor"
    critico: true
    threshold: 0.90

  - id: "canon-033"
    descricao: "Estilização SCSS, layout responsivo mobile-first e acessibilidade WCAG roteados para angular-router (ui-stylist)"
    input:
      solicitacao: "Ajustar SCSS e acessibilidade WCAG 2.2 no componente de navegação para telas mobile"
    expected:
      agent_route: "angular-router"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.85
      output_contains:
        - "Agente Ativo: angular-router"
        - "angular-ui-stylist"
    critico: true
    threshold: 0.90

  - id: "canon-034"
    descricao: "Implementação de nova feature standalone com NgRx Signal Store via TDD roteada para angular-router (feature-developer)"
    input:
      solicitacao: "Criar componente standalone de filtro com NgRx Signal Store e testes unitários prévios"
    expected:
      agent_route: "angular-router"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.85
      output_contains:
        - "Agente Ativo: angular-router"
        - "angular-feature-developer"
    critico: true
    threshold: 0.90

  - id: "canon-035"
    descricao: "Correção cirúrgica de runtime error Angular com diff mínimo roteada para angular-router (bug-fixer)"
    input:
      solicitacao: "Corrigir ExpressionChangedAfterItHasBeenCheckedError na linha 42 do EscalaDetailComponent"
    expected:
      agent_route: "angular-router"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.85
      output_contains:
        - "Agente Ativo: angular-router"
        - "angular-bug-fixer"
    critico: true
    threshold: 0.90

  - id: "canon-036"
    descricao: "Elaboração de Technical Blueprint com contratos de API e divisão de tarefas por stack"
    input:
      solicitacao: "Elaborar o Technical Blueprint para a nova feature de gestão de escalas, com contratos OpenAPI e divisão de tarefas backend e frontend"
    expected:
      agent_route: "tech-solution-architect"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @tech-solution-architect"
    critico: true
    threshold: 0.90

  - id: "canon-037"
    descricao: "Manutenção atômica e sincronização em lote de governança roteada para governance-maintainer"
    input:
      solicitacao: "Preciso atualizar e sincronizar em lote as referências de governança e catálogos após uma alteração estrutural"
    expected:
      agent_route: "governance-maintainer"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.90
      output_contains:
        - "Delegado: @governance-maintainer"
    nao_confundir_com:
      - "criar novo agent do zero"  # → governance-factory
      - "auditar smells sem alterar" # → agent-auditor
    critico: true
    threshold: 0.90

  - id: "canon-038"
    descricao: "Roteamento de demanda de banco de dados Oracle ou Informix para database-router"
    input:
      solicitacao: "Preciso criar uma migration Flyway DDL para Oracle e uma Stored Procedure em PL/SQL com bulk collect"
    expected:
      agent_route: "database-router"
      nivel_routing: "rule-based"
      confianca: "alta"
      score_minimo: 0.85
