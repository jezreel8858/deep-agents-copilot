      - "criar novo agent do zero"           # → governance-factory
    critico: true
    threshold: 0.90

# ─────────────────────────────────────────────
# SUITE 2 — Casos Ambíguos (threshold ≥ 0.70)
# Intenção ambígua que exige clarificação ou roteamento defensivo.
# ─────────────────────────────────────────────
ambiguos:

  - id: "ambig-006"
    descricao: "Ambiguidade entre security-reviewer e agent-safety-guardrails (skill, não agent) — pedido menciona 'segurança do agent' de forma vaga"
    input:
      solicitacao: "Quero garantir que está seguro"
    expected:
      agent_route: "SEM_SPAWN"
      acao: "ask_questions"
      pergunta_esperada: "Segurança de qual escopo: da aplicação sendo desenvolvida (código/dependências) ou do comportamento do próprio agent de IA (prompt injection/blast radius)?"
      score_minimo: 0.70
    critico: false
    threshold: 0.70

  - id: "ambig-001"
    descricao: "Solicitação muito vaga sem escopo"
    input:
      solicitacao: "Melhore o código"
    expected:
      comportamento: "ask_questions"
      nao_deve_rotear_para: "qualquer agent sem clarificação"
      confianca: "crítica"
      score_maximo: 0.49
    critico: false
    threshold: 0.70

  - id: "ambig-002"
    descricao: "Duas intenções simultâneas"
    input:
      solicitacao: "Teste e refatore o serviço de pagamentos"
    expected:
      comportamento: "ask_questions com split de intenções"
      opcoes_esperadas:
        - "Testes primeiro → @test-strategy"
        - "Refatoração primeiro → @refactor-planner"
        - "Ambos em sequência → plano dividido"
      confianca: "baixa"
      score_esperado_range: [0.50, 0.69]
    critico: false
    threshold: 0.70

  - id: "ambig-003"
    descricao: "Pedido de revisão genérico sem contexto de arquivo"
    input:
      solicitacao: "Revise o serviço de usuários"
    expected:
      comportamento: "ask_questions"
      perguntas_minimas:
        - "Qual o tipo de revisão? (código, testes, documentação, impacto)"
        - "Qual arquivo/classe?"
      confianca: "baixa"
    critico: false
    threshold: 0.70

  - id: "ambig-004"
    descricao: "Testes quebrados sem relatório — não deve assumir"
    input:
      solicitacao: "Corrigir os testes do módulo de relatórios"
