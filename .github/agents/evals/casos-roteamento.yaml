    expected:
      comportamento: "ask_questions para obter relatório de falhas"
      nao_deve: "rotear para test-engineer (mode fix) sem o relatório"
    critico: false
    threshold: 0.70

  - id: "ambig-005"
    descricao: "Duas intenções simultâneas envolvendo sumarização (RF-008 §4 da estratégia): 'sumarize e corrija' não deve rotear direto para code-summarizer nem bug-triage sem clarificação"
    input:
      solicitacao: "Sumarize e corrija este arquivo"
    expected:
      comportamento: "ask_questions com split de intenções"
      opcoes_esperadas:
        - "Sumarizar primeiro → @code-summarizer"
        - "Corrigir primeiro → @bug-triage (requer relatório/causa raiz)"
        - "Ambos em sequência → plano dividido (sumarizar para reduzir contexto, depois corrigir)"
      confianca: "baixa"
      score_esperado_range: [0.50, 0.69]
    nao_deve:
      agent_route: "code-summarizer|bug-triage (roteamento direto sem clarificação)"
    critico: false
    threshold: 0.70

