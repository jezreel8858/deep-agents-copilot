  changelog: "2026-09-06 (45) — Sincronização atômica SSOT entre .github/prompts/commit.prompt.md (v1.2 -> v1.3) e .github/agents/pr-gatekeeper.agent.md (v1.0.0 -> v1.1.0): unificado o padrão de mensagem de commit semântico. pr-gatekeeper herda formalmente a SSOT do /commit (guardrail de segredos bloqueante, teste de atomicidade, classificação de 11 tipos + exclusões, Formato A para 1-5 arquivos e Formato B para 6+ arquivos agrupados funcionalmente, bloco executável manual git commit -F - << 'EOF' e trailers padronizados), mantendo seu escopo exclusivo intacto (descrição de PR, matriz de risco e CHANGELOG.md). Atualizados atomicamente pr-gatekeeper.agent.md, commit.prompt.md, catalog.yaml e .github/agents/README.md. Zero template antigo de 1 linha remanescente. Validado via get_errors e parser YAML — 0 erros. | 2026-09-06 (44) — Sincronização em cascata R-046: formalizada a regra normativa R-046 no CLAUDE.md estabelecendo a prioridade e injeção compulsória nativa da skill operacional efficient-batch-code-modification (dry-run prévio em memória, single-turn batching e diffs cirúrgicos mínimos) para todas as tarefas de escrita, refatoração e alteração de código. Atualizado prompt-structuring.agent.md para injetar compulsoriamente a constraint de batching sem requerer intervenção manual do usuário. Atualizados todos os agents executores de código (database-specialist e 25 especialistas de domínio em frontend/angular, backend/spring-boot, backend/spring-reactive e backend/ejb) com a skill e source_docs correspondentes. Validado atomicamente. | 2026-09-06 (43) — A pedido do usuario ('crie uma nova stack para Java legado EJB seguindo rigorosamente o padrao de ecossistema de dominio do repositorio (type: stack)...'), criado o ecossistema de dominio backend para Java Legado EJB em .github/agents/backend/ejb/: pesquisa previa compulsoria via @deep-search de diretrizes, padroes e tooling (JUnit 4/5, Mockito POJO unit tests, OpenEJB/TomEE Embedded, Arquillian com ShrinkWrap, Testcontainers para banco legado, CMT/BMT, MDB, mitigacao de deadlocks JTA e vazamentos de Stateful Beans); criado sub-catalogo ejb-catalog.yaml com os 7 especialistas canônicos (ejb-arch-advisor [Read-Only], ejb-feature-developer [Implementer], ejb-bug-fixer [Fixer], ejb-perf-tuner [Performance], ejb-unit-test-writer [Tester], ejb-integration-test-writer [Tester], ejb-test-fixer [Fixer]); criado supervisor hierarquico ejb-router.agent.md com R-042, banner de visibilidade de fluxo e suporte ao Fluxo 2 TDD (@test-strategy); e realizada a quadrupla sincronizacao atomica global obrigatoria (R-015) em catalog.yaml, routing-graph.yaml, agent-router.agent.md e README.md. Validado via get_errors — 0 erros. | 2026-09-06 (42) — A pedido do usuario ('temos governance-factory.agent.md e queria que ele ao ser solicitado para criar uma nova stack, exemplo: ejb, ele estruturasse criando agents especialistas + router + catalog e pasta seguindo o padrao que adotamos, faz sentido? -> atualize'), estendido governance-factory (v1.1.0 -> v1.2.0) e a skill governance-factory-patterns/SKILL.md com o novo tipo canônico 'type: stack': suporte completo à criação de novos ecossistemas de domínio tecnológico isolados (.github/agents/<camada>/<stack>/), contendo supervisor (<stack>-router com R-042, banner de visibilidade de fluxo e suporte ao Fluxo 2 TDD), sub-catálogo local (<stack>-catalog.yaml) e pacote canônico de especialistas (.agent.md) de frontend ou backend, com pesquisa prévia compulsória via @deep-search e quádrupla sincronização atômica global obrigatória (catalog.yaml, routing-graph.yaml, agent-router.agent.md e README.md). Validado com get_errors e pytest — 0 erros. | 2026-09-04 (41) — A pedido do usuario ('no contexto do nosso projeto faz sentido esse arquivo ficar nessa pasta docs/ai-context/evals/casos-roteamento.yaml? pra mim deveria ficar dentro da pasta agents, qual sua avaliacao' -> 'opcao A'), migrada a suite completa de evals de docs/ai-context/evals/ para .github/agents/evals/ (casos-roteamento.yaml, casos-code-summarizer.yaml, fixtures/): elevando coesao de dominio e alinhando os testes de regressao de agents junto aos proprios agents em .github/agents/. Atualizados atomicamente: CLAUDE.md (R-040), copilot-instructions.md, agent-router.agent.md, agent-auditor.agent.md, prompt-structuring.agent.md, code-summarizer.agent.md, snippets/code-summarizer/README.md, agent-evals-lab/SKILL.md, agent-memory-policy/SKILL.md, docs/ai-context/catalog.yaml, README.md e tests/code-summarizer/conftest.py + tests. Validado via pytest (19 passed, 1 skipped pendente) e get_errors — 0 erros. | 2026-09-04 (40) — A pedido do usuario ('preciso que o governance-factory.agent.md possa ser invocado para criar agents, prompts e skills. Antes de criar ele deve delegar ao deep-search.agent.md para fazer uma pesquisa na web quando disponivel sobre as melhores diretrizes e skills para o agent, prompt ou skill, apos o retorno da pesquisa ao solicitante governance-factory ele deve prossegir normal o seu papel. A criacao de qualquer um desses devem sempre seguir esse fluxo'), formalizado o fluxo compulsorio de pesquisa previa de mercado e governanca: governance-factory (v1.0.0 -> v1.1.0) passa a exigir delegacao previa ao @deep-search via run_subagent antes de materializar a criacao de qualquer novo agent, prompt ou skill; a sintese de diretrizes e skills recomendadas retornada pelo deep-search e consumida pelo governance-factory para nortear o design e enriquecer o artefato antes de prosseguir com template canonico, validacao de model, gate de autocritica e atualizacao atomica de catalogo (R-015). Atualizados atomicamente: governance-factory.agent.md (novo fluxo pre-criacao, decision tree, template de invocacao, checklist, formato de saida com validacao da pesquisa previa, anti-padroes), governance-factory-patterns/SKILL.md (Decision Tree §1, checklist §3, validacao §4, anti-padroes §6), deep-search.agent.md (gatilhos de deriva e quando delegar), catalog.yaml (es