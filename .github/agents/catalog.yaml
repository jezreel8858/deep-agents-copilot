ts expandido para incluir cross-referencia mutua spring-boot-engineer<->spring-reactive-engineer (jah existia antes da rodada anterior de gaps), e 4 outros blocos (code-summarizer, performance-agent, debugger, database-specialist) com related_agents apontando para os 3 agents corrigidos para os novos nomes. agent-router.agent.md: tabela de conhecimento, decision tree e lista de specialists atualizadas — aproveitado para corrigir tambem descricao stale 'Advisory — nunca implementa' (os 3 sao perfil hibrido desde v2.0.0, inconsistencia pre-existente nao relacionada ao rename mas corrigida por estar na mesma linha). Demais arquivos vivos sincronizados: .github/copilot-instructions.md (diagrama de fluxo + lista 'Agents atuais'), .github/agents/README.md (tabela de catalogo + tabela de quick-routing), .github/skills/.index.json (13 skills com related_agents contendo @angular/@spring-boot/@spring-reactive renomeados via script Python), 10 SKILL.md com source_docs apontando para os .agent.md renomeados (angular-frontend-patterns, angular-implementation-patterns, angular-responsive-ui-patterns, design-system-component-contracts, specialist-hybrid-advisory-implementation-patterns, java-jdk-backend-governance, spring-boot-backend-patterns, spring-boot-implementation-patterns [+ 2 mencoes prosa de @spring-reactive na matriz de decisao de concorrencia], spring-reactive-implementation-patterns [+ 1 mencao prosa], spring-reactive-webflux-patterns), handoff-governance/SKILL.md (tabela de nao-deriva do perfil hibrido), agent-contracts/SKILL.md (exemplo de banner + tabela de templates por perfil, aproveitado para corrigir 'sem implementar' stale), .github/skills/README.md (descricao da skill specialist-hybrid), .github/prompts/init-context.prompt.md (4 mencoes em deteccao de ambiente Java/JDK), .github/agents/routing-graph.yaml (3 nos + 3 arestas + nota de prosa sobre perfil hibrido no retorno universal R-042), docs/ai-context/evals/casos-roteamento.yaml (8 casos: canon-018/019 [bar