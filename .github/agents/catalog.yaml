    keywords:
      - "router"
      - "triagem"
      - "entrypoint"
      - "roteamento"
    prerequisite_docs:
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".github/agents/README.md"
      - ".github/agents/catalog.yaml"
    related_agents:
      - "bug-triage"
      - "test-strategy"
      - "refactor-planner"
      - "deep-search"
      - "docs-engineer"
      - "tech-solution-architect"
    tools:
      - "read_file"
      - "file_search"
      - "grep_search"
      - "ask_questions"
      - "run_subagent"
      - "context-mode/ctx_search"
    related_skills:
