# Configuração do OpenTelemetry Collector Contrib
# Recebe dados OTLP da IDE (Copilot / Claude Code) na porta 4318 e despacha para o Langfuse e arquivo local

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:*"
            - "http://127.0.0.1:*"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Descarta ruido interno de instrumentacao nativa da IDE (plugin GitHub
  # Copilot) que nao agrega valor a depuracao de FLUXO DE AGENTS (quem
  # desviou do workflow, qual handoff falhou, qual tool/agent causou o
  # problema). Esses spans "session.timing.*" sao breadcrumbs de
  # performance de inicializacao interna do proprio plugin da IDE (parsing
  # de preamble, resolucao de modelo, carga de skills/system prompt,
  # inicializacao de LSP/MCP, cache de tools, prompt do shell, etc.) --
  # nao carregam `gen_ai.agent.name`, `gen_ai.tool.name` nem qualquer dado
  # de decisao/roteamento e POLUEM o dashboard do Langfuse (ex.: analise
  # de ponta-a-ponta de um prompt de refatoracao/migracao de framework).
  # Mantemos intactos os spans uteis: "chat: ...", "invoke_agent",
  # "execute_tool: ..." e os customizados "governance.*" (emitidos por
  # local_chat_gateway/telemetry.py) -- estes SIM carregam `gen_ai.*` /
  # `deep_agents.*` e sao a evidencia necessaria para identificar desvio
  # de agent, falha de handoff e violacao de guardrail.
  filter/drop_ide_session_timing_noise:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, "^session\\.timing\\..*")'
      spanevent:
        - 'IsMatch(name, "^session\\.timing\\..*")'

  resource/defaults:
    attributes:
      - key: service.namespace
        value: deep-agents
        action: upsert
      - key: deployment.environment
        value: local
        action: insert

  transform/semconv:
    trace_statements:
      - context: span
        statements:
          - set(attributes["gen_ai.provider.name"], attributes["gen_ai.system"]) where attributes["gen_ai.provider.name"] == nil and attributes["gen_ai.system"] != nil
          - delete_key(attributes, "gen_ai.system")
          - set(attributes["gen_ai.conversation.id"], attributes["agent.conversation.id"]) where attributes["gen_ai.conversation.id"] == nil and attributes["agent.conversation.id"] != nil
          - set(attributes["langfuse.session.id"], attributes["gen_ai.conversation.id"]) where attributes["gen_ai.conversation.id"] != nil
          - set(attributes["gen_ai.tool.type"], "mcp") where attributes["mcp.method.name"] != nil

  transform/redact-secrets:
    trace_statements:
      - context: span
        statements:
          - replace_all_patterns(attributes, "value", "(ghp_|gho_|github_pat_)[A-Za-z0-9_]+", "***REDACTED_GH***")
          - replace_all_patterns(attributes, "value", "(sk|pk)-lf-[A-Za-z0-9-]+", "***REDACTED_LF***")
          - replace_all_patterns(attributes, "value", "sk-[A-Za-z0-9]{20,}", "***REDACTED_KEY***")
          - replace_all_patterns(attributes, "value", "Bearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer ***REDACTED***")
          - replace_all_patterns(attributes, "value", "AKIA[0-9A-Z]{16}", "***REDACTED_AWS***")

  batch:
    timeout: 1s
    send_batch_size: 64

connectors:
  spanmetrics:
    histogram:
      unit: ms
    dimensions:
      - name: gen_ai.operation.name
      - name: gen_ai.tool.name
      - name: gen_ai.tool.type
      - name: tool.execution.status
      - name: gen_ai.agent.name

exporters:
  otlphttp/langfuse:
    # Langfuse Cloud SaaS endpoint (EU: https://cloud.langfuse.com/api/public/otel | US: https://us.cloud.langfuse.com/api/public/otel)
    endpoint: "${env:LANGFUSE_ENDPOINT:-https://cloud.langfuse.com/api/public/otel}"
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTLP_AUTH}"

  file/traces:
    path: /var/log/otel/traces.json
    rotation:
      max_megabytes: 100
      max_backups: 5

  file/metrics:
    path: /var/log/otel/metrics.json
    rotation:
      max_megabytes: 50
      max_backups: 3

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop_ide_session_timing_noise, resource/defaults, transform/semconv, transform/redact-secrets, batch]
      exporters: [otlphttp/langfuse, spanmetrics, debug]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, resource/defaults, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/defaults, transform/redact-secrets, batch]
      exporters: [debug]
