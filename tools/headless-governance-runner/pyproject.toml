[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "governance-runner"
version = "0.1.0"
description = "Motor determinístico de roteamento/governança (routing/), geração/avaliação sintética (synth/) e runner headless (CI) do Copilot SDK. Ver docs/architecture/BLUEPRINT_COPILOT_SDK_HEADLESS_RUNNER.md."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
sdk = ["github-copilot-sdk>=1.0.0"]
otel = []
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
]

[project.scripts]
governance-runner = "governance_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
governance_runner = ["routing/*.json", "synth/*.sql", "synth/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests/routing_unit", "tests/runner_unit", "tests/synth_unit", "tests/synth_e2e"]

[tool.mypy]
strict = true
python_version = "3.11"
