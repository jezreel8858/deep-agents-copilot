[project]
name = "deep-agents-copilot-dev"
version = "0.0.0"
description = "Ambiente de desenvolvimento/testes do deep-agents-copilot (sem empacotamento)."
requires-python = ">=3.11"
dependencies = []
# Fonte de verdade do ambiente uv. tests/requirements.txt permanece como fallback (pip/CI).
# A configuracao do pytest fica exclusivamente em pytest.ini.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "PyYAML>=6.0",
    "jsonschema>=4.20.0",
]
[tool.uv]
package = false
default-groups = ["dev"]
